// ── SM-2 ALGORITHM (FIXED) ─────────────────────────────────────
const SM2={
    init:()=>({ef:2.5,interval:0,reps:0,nextReview:null,lastReview:null,totalReviews:0,history:[]}),
    
    // quality: 1=Tekrar(Again), 2=Zor(Hard), 3=Orta(Good), 4=Kolay(Easy), 5=Mükemmel(Perfect)
    review:(card, quality)=>{
        const q=Math.max(1,Math.min(5,quality));
        const prevEF=card.ef||2.5;
        const prevInterval=card.interval||0;
        const prevReps=card.reps||0;
        
        // EF update (only when q >= 3, but EF is always recalculated)
        const newEF=Math.max(1.3, prevEF + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
        
        let newInterval, newReps;
        if(q<3){
            // Failed: restart
            newInterval=1;
            newReps=0;
        } else {
            // Success
            newReps=prevReps+1;
            if(newReps===1) newInterval=1;
            else if(newReps===2) newInterval=6;
            else newInterval=Math.round(prevInterval*newEF);
        }
        
        const today=new Date().toISOString().split('T')[0];
        const nd=new Date();nd.setDate(nd.getDate()+newInterval);
        
        return{
            ef:newEF,
            interval:newInterval,
            reps:newReps,
            nextReview:nd.toISOString().split('T')[0],
            lastReview:today,
            totalReviews:(card.totalReviews||0)+1,
            history:[...(card.history||[]).slice(-19),{date:today,q,interval:newInterval}]
        };
    },
    
    // Ebbinghaus forgetting curve: R = e^(-t/S)
    // S (stability) ≈ interval
    retention:(daysSince,stability)=>{
        if(stability<=0)return 0;
        return Math.round(100*Math.exp(-daysSince/Math.max(1,stability)));
    },
    
    // Get current retention % for a card
    getRetention:(card)=>{
        if(!card||!card.lastReview)return 0;
        const days=Math.max(0,Math.floor((Date.now()-new Date(card.lastReview+'T12:00:00').getTime())/86400000));
        return SM2.retention(days,card.interval||1);
    },
    
    // Is card due for review today or overdue?
    isDue:(card)=>{
        if(!card.nextReview)return true;
        const today=new Date().toISOString().split('T')[0];
        return card.nextReview<=today;
    },
    
    // Human-readable next review label
    nextLabel:(card)=>{
        if(!card.nextReview||SM2.isDue(card))return 'Bugün';
        const days=Math.max(0,Math.ceil((new Date(card.nextReview+'T12:00:00').getTime()-Date.now())/86400000));
        if(days===1)return 'Yarın';
        return `${days}g sonra`;
    },
    
    // Category based on EF
    strengthLabel:(ef)=>ef>=2.2?'Güçlü':ef>=1.6?'Orta':'Zayıf'
};

// Linear regression for score prediction
const linReg=vals=>{
    const n=vals.length;if(n<2)return null;
    const xm=(n-1)/2,ym=vals.reduce((a,b)=>a+b,0)/n;
    const slope=vals.reduce((s,y,x)=>s+(x-xm)*(y-ym),0)/vals.reduce((s,_,x)=>s+(x-xm)**2,1);
    return{slope,predict:x=>Math.max(0,ym+slope*(x-xm))};
};

// Retention Ring SVG
const SRRing=memo(({pct,size=72,label})=>{
    const r=size/2-6;const circ=2*Math.PI*r;const off=circ-(pct/100)*circ;const c=retC(pct);
    return<div style={{textAlign:'center'}}>
        <svg width={size} height={size}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1a1a2e" strokeWidth="6"/>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={c} strokeWidth="6"
                strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
                transform={`rotate(-90 ${size/2} ${size/2})`} className="sr-ring"
                style={{filter:`drop-shadow(0 0 4px ${c}88)`}}/>
            <text x={size/2} y={size/2+5} textAnchor="middle" fill="#fff" fontSize={size>60?13:10} fontWeight="bold">{pct}%</text>
        </svg>
        {label&&<div style={{fontSize:'10px',color:'#6b7280',marginTop:'2px'}}>{label}</div>}
    </div>;
});

// ── HEATMAP ────────────────────────────────────────────────────
const Heatmap=memo(({sessions})=>{
    const now=new Date();
    const cells=[];
    for(let i=90;i>=0;i--){
        const d=new Date(now);d.setDate(d.getDate()-i);
        const ds=d.toISOString().split('T')[0];
        const mins=sessions.filter(s=>s.date===ds).reduce((a,s)=>a+dInt(s),0);
        const l=mins>=180?4:mins>=120?3:mins>=60?2:mins>0?1:0;
        const colors=['#1a1a2e','#1e3a2e','#2d5c40','#3d8050','#4dab62'];
        cells.push(<div key={ds} style={{width:'10px',height:'10px',backgroundColor:colors[l],borderRadius:'2px',flexShrink:0}} title={`${fdf(ds)}: ${mins}dk`}/>);
    }
    return<div style={{display:'flex',flexWrap:'wrap',gap:'2px'}}>{cells}</div>;
});

// ── POMODORO ────────────────────────────────────────────────────
const Pomodoro=memo(({onComplete})=>{
    const[mode,setMode]=useState('focus');
    const[tl,setTl]=useState(25*60);
    const[run,setRun]=useState(false);
    const[done,setDone]=useState(0);
    const ref=useRef(null);
    const totals={focus:25*60,break:5*60,long:15*60};
    useEffect(()=>{
        if(run&&tl>0){ref.current=setInterval(()=>setTl(t=>t-1),1000)}
        else if(tl===0){
            clearInterval(ref.current);
            if(mode==='focus'){setDone(d=>d+1);onComplete&&onComplete(25);setMode('break');setTl(5*60)}
            else{setMode('focus');setTl(25*60)}
            setRun(false);
        }
        return()=>clearInterval(ref.current);
    },[run,tl,mode]);
    const tot=totals[mode]||25*60;
    const pct=((tot-tl)/tot)*100;
    const r=48;const circ=2*Math.PI*r;const off=circ-(pct/100)*circ;
    const fmt=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    return<div style={{textAlign:'center'}}>
        <div style={{display:'flex',justifyContent:'center',gap:'6px',marginBottom:'12px'}}>
            {[['focus','🎯 Odak',25*60],['break','☕ Kısa',5*60],['long','🛋️ Uzun',15*60]].map(([m,l,t])=>(
                <button key={m} onClick={()=>{setMode(m);setTl(t);setRun(false)}} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:mode===m?'#6c63ff':'#1a1a2e',color:mode===m?'#fff':'#9ca3af'}}>{l}</button>
            ))}
        </div>
        <div style={{position:'relative',display:'inline-block',marginBottom:'12px'}}>
            <svg width="110" height="110">
                <circle cx="55" cy="55" r={r} fill="none" stroke="#1a1a2e" strokeWidth="8"/>
                <circle cx="55" cy="55" r={r} fill="none" stroke={mode==='focus'?'#6c63ff':'#00c853'} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round" transform="rotate(-90 55 55)" style={{transition:'stroke-dashoffset .3s',filter:`drop-shadow(0 0 8px ${mode==='focus'?'#6c63ff':'#00c853'}88)`}}/>
                <text x="55" y="50" textAnchor="middle" fill="#fff" fontSize="22" fontWeight="bold">{fmt(tl)}</text>
                <text x="55" y="70" textAnchor="middle" fill="#6b7280" fontSize="12">{done}🍅</text>
            </svg>
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px'}}>
            <Btn onClick={()=>setRun(!run)} v={run?'danger':'primary'}>{run?'⏸ Dur':'▶ Başlat'}</Btn>
            <Btn onClick={()=>{setTl(tot);setRun(false)}} v="ghost">↺</Btn>
        </div>
    </div>;
});

// ── LIVE TIMER ─────────────────────────────────────────────────
const LiveTimer=memo(({onSave,notify})=>{
    const[run,setRun]=useState(false);const[elapsed,setElapsed]=useState(0);
    const[sub,setSub]=useState('matematik');const[topic,setTopic]=useState('');const[examType,setExamType]=useState('TYT');
    const startRef=useRef(null);const intRef=useRef(null);
    const start=()=>{startRef.current=Date.now()-elapsed*1000;intRef.current=setInterval(()=>setElapsed(Math.floor((Date.now()-startRef.current)/1000)),1000);setRun(true)};
    const stop=()=>{clearInterval(intRef.current);setRun(false)};
    const reset=()=>{stop();setElapsed(0)};
    const save=()=>{
        const mins=Math.floor(elapsed/60);
        if(mins<1){notify('⚠️ En az 1 dakika!');return}
        if(!topic.trim()){notify('⚠️ Konu adı gir!');return}
        onSave({subject:sub,topic,dur:mins.toString(),qc:'0',examType});reset();setTopic('');
    };
    useEffect(()=>()=>clearInterval(intRef.current),[]);
    const h=Math.floor(elapsed/3600),m=Math.floor((elapsed%3600)/60),sec=elapsed%60;
    const fmt=h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return<div>
        <div style={{textAlign:'center',margin:'12px 0'}}><div style={{fontFamily:'monospace',fontSize:'44px',fontWeight:'bold',color:run?'#6c63ff':'#e5e7eb'}}>{fmt}</div></div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'12px'}}>
            {['TYT','AYT'].map(t=><button key={t} onClick={()=>setExamType(t)} style={{padding:'5px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:'700',border:'none',cursor:'pointer',backgroundColor:examType===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#1a1a2e',color:examType===t?'#fff':'#9ca3af'}}>{t}</button>)}
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'12px'}}>
            <Btn onClick={run?stop:start} v={run?'danger':'primary'}>{run?'⏸ Dur':'▶ Başlat'}</Btn>
            {!run&&elapsed>0&&<Btn onClick={save} v="success">💾 Kaydet ({Math.floor(elapsed/60)}dk)</Btn>}
            {elapsed>0&&<Btn onClick={reset} v="ghost">↺</Btn>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            <Sel label="Ders" value={sub} onChange={setSub} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
            <Inp label="Konu" value={topic} onChange={setTopic} placeholder="Konu adı..."/>
        </div>
    </div>;
});

// ── FLASHCARDS (SM-2 FIXED) ────────────────────────────────────
// Now receives flashcards/setFlashcards from App (shared state)
const Flashcards=memo(({flashcards,setFlashcards,notify,addXp})=>{
    const[mode,setMode]=useState('list'); // list | study | result
    const[studyQueue,setStudyQueue]=useState([]); // ordered list to study
    const[cur,setCur]=useState(0);
    const[flipped,setFlipped]=useState(false);
    const[stats,setStats]=useState({again:0,hard:0,good:0,easy:0});
    const[form,setForm]=useState({sub:'matematik',front:'',back:'',tag:''});
    const[filter,setFilter]=useState('all');
    const[showDueOnly,setShowDueOnly]=useState(false);

    const dueCards=useMemo(()=>flashcards.filter(c=>SM2.isDue(c)),[flashcards]);
    
    const displayCards=useMemo(()=>{
        let list=filter==='all'?flashcards:flashcards.filter(c=>c.sub===filter);
        if(showDueOnly)list=list.filter(c=>SM2.isDue(c));
        return list;
    },[flashcards,filter,showDueOnly]);

    const avgRet=useMemo(()=>{
        const active=flashcards.filter(c=>c.totalReviews>0);
        if(!active.length)return 0;
        return Math.round(active.reduce((a,c)=>a+SM2.getRetention(c),0)/active.length);
    },[flashcards]);

    const addCard=()=>{
        if(!form.front.trim()||!form.back.trim()){notify('⚠️ Soru ve cevap gerekli!');return}
        const newCard={id:Date.now(),sub:form.sub,front:form.front,back:form.back,tag:form.tag,...SM2.init()};
        setFlashcards(p=>[...p,newCard]);
        setForm(p=>({...p,front:'',back:'',tag:''}));
        addXp(2);notify('🃏 Kart eklendi! +2 XP');
    };

    const startStudy=(dueOnly=false)=>{
        let queue=dueOnly?dueCards:[...displayCards];
        if(!queue.length){notify('⚠️ Çalışılacak kart yok!');return}
        // Sort: overdue/due first, then by lowest retention
        queue=[...queue].sort((a,b)=>{
            const aDue=SM2.isDue(a)?0:1,bDue=SM2.isDue(b)?0:1;
            if(aDue!==bDue)return aDue-bDue;
            return SM2.getRetention(a)-SM2.getRetention(b);
        });
        setStudyQueue(queue);
        setCur(0);setFlipped(false);setStats({again:0,hard:0,good:0,easy:0});setMode('study');
    };

    const rateCard=useCallback((quality)=>{
        // quality: 1=again, 2=hard, 4=good, 5=easy
        const card=studyQueue[cur];
        if(!card)return;
        
        const result=SM2.review(card,quality);
        setFlashcards(prev=>prev.map(c=>c.id===card.id?{...c,...result}:c));
        
        const qKey={1:'again',2:'hard',4:'good',5:'easy'}[quality]||'good';
        const newStats={...stats,[qKey]:(stats[qKey]||0)+1};
        setStats(newStats);
        
        if(cur<studyQueue.length-1){
            setCur(c=>c+1);
            setFlipped(false);
        } else {
            const xpGained=newStats.good*3+newStats.easy*5+newStats.hard*1;
            addXp(xpGained);
            notify(`✅ Tur tamamlandı! +${xpGained} XP`);
            setMode('result');
        }
    },[studyQueue,cur,stats,setFlashcards,addXp,notify]);

    // STUDY MODE
    if(mode==='study'){
        const card=studyQueue[cur];
        if(!card)return null;
        const ret=SM2.getRetention(card);
        const sub=SUBS.find(s=>s.id===card.sub);
        const daysOverdue=card.nextReview&&card.nextReview<td()?Math.floor((Date.now()-new Date(card.nextReview+'T12:00:00').getTime())/86400000):0;
        return<div className="space-y-4">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'14px',fontWeight:'600',color:'#fff'}}>{cur+1}/{studyQueue.length}</span>
                <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                    {SM2.isDue(card)&&<span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:'rgba(255,82,82,.2)',color:'#ff5252',fontWeight:'600'}}>
                        {daysOverdue>0?`+${daysOverdue}g gecikti`:'Bugün vadesi doldu'}
                    </span>}
                    <SRRing pct={ret} size={50}/>
                </div>
                <Btn onClick={()=>setMode('list')} v="ghost" s="sm">× Çık</Btn>
            </div>
            <PBar value={cur+1} max={studyQueue.length} color="#6c63ff" label={false} size="sm"/>
            
            {/* Flip card */}
            <div style={{height:'240px',cursor:'pointer',position:'relative',perspective:'1000px'}} onClick={()=>setFlipped(!flipped)}>
                <div style={{position:'relative',height:'100%',transformStyle:'preserve-3d',transition:'transform .55s',transform:flipped?'rotateY(180deg)':'rotateY(0deg)'}}>
                    {/* Front */}
                    <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden',backgroundColor:'#1a1a2e',border:`2px solid ${sub?.color||'#6c63ff'}`,borderRadius:'20px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px'}}>
                        <div style={{fontSize:'11px',color:sub?.color||'#6c63ff',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>{sub?.icon} {sub?.name}</div>
                        <div style={{fontSize:'20px',fontWeight:'bold',color:'#fff',textAlign:'center',lineHeight:'1.4'}}>{card.front}</div>
                        <div style={{position:'absolute',bottom:'14px',fontSize:'11px',color:'#6b7280'}}>👆 Görmek için dokun</div>
                        <div style={{position:'absolute',bottom:'14px',right:'14px',fontSize:'11px',color:'#4b5563'}}>EF: {(card.ef||2.5).toFixed(1)}</div>
                    </div>
                    {/* Back */}
                    <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden',transform:'rotateY(180deg)',backgroundColor:'#1a1a2e',border:'2px solid #00c853',borderRadius:'20px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px'}}>
                        <div style={{fontSize:'11px',color:'#00c853',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>✅ Cevap</div>
                        <div style={{fontSize:'17px',color:'#fff',textAlign:'center',lineHeight:'1.5'}}>{card.back}</div>
                        <div style={{position:'absolute',bottom:'14px',right:'14px',fontSize:'11px',color:'#6b7280'}}>→ {SM2.nextLabel(card)}</div>
                    </div>
                </div>
            </div>
            
            {/* Rating buttons */}
            {flipped&&<div>
                <div style={{fontSize:'13px',color:'#9ca3af',textAlign:'center',marginBottom:'10px'}}>Bu kartı ne kadar iyi bildin?</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
                    {[
                        {q:1,label:'😰 Tekrar',sub:'<1g',c:'#ff5252'},
                        {q:2,label:'😟 Zor',   sub:`~${Math.max(1,Math.round((card.interval||1)*1.2))}g`,c:'#ff9800'},
                        {q:4,label:'😊 İyi',   sub:`~${Math.round((card.interval||0)<2?1:(card.interval||1)*(card.ef||2.5))}g`,c:'#6c63ff'},
                        {q:5,label:'😄 Kolay', sub:`~${Math.round(((card.interval||0)<2?6:(card.interval||1)*(card.ef||2.5))*1.1)}g`,c:'#00c853'},
                    ].map(({q,label,sub,c})=>(
                        <button key={q} onClick={()=>rateCard(q)}
                            style={{backgroundColor:c+'15',border:`1px solid ${c}44`,borderRadius:'14px',padding:'10px 6px',textAlign:'center',cursor:'pointer',color:c,transition:'all .15s'}}
                            onMouseOver={e=>{e.currentTarget.style.backgroundColor=c+'30'}}
                            onMouseOut={e=>{e.currentTarget.style.backgroundColor=c+'15'}}>
                            <div style={{fontSize:'13px',fontWeight:'700'}}>{label}</div>
                            <div style={{fontSize:'10px',opacity:.7,marginTop:'2px'}}>{sub}</div>
                        </button>
                    ))}
                </div>
                <p style={{fontSize:'11px',color:'#4b5563',textAlign:'center',marginTop:'8px'}}>Sonraki tekrar tarihi otomatik hesaplanır (SM-2)</p>
            </div>}
        </div>;
    }

    // RESULT MODE
    if(mode==='result')return<div style={{textAlign:'center'}} className="space-y-4">
        <div style={{fontSize:'48px'}}>🎉</div>
        <h3 style={{fontSize:'20px',fontWeight:'bold',color:'#fff'}}>Tur Tamamlandı!</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
            {[['😰 Tekrar','again','#ff5252'],['😟 Zor','hard','#ff9800'],['😊 İyi','good','#6c63ff'],['😄 Kolay','easy','#00c853']].map(([l,k,c])=>(
                <Card key={k} style={{textAlign:'center',padding:'12px 8px'}}>
                    <div style={{fontSize:'20px',fontWeight:'bold',color:c}}>{stats[k]||0}</div>
                    <div style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>{l}</div>
                </Card>
            ))}
        </div>
        <div style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'12px',fontSize:'13px',color:'#9ca3af'}}>
            Sonraki tekrar tarihleri SM-2 algoritması ile güncellendi ✓
        </div>
        <Btn onClick={()=>setMode('list')} style={{width:'100%',justifyContent:'center'}}>Listeye Dön</Btn>
    </div>;

    // LIST MODE
    return<div className="space-y-4">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px'}}>
            <div>
                <h2 style={{fontSize:'16px',fontWeight:'bold',color:'#fff',margin:0}}>🃏 Flashcard'lar</h2>
                {flashcards.length>0&&<div style={{fontSize:'12px',color:'#6b7280',marginTop:'2px'}}>Hafıza: %{avgRet} | {dueCards.length} kart bugün</div>}
            </div>
            <div style={{display:'flex',gap:'8px'}}>
                <Btn onClick={()=>startStudy(true)} v={dueCards.length>0?'danger':'ghost'} s="sm" disabled={!dueCards.length}>
                    ⚠️ Bugün ({dueCards.length})
                </Btn>
                <Btn onClick={()=>startStudy(false)} v="success" s="sm">▶ Tümü ({displayCards.length})</Btn>
            </div>
        </div>

        {/* Add card form */}
        <Card title="➕ Yeni Kart">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'8px'}}>
                <Sel label="Ders" value={form.sub} onChange={v=>setForm(p=>({...p,sub:v}))} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
                <Inp label="Etiket" value={form.tag} onChange={v=>setForm(p=>({...p,tag:v}))} placeholder="Opsiyonel..."/>
            </div>
            <Inp label="Soru / Kavram" value={form.front} onChange={v=>setForm(p=>({...p,front:v}))} placeholder="sin(30°) = ?" className="mb-2"/>
            <Inp label="Cevap" value={form.back} onChange={v=>setForm(p=>({...p,back:v}))} placeholder="1/2" className="mb-2"/>
            <Btn onClick={addCard} style={{width:'100%',justifyContent:'center'}}>+ Ekle (+2 XP)</Btn>
        </Card>

        {/* Filters */}
        <div style={{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>
            <button onClick={()=>setShowDueOnly(!showDueOnly)} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:showDueOnly?'#ff5252':'#1a1a2e',color:showDueOnly?'#fff':'#9ca3af'}}>⚠️ Bugün</button>
            <button onClick={()=>setFilter('all')} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:filter==='all'?'#6c63ff':'#1a1a2e',color:filter==='all'?'#fff':'#9ca3af'}}>Tümü ({flashcards.length})</button>
            {SUBS.map(s=>{const c=flashcards.filter(x=>x.sub===s.id).length;if(!c)return null;return<button key={s.id} onClick={()=>setFilter(s.id)} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:filter===s.id?s.color:'#1a1a2e',color:filter===s.id?'#fff':'#9ca3af'}}>{s.name}({c})</button>})}
        </div>

        {/* Card list */}
        <div className="space-y-2">
            {displayCards.length===0
                ?<Card><p style={{color:'#6b7280',textAlign:'center',padding:'20px 0'}}>Kart yok. Yukarıdan ekle!</p></Card>
                :displayCards.map(c=>{
                    const sub=SUBS.find(s=>s.id===c.sub);
                    const ret=SM2.getRetention(c);
                    const due=SM2.isDue(c);
                    return<Card key={c.id} style={{position:'relative'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                            <div style={{flex:1,paddingRight:'12px'}}>
                                <div style={{display:'flex',gap:'6px',marginBottom:'6px',flexWrap:'wrap',alignItems:'center'}}>
                                    <span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:sub?.color+'22',color:sub?.color,fontWeight:'600'}}>{sub?.icon} {sub?.name}</span>
                                    {due&&<span style={{fontSize:'11px',padding:'2px 6px',borderRadius:'999px',backgroundColor:'rgba(255,82,82,.2)',color:'#ff5252',fontWeight:'700'}}>Tekrar Zamanı!</span>}
                                    {!due&&<span style={{fontSize:'11px',color:'#6b7280'}}>{SM2.nextLabel(c)}</span>}
                                </div>
                                <div style={{fontSize:'14px',fontWeight:'600',color:'#fff',marginBottom:'2px'}}>{c.front}</div>
                                <div style={{fontSize:'12px',color:'#6b7280'}}>{c.back}</div>
                                <div style={{display:'flex',gap:'10px',marginTop:'6px',fontSize:'11px',color:'#4b5563'}}>
                                    <span>EF: {(c.ef||2.5).toFixed(2)}</span>
                                    <span>Aralık: {c.interval||0}g</span>
                                    <span>Tekrar: {c.totalReviews||0}×</span>
                                    <span style={{color:retC(ret)}}>%{ret}</span>
                                </div>
                            </div>
                            <SRRing pct={ret} size={50}/>
                        </div>
                        <button onClick={()=>setFlashcards(p=>p.filter(x=>x.id!==c.id))}
                            style={{position:'absolute',top:'10px',right:'10px',color:'#4b5563',background:'none',border:'none',cursor:'pointer',fontSize:'16px',lineHeight:1}}
                            onMouseOver={e=>e.target.style.color='#ff5252'} onMouseOut={e=>e.target.style.color='#4b5563'}>×</button>
                    </Card>;
                })
            }
        </div>
    </div>;
});

// ── BRAIN LAB ─────────────────────────────────────────────────
const BrainLab=memo(({flashcards,sessions,exams})=>{
    const[tab,setTab]=useState('dashboard');
    const curveRef=useRef(null);const curveCI=useRef(null);
    const retBarRef=useRef(null);const retBarCI=useRef(null);

    const stats=useMemo(()=>{
        const active=flashcards.filter(c=>c.totalReviews>0);
        const due=flashcards.filter(c=>SM2.isDue(c));
        const avgRet=active.length?Math.round(active.reduce((a,c)=>a+SM2.getRetention(c),0)/active.length):0;
        const avgEF=active.length?(active.reduce((a,c)=>a+(c.ef||2.5),0)/active.length).toFixed(2):'2.50';
        const avgInt=active.length?Math.round(active.reduce((a,c)=>a+(c.interval||0),0)/active.length):0;
        const critical=flashcards.filter(c=>SM2.getRetention(c)<40&&c.totalReviews>0);
        const totalReps=flashcards.reduce((a,c)=>a+(c.totalReviews||0),0);
        return{active:active.length,due:due.length,avgRet,avgEF,avgInt,critical:critical.length,totalReps,total:flashcards.length};
    },[flashcards]);

    const subRet=useMemo(()=>SUBS.map(s=>{
        const sc=flashcards.filter(c=>c.sub===s.id&&c.totalReviews>0);
        const ret=sc.length?Math.round(sc.reduce((a,c)=>a+SM2.getRetention(c),0)/sc.length):null;
        return{...s,ret,count:sc.length,due:flashcards.filter(c=>c.sub===s.id&&SM2.isDue(c)).length};
    }).filter(s=>s.count>0),[flashcards]);

        const reg=linReg(tots);if(!reg)return null;
        const n=tots.length;
        const predicted=reg.predict(n+2);
        const current=tots.slice(-3).reduce((a,b)=>a+b,0)/3;
        return{current:current.toFixed(1),predicted:Math.min(120,predicted).toFixed(1),slope:reg.slope.toFixed(2),exams:n,positive:reg.slope>0};
    },[exams]);

                <Card title="📊 Derse Göre Hafıza Tutma"><div style={{height:'180px'}}><canvas ref={retBarRef}/></div></Card>

const ExamChart=memo(({exams})=>{
    const r=useRef(null),ci=useRef(null);
    useEffect(()=>{
        if(!r.current||exams.length<2)return;
        if(ci.current){ci.current.destroy();ci.current=null}
        const tyt=[...exams].filter(e=>!e.examType||e.examType==='TYT').sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12);
        const ayt=[...exams].filter(e=>e.examType==='AYT').sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12);
        // Use TYT dates as x-axis (or all)
        const allDates=[...new Set([...tyt,...ayt].map(e=>e.date))].sort();
        if(!allDates.length)return;
        const getVal=(list,date)=>{const e=list.find(x=>x.date===date);return e?(e.tot||0):null};
        ci.current=new Chart(r.current,{type:'line',
            data:{labels:allDates.map(d=>fd(d)),datasets:[
                {label:'TYT (max 120)',data:allDates.map(d=>getVal(tyt,d)),borderColor:'#6c63ff',backgroundColor:'#6c63ff15',fill:true,tension:.3,pointRadius:4,spanGaps:true},
                {label:'AYT (max 80)', data:allDates.map(d=>getVal(ayt,d)),borderColor:'#ff9800',backgroundColor:'#ff980015',fill:true,tension:.3,pointRadius:4,spanGaps:true}
            ]},
            options:{responsive:true,maintainAspectRatio:false,
                plugins:{legend:{labels:{color:'#9ca3af',font:{size:10}}}},
                scales:{y:{beginAtZero:true,ticks:{color:'#6b7280'},grid:{color:'#1a1a2e'}},x:{ticks:{color:'#6b7280'},grid:{display:false}}}}});
        return()=>{if(ci.current){ci.current.destroy();ci.current=null}};
    },[exams]);
    if(exams.length<2)return null;
    return<Card title="📈 Puan Trendi" subtitle="TYT/AYT ayrı"><div style={{height:'200px'}}><canvas ref={r}/></div></Card>;
});

// ── FORMULA BOOK ───────────────────────────────────────────────
const FormulaBook=memo(()=>{
    const FORMULAS={
        fizik:[{name:'Newton 2. Yasa',formula:'F = m · a',unit:'N, kg, m/s²'},{name:'Kinetik Enerji',formula:'Ek = ½mv²',unit:'J'},{name:'Potansiyel Enerji',formula:'Ep = mgh',unit:'J'},{name:'Momentum',formula:'p = m · v',unit:'kg·m/s'},{name:'Hooke Yasası',formula:'F = k · x',unit:'N'},{name:'Ohm Yasası',formula:'V = I · R',unit:'V,A,Ω'},{name:'İvmeli Hareket',formula:'v = v₀ + at | x = v₀t + ½at²',unit:'m/s, m'}],
        kimya:[{name:'İdeal Gaz',formula:'PV = nRT',unit:'R=8.314 J/mol·K'},{name:'Molarite',formula:'M = n / V',unit:'mol/L'},{name:'pH',formula:'pH = -log[H⁺]',unit:''},{name:'Hess Yasası',formula:'ΔH = ΣΔHf(ürün) - ΣΔHf(tepken)',unit:'kJ/mol'},{name:'Tepkime Hızı',formula:'r = k[A]ⁿ[B]ᵐ',unit:'mol/L·s'}],
        matematik:[{name:'2. Derece Denklem',formula:'x = (-b ± √(b²-4ac)) / 2a',unit:''},{name:'Sinüs Teoremi',formula:'a/sinA = b/sinB = c/sinC',unit:''},{name:'Kosinüs Teoremi',formula:'c² = a² + b² - 2ab·cosC',unit:''},{name:'Çember',formula:'(x-a)²+(y-b)²=r²',unit:''},{name:'Kombinasyon',formula:'C(n,r) = n!/(r!(n-r)!)',unit:''},{name:'log(ab)',formula:'log(ab) = loga + logb',unit:''},{name:'Aritmetik Dizi',formula:'aₙ = a₁ + (n-1)d',unit:''}]
    };
    const[tab,setTab]=useState('fizik');const[search,setSearch]=useState('');
    const items=(FORMULAS[tab]||[]).filter(f=>!search||f.name.toLowerCase().includes(search.toLowerCase())||f.formula.toLowerCase().includes(search.toLowerCase()));
    return<div className="space-y-3">
        <Inp value={search} onChange={setSearch} placeholder="🔍 Formül ara..."/>
        <div style={{display:'flex',gap:'8px'}}>
            {['fizik','kimya','matematik'].map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:'6px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:tab===t?'#6c63ff':'#1a1a2e',color:tab===t?'#fff':'#9ca3af',textTransform:'capitalize'}}>{t}</button>)}
        </div>
        <div className="space-y-2">
            {items.map((f,i)=><Card key={i} style={{padding:'12px'}}>
                <div style={{fontSize:'13px',fontWeight:'600',color:'#e5e7eb',marginBottom:'6px'}}>{f.name}</div>
                <div style={{fontFamily:'monospace',fontSize:'15px',fontWeight:'bold',color:'#6c63ff',padding:'8px 10px',backgroundColor:'#0a0a0f',borderRadius:'8px'}}>{f.formula}</div>

                    <Inp label="Soru Sayısı" type="number" value={sF.qc} onChange={v=>setSF(p=>({...p,qc:v}))} min="0"/>
                </div>
                {sF.qc&&parseInt(sF.qc)>0&&<div style={{backgroundColor:'rgba(108,99,255,.1)',border:'1px solid rgba(108,99,255,.3)',borderRadius:'10px',padding:'8px 12px',fontSize:'12px',color:'#9ca3af',textAlign:'center'}}>
                    {sF.examType} Hedef: {sF.examType==='TYT'?`${parseInt(sF.qc)||0}/120`:`${parseInt(sF.qc)||0}/80`}
                </div>}
                <Btn onClick={addSession} style={{width:'100%',justifyContent:'center'}}>💾 Kaydet</Btn>
            </div>
        </Modal>

        {/* MODAL: Exam — TYT & AYT tabs */}
        <Modal isOpen={modal.open&&modal.type==='exam'} onClose={closeMd} title="📝 Deneme Ekle">
            <div className="space-y-3">
                {/* TYT / AYT tab */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                    {['TYT','AYT'].map(t=><button key={t} onClick={()=>setEType(t)}
                        style={{padding:'10px',borderRadius:'12px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'14px',
                            backgroundColor:eType===t?(t==='TYT'?'rgba(108,99,255,.3)':'rgba(255,152,0,.3)'):'#1a1a2e',
                            color:eType===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#6b7280',
                            borderWidth:'2px',borderStyle:'solid',
                            borderColor:eType===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#2a2a3e'}}>
                        {t} Denemesi
                    </button>)}
                </div>

                {/* TYT FORM */}
                {eType==='TYT'&&<>
                    <div style={{backgroundColor:'rgba(108,99,255,.08)',borderRadius:'12px',padding:'12px',marginBottom:'4px'}}>
                        <div style={{fontSize:'12px',color:'#6c63ff',fontWeight:'700',marginBottom:'8px'}}>TYT — Toplam 120 Soru</div>
                        <div style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center',fontSize:'12px',color:'#6b7280',marginBottom:'6px'}}>
                            <span></span><span style={{textAlign:'center'}}>Doğru</span><span style={{textAlign:'center'}}>Yanlış</span>
                        </div>
                        {[{l:'Türkçe (40)',d:'turkD',y:'turkY',max:40,c:'#29b6f6'},{l:'Matematik (40)',d:'matD',y:'matY',max:40,c:'#6c63ff'},{l:'Fen Bil. (20)',d:'fenD',y:'fenY',max:20,c:'#00c853'},{l:'Sosyal Bil. (20)',d:'sosD',y:'sosY',max:20,c:'#ff9800'}].map(x=>(
                            <div key={x.l} style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center',marginBottom:'6px'}}>
                                <span style={{fontSize:'12px',color:x.c,fontWeight:'600',minWidth:'90px'}}>{x.l}</span>
                                <Inp type="number" value={eTYT[x.d]} onChange={v=>setETYT(p=>({...p,[x.d]:v}))} placeholder={`0-${x.max}`} min="0" max={x.max}/>
                                <Inp type="number" value={eTYT[x.y]} onChange={v=>setETYT(p=>({...p,[x.y]:v}))} placeholder="0" min="0"/>
                            </div>
                        ))}
                    </div>
                    {/* TYT Net Preview */}
                    <div style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'12px'}}>
                        <div style={{fontSize:'12px',color:'#6b7280',marginBottom:'6px'}}>Net Önizleme (D - Y/4)</div>
                        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px',textAlign:'center'}}>
                            {[{l:'Türkçe',v:tytNet.t,c:'#29b6f6'},{l:'Mat',v:tytNet.m,c:'#6c63ff'},{l:'Fen',v:tytNet.f,c:'#00c853'},{l:'Sos',v:tytNet.s,c:'#ff9800'},{l:'TOPLAM',v:tytNet.tot,c:'#fff'}].map(x=><div key={x.l}>
                                <div style={{fontSize:'13px',fontWeight:'bold',color:x.c}}>{x.v.toFixed(1)}</div>
                                <div style={{fontSize:'10px',color:'#6b7280'}}>{x.l}</div>
                            </div>)}
                        </div>
                        <PBar value={tytNet.tot} max={120} color="#6c63ff" label={false} size="md"/>
                        <div style={{textAlign:'right',fontSize:'11px',color:'#6b7280',marginTop:'4px'}}>Max: 120</div>
                    </div>
                    <Btn onClick={addTYTExam} style={{width:'100%',justifyContent:'center'}}>💾 TYT Kaydet (+25 XP)</Btn>
                </>}

                {/* AYT FORM */}
                {eType==='AYT'&&<>
                    {/* Field selector */}
                    <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                        {Object.entries(AYT_FIELDS).map(([k,v])=><button key={k} onClick={()=>setEAYT(p=>({...p,field:k}))}
                            style={{padding:'6px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:eAYT.field===k?v.color:'#1a1a2e',color:eAYT.field===k?'#fff':'#9ca3af'}}>
                            {v.name}
                        </button>)}
                    </div>
                    <div style={{backgroundColor:'rgba(255,152,0,.08)',borderRadius:'12px',padding:'12px'}}>
                        <div style={{fontSize:'12px',color:'#ff9800',fontWeight:'700',marginBottom:'8px'}}>AYT {AYT_FIELDS[eAYT.field]?.name} — Max 80 Net</div>
                        <div style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center',fontSize:'12px',color:'#6b7280',marginBottom:'6px'}}>
                            <span></span><span style={{textAlign:'center'}}>Doğru</span><span style={{textAlign:'center'}}>Yanlış</span>
                        </div>
                        {eAYT.field==='sayisal'&&[{l:'Matematik (40)',d:'matD',y:'matY',max:40,c:'#6c63ff'},{l:'Fizik (14)',d:'fizD',y:'fizY',max:14,c:'#00c853'},{l:'Kimya (13)',d:'kimD',y:'kimY',max:13,c:'#ffd600'},{l:'Biyoloji (13)',d:'bioD',y:'bioY',max:13,c:'#ff5252'}].map(x=>(
                            <div key={x.l} style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center',marginBottom:'6px'}}>
                                <span style={{fontSize:'12px',color:x.c,fontWeight:'600',minWidth:'90px'}}>{x.l}</span>
                                <Inp type="number" value={eAYT[x.d]} onChange={v=>setEAYT(p=>({...p,[x.d]:v}))} placeholder={`0-${x.max}`} min="0" max={x.max}/>
                                <Inp type="number" value={eAYT[x.y]} onChange={v=>setEAYT(p=>({...p,[x.y]:v}))} placeholder="0" min="0"/>
                            </div>
                        ))}
                        {eAYT.field==='ea'&&[{l:'Türk Dili/Edb (24)',d:'edbD',y:'edbY',max:24,c:'#29b6f6'},{l:'Matematik (40)',d:'matD',y:'matY',max:40,c:'#6c63ff'},{l:'Tarih-1 (10)',d:'tar1D',y:'tar1Y',max:10,c:'#ff9800'},{l:'Coğrafya-1 (6)',d:'cog1D',y:'cog1Y',max:6,c:'#e91e63'}].map(x=>(
                            <div key={x.l} style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center',marginBottom:'6px'}}>
                                <span style={{fontSize:'12px',color:x.c,fontWeight:'600',minWidth:'90px'}}>{x.l}</span>
                                <Inp type="number" value={eAYT[x.d]} onChange={v=>setEAYT(p=>({...p,[x.d]:v}))} placeholder={`0-${x.max}`} min="0" max={x.max}/>
                                <Inp type="number" value={eAYT[x.y]} onChange={v=>setEAYT(p=>({...p,[x.y]:v}))} placeholder="0" min="0"/>
                            </div>
                        ))}
                        {eAYT.field==='sozel'&&<p style={{color:'#9ca3af',fontSize:'13px',padding:'8px 0'}}>Sözel alanı yakında eklenecek.</p>}
                    </div>
                    {/* AYT Net Preview */}
                    {eAYT.field==='sayisal'&&<div style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'12px'}}>
                        <div style={{fontSize:'12px',color:'#6b7280',marginBottom:'6px'}}>Net Önizleme (D - Y/4)</div>
                        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px',textAlign:'center'}}>
                            {[{l:'Mat',v:aytNet.m,c:'#6c63ff'},{l:'Fiz',v:aytNet.f,c:'#00c853'},{l:'Kim',v:aytNet.k,c:'#ffd600'},{l:'Bio',v:aytNet.b,c:'#ff5252'},{l:'TOPLAM',v:aytNet.tot,c:'#fff'}].map(x=><div key={x.l}>
                                <div style={{fontSize:'13px',fontWeight:'bold',color:x.c}}>{(x.v||0).toFixed(1)}</div>
                                <div style={{fontSize:'10px',color:'#6b7280'}}>{x.l}</div>
                            </div>)}
                        </div>
                        <PBar value={aytNet.tot||0} max={80} color="#ff9800" label={false} size="md"/>
                        <div style={{textAlign:'right',fontSize:'11px',color:'#6b7280',marginTop:'4px'}}>Max: 80</div>
                    </div>}
                    {eAYT.field==='ea'&&<div style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'12px'}}>
                        <div style={{fontSize:'12px',color:'#6b7280',marginBottom:'6px'}}>Net Önizleme</div>
                        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px',textAlign:'center'}}>
                            {[{l:'Edb.',v:aytNet.e,c:'#29b6f6'},{l:'Mat',v:aytNet.m,c:'#6c63ff'},{l:'Tar',v:aytNet.t,c:'#ff9800'},{l:'Coğ',v:aytNet.c,c:'#e91e63'},{l:'TOPLAM',v:aytNet.tot,c:'#fff'}].map(x=><div key={x.l}>
                                <div style={{fontSize:'13px',fontWeight:'bold',color:x.c}}>{(x.v||0).toFixed(1)}</div>
                                <div style={{fontSize:'10px',color:'#6b7280'}}>{x.l}</div>
                            </div>)}
                        </div>
                        <PBar value={aytNet.tot||0} max={80} color="#ff9800" label={false} size="md"/>
                    </div>}
                    <Btn onClick={addAYTExam} v="orange" style={{width:'100%',justifyContent:'center'}}>💾 AYT Kaydet (+30 XP)</Btn>
                </>}
            </div>
        </Modal>

        {/* MODAL: Mistake */}
        <Modal isOpen={modal.open&&modal.type==='mistake'} onClose={closeMd} title="📕 Hata Ekle">
            <div className="space-y-3">
                <Sel label="Ders" value={mF.subject} onChange={v=>setMF(p=>({...p,subject:v}))} options={SUBS.map(s=>({value:s.id,label:`${s.icon} ${s.name}`}))}/>
                <Inp label="Konu" value={mF.topic} onChange={v=>setMF(p=>({...p,topic:v}))} placeholder="Konu adı..."/>
                <Sel label="Hata Türü" value={mF.type} onChange={v=>setMF(p=>({...p,type:v}))} options={MTYPES.map(t=>({value:t.id,label:t.name}))}/>
                <Txt label="Hata Açıklaması" value={mF.desc} onChange={v=>setMF(p=>({...p,desc:v}))} placeholder="Ne hata yaptım?"/>
                <Txt label="Doğru Çözüm" value={mF.logic} onChange={v=>setMF(p=>({...p,logic:v}))} placeholder="Doğru yöntem..." rows={2}/>
                <Btn onClick={addMistake} style={{width:'100%',justifyContent:'center'}}>💾 Kaydet (+5 XP)</Btn>
            </div>
        </Modal>

        {/* MODAL: Task */}
        <Modal isOpen={modal.open&&modal.type==='task'} onClose={closeMd} title="✅ Görev Ekle">
            <div className="space-y-3">
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                    {['TYT','AYT'].map(t=><button key={t} onClick={()=>setTI(p=>({...p,examType:t}))}
                        style={{padding:'8px',borderRadius:'10px',border:`2px solid ${(tI.examType||'TYT')===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#2a2a3e'}`,cursor:'pointer',fontWeight:'700',fontSize:'13px',
                            backgroundColor:(tI.examType||'TYT')===t?(t==='TYT'?'rgba(108,99,255,.2)':'rgba(255,152,0,.2)'):'#1a1a2e',
                            color:(tI.examType||'TYT')===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#6b7280'}}>
                        {t}
                    </button>)}
                </div>
                <Inp label="Görev Adı" value={tI.text} onChange={v=>setTI(p=>({...p,text:v}))} placeholder="Matematik – 20 soru"/>
                <Sel label="Ders" value={tI.subject} onChange={v=>setTI(p=>({...p,subject:v}))} options={[{value:'genel',label:'Genel'},...SUBS.map(s=>({value:s.id,label:s.name}))]}/>
                <Sel label="Öncelik" value={tI.priority||'medium'} onChange={v=>setTI(p=>({...p,priority:v}))} options={[{value:'high',label:'🔴 Yüksek'},{value:'medium',label:'🟡 Orta'},{value:'low',label:'🟢 Düşük'}]}/>
                <Btn onClick={()=>{
                    if(!tI.text.trim()){notify('⚠️ Görev adı!');return}
                    setTasks(p=>[...p,{id:Date.now(),date:today,text:tI.text,subject:tI.subject,examType:tI.examType||'TYT',completed:false,xp:10,priority:tI.priority||'medium'}]);
                    setTI({text:'',subject:'matematik',priority:'medium',examType:'TYT'});
                    closeMd();notify('✅ Görev eklendi!');
                }} style={{width:'100%',justifyContent:'center'}}>➕ Ekle</Btn>
            </div>
        </Modal>

        <Toast msg={toast.msg} show={toast.show}/>
    </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
