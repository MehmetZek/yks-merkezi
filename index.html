const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pYmd=s=>{const[a,b,c]=(s||'').split('-').map(Number);return a&&b&&c?new Date(a,b-1,c,12,0,0):new Date()};
const addYmdDays=(s,days)=>{const d=pYmd(s);d.setDate(d.getDate()+days);return ymd(d)};
const diffYmd=(a,b)=>Math.round((pYmd(b).getTime()-pYmd(a).getTime())/864e5);

// ── SM-2 ALGORITHM (FIXED) ─────────────────────────────────────
const SM2={
    init:()=>({ef:2.5,interval:0,reps:0,nextReview:null,lastReview:null,totalReviews:0,history:[]}),
    
    // quality: 1=Tekrar(Again), 2=Zor(Hard), 3=Orta(Good), 4=Kolay(Easy), 5=Mükemmel(Perfect)
    review:(card, quality)=>{
        const q=Math.max(1,Math.min(5,quality));
        const prevEF=card.ef||2.5;
        const prevInterval=card.interval||0;
        const prevReps=card.reps||0;
        
        // EF update (only when q >= 3, but EF is always recalculated)
        const newEF=Math.max(1.3, prevEF + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
        
        let newInterval, newReps;
        if(q<3){
            // Failed: restart
            newInterval=1;
            newReps=0;
        } else {
            // Success
            newReps=prevReps+1;
            if(newReps===1) newInterval=1;
            else if(newReps===2) newInterval=6;
            else newInterval=Math.round(prevInterval*newEF);
        }
        
        const today=ymd(new Date());
        const nextReview=addYmdDays(today,newInterval);
        
        return{
            ef:newEF,
            interval:newInterval,
            reps:newReps,
            nextReview,
            lastReview:today,
            totalReviews:(card.totalReviews||0)+1,
            history:[...(card.history||[]).slice(-19),{date:today,q,interval:newInterval}]
        };
    },
    
    // Ebbinghaus forgetting curve: R = e^(-t/S)
    // S (stability) ≈ interval
    retention:(daysSince,stability)=>{
        if(stability<=0)return 0;
        return Math.round(100*Math.exp(-daysSince/Math.max(1,stability)));
    },
    
    // Get current retention % for a card
    getRetention:(card)=>{
        if(!card||!card.lastReview)return 0;
        const days=Math.max(0,Math.floor((Date.now()-new Date(card.lastReview+'T12:00:00').getTime())/86400000));
        return SM2.retention(days,card.interval||1);
    },
    
    // Is card due for review today or overdue?
    isDue:(card)=>{
        if(!card.nextReview)return true;
        const today=ymd(new Date());
        return card.nextReview<=today;
    },
    
    // Human-readable next review label
    nextLabel:(card)=>{
        if(!card.nextReview||SM2.isDue(card))return 'Bugün';
        const days=Math.max(0,Math.ceil((new Date(card.nextReview+'T12:00:00').getTime()-Date.now())/86400000));
        if(days===1)return 'Yarın';
        return `${days}g sonra`;
    },
    
    // Category based on EF
    strengthLabel:(ef)=>ef>=2.2?'Güçlü':ef>=1.6?'Orta':'Zayıf'
};

const fitSection=(prev,key,otherKey,max,raw)=>{if(raw==='')return{...prev,[key]:''};const other=Math.min(iVal(prev[otherKey]),max);let val=Math.min(iVal(raw),max);if(val+other>max)val=Math.max(0,max-other);return{...prev,[key]:String(val)}};

// Linear regression for score prediction
const linReg=vals=>{
    const n=vals.length;if(n<2)return null;
    const xm=(n-1)/2,ym=vals.reduce((a,b)=>a+b,0)/n;
    const slope=vals.reduce((s,y,x)=>s+(x-xm)*(y-ym),0)/vals.reduce((s,_,x)=>s+(x-xm)**2,1);
    return{slope,predict:x=>Math.max(0,ym+slope*(x-xm))};
};

// ── POMODORO ────────────────────────────────────────────────────
const Pomodoro=memo(({onComplete})=>{
    const[mode,setMode]=useState('focus');
    const[tl,setTl]=useState(25*60);
    const[run,setRun]=useState(false);
    const[done,setDone]=useState(0);
    const ref=useRef(null);
    const totals={focus:25*60,break:5*60,long:15*60};
    useEffect(()=>{
        if(run&&tl>0){ref.current=setInterval(()=>setTl(t=>t-1),1000)}
        else if(tl===0){
            clearInterval(ref.current);
            if(mode==='focus'){setDone(d=>d+1);onComplete&&onComplete(25);setMode('break');setTl(5*60)}
            else{setMode('focus');setTl(25*60)}
            setRun(false);
        }
        return()=>clearInterval(ref.current);
    },[run,tl,mode]);
    const tot=totals[mode]||25*60;
    const pct=((tot-tl)/tot)*100;
    const r=48;const circ=2*Math.PI*r;const off=circ-(pct/100)*circ;
    const fmt=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    return<div style={{textAlign:'center'}}>
        <div style={{display:'flex',justifyContent:'center',gap:'6px',marginBottom:'12px'}}>
            {[['focus','🎯 Odak',25*60],['break','☕ Kısa',5*60],['long','🛋️ Uzun',15*60]].map(([m,l,t])=>(
                <button key={m} onClick={()=>{setMode(m);setTl(t);setRun(false)}} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:mode===m?'#6c63ff':'#1a1a2e',color:mode===m?'#fff':'#9ca3af'}}>{l}</button>
            ))}
        </div>
        <div style={{position:'relative',display:'inline-block',marginBottom:'12px'}}>
            <svg width="110" height="110">
                <circle cx="55" cy="55" r={r} fill="none" stroke="#1a1a2e" strokeWidth="8"/>
                <circle cx="55" cy="55" r={r} fill="none" stroke={mode==='focus'?'#6c63ff':'#00c853'} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round" transform="rotate(-90 55 55)" style={{transition:'stroke-dashoffset .3s',filter:`drop-shadow(0 0 8px ${mode==='focus'?'#6c63ff':'#00c853'}88)`}}/>
                <text x="55" y="50" textAnchor="middle" fill="#fff" fontSize="22" fontWeight="bold">{fmt(tl)}</text>
                <text x="55" y="70" textAnchor="middle" fill="#6b7280" fontSize="12">{done}🍅</text>
            </svg>
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px'}}>
            <Btn onClick={()=>setRun(!run)} v={run?'danger':'primary'}>{run?'⏸ Dur':'▶ Başlat'}</Btn>
            <Btn onClick={()=>{setTl(tot);setRun(false)}} v="ghost">↺</Btn>
        </div>
    </div>;
});

const LiveTimer=memo(({onSave,notify})=>{
    const[run,setRun]=useState(false);const[elapsed,setElapsed]=useState(0);
    const[sub,setSub]=useState('matematik');const[topic,setTopic]=useState('');const[examType,setExamType]=useState('TYT');
    const startRef=useRef(null);const intRef=useRef(null);
    const start=()=>{startRef.current=Date.now()-elapsed*1000;intRef.current=setInterval(()=>setElapsed(Math.floor((Date.now()-startRef.current)/1000)),1000);setRun(true)};
    const stop=()=>{clearInterval(intRef.current);setRun(false)};
    const reset=()=>{stop();setElapsed(0)};
    const save=()=>{
        const mins=Math.floor(elapsed/60);
        if(mins<1){notify('⚠️ En az 1 dakika!');return}
        if(!topic.trim()){notify('⚠️ Konu adı gir!');return}
        onSave({subject:sub,topic,dur:mins.toString(),qc:'0',examType});reset();setTopic('');
    };
    useEffect(()=>()=>clearInterval(intRef.current),[]);
    const h=Math.floor(elapsed/3600),m=Math.floor((elapsed%3600)/60),sec=elapsed%60;
    const fmt=h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return<div>
        <div style={{textAlign:'center',margin:'12px 0'}}><div style={{fontFamily:'monospace',fontSize:'44px',fontWeight:'bold',color:run?'#6c63ff':'#e5e7eb'}}>{fmt}</div></div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'12px'}}>
            {['TYT','AYT'].map(t=><button key={t} onClick={()=>setExamType(t)} style={{padding:'5px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:'700',border:'none',cursor:'pointer',backgroundColor:examType===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#1a1a2e',color:examType===t?'#fff':'#9ca3af'}}>{t}</button>)}
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'12px'}}>
            <Btn onClick={run?stop:start} v={run?'danger':'primary'}>{run?'⏸ Dur':'▶ Başlat'}</Btn>
            {!run&&elapsed>0&&<Btn onClick={save} v="success">💾 Kaydet ({Math.floor(elapsed/60)}dk)</Btn>}
            {elapsed>0&&<Btn onClick={reset} v="ghost">↺</Btn>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            <Sel label="Ders" value={sub} onChange={setSub} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
            <Inp label="Konu" value={topic} onChange={setTopic} placeholder="Konu adı..."/>
        </div>
    </div>;
});

// ── FLASHCARDS (SM-2 FIXED) ────────────────────────────────────
// Now receives flashcards/setFlashcards from App (shared state)
const Flashcards=memo(({flashcards,setFlashcards,notify,addXp})=>{
    const[mode,setMode]=useState('list'); // list | study | result
    const[studyQueue,setStudyQueue]=useState([]); // ordered list to study
    const[cur,setCur]=useState(0);
    const[flipped,setFlipped]=useState(false);
    const[stats,setStats]=useState({again:0,hard:0,good:0,easy:0});
    const[form,setForm]=useState({sub:'matematik',front:'',back:'',tag:''});
    const[filter,setFilter]=useState('all');
    const[showDueOnly,setShowDueOnly]=useState(false);

    const dueCards=useMemo(()=>flashcards.filter(c=>SM2.isDue(c)),[flashcards]);
    
    const displayCards=useMemo(()=>{
        let list=filter==='all'?flashcards:flashcards.filter(c=>c.sub===filter);
        if(showDueOnly)list=list.filter(c=>SM2.isDue(c));
        return list;
    },[flashcards,filter,showDueOnly]);

    const avgRet=useMemo(()=>{
        const active=flashcards.filter(c=>c.totalReviews>0);
        if(!active.length)return 0;
        return Math.round(active.reduce((a,c)=>a+SM2.getRetention(c),0)/active.length);
    },[flashcards]);

    const addCard=()=>{
        if(!form.front.trim()||!form.back.trim()){notify('⚠️ Soru ve cevap gerekli!');return}
        const newCard={id:Date.now(),sub:form.sub,front:form.front,back:form.back,tag:form.tag,...SM2.init()};
        setFlashcards(p=>[...p,newCard]);
        setForm(p=>({...p,front:'',back:'',tag:''}));
        addXp(2);notify('🃏 Kart eklendi! +2 XP');
    };

    const startStudy=(dueOnly=false)=>{
        let queue=dueOnly?dueCards:[...displayCards];
        if(!queue.length){notify('⚠️ Çalışılacak kart yok!');return}
        // Sort: overdue/due first, then by lowest retention
        queue=[...queue].sort((a,b)=>{
            const aDue=SM2.isDue(a)?0:1,bDue=SM2.isDue(b)?0:1;
            if(aDue!==bDue)return aDue-bDue;
            return SM2.getRetention(a)-SM2.getRetention(b);
        });
        setStudyQueue(queue);
        setCur(0);setFlipped(false);setStats({again:0,hard:0,good:0,easy:0});setMode('study');
    };

    const rateCard=useCallback((quality)=>{
        // quality: 1=again, 2=hard, 4=good, 5=easy
        const card=studyQueue[cur];
        if(!card)return;
        
        const result=SM2.review(card,quality);
        setFlashcards(prev=>prev.map(c=>c.id===card.id?{...c,...result}:c));
        
        const qKey={1:'again',2:'hard',4:'good',5:'easy'}[quality]||'good';
        const newStats={...stats,[qKey]:(stats[qKey]||0)+1};
        setStats(newStats);
        
        if(cur<studyQueue.length-1){
            setCur(c=>c+1);
            setFlipped(false);
        } else {
            const xpGained=newStats.good*3+newStats.easy*5+newStats.hard*1;
            addXp(xpGained);
            notify(`✅ Tur tamamlandı! +${xpGained} XP`);
            setMode('result');
        }
    },[studyQueue,cur,stats,setFlashcards,addXp,notify]);

    // STUDY MODE
    if(mode==='study'){
        const card=studyQueue[cur];
        if(!card)return null;
        const ret=SM2.getRetention(card);
        const sub=SUBS.find(s=>s.id===card.sub);
        const daysOverdue=card.nextReview&&card.nextReview<td()?Math.floor((Date.now()-new Date(card.nextReview+'T12:00:00').getTime())/86400000):0;
        return<div className="space-y-4">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'14px',fontWeight:'600',color:'#fff'}}>{cur+1}/{studyQueue.length}</span>
                <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                    {SM2.isDue(card)&&<span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:'rgba(255,82,82,.2)',color:'#ff5252',fontWeight:'600'}}>
                        {daysOverdue>0?`+${daysOverdue}g gecikti`:'Bugün vadesi doldu'}
                    </span>}
                    <SRRing pct={ret} size={50}/>
                </div>
                <Btn onClick={()=>setMode('list')} v="ghost" s="sm">× Çık</Btn>
            </div>
            <PBar value={cur+1} max={studyQueue.length} color="#6c63ff" label={false} size="sm"/>
            
            {/* Flip card */}
            <div style={{height:'240px',cursor:'pointer',position:'relative',perspective:'1000px'}} onClick={()=>setFlipped(!flipped)}>
                <div style={{position:'relative',height:'100%',transformStyle:'preserve-3d',transition:'transform .55s',transform:flipped?'rotateY(180deg)':'rotateY(0deg)'}}>
                    {/* Front */}
                    <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden',backgroundColor:'#1a1a2e',border:`2px solid ${sub?.color||'#6c63ff'}`,borderRadius:'20px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px'}}>
                        <div style={{fontSize:'11px',color:sub?.color||'#6c63ff',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>{sub?.icon} {sub?.name}</div>
                        <div style={{fontSize:'20px',fontWeight:'bold',color:'#fff',textAlign:'center',lineHeight:'1.4'}}>{card.front}</div>
                        <div style={{position:'absolute',bottom:'14px',fontSize:'11px',color:'#6b7280'}}>👆 Görmek için dokun</div>
                        <div style={{position:'absolute',bottom:'14px',right:'14px',fontSize:'11px',color:'#4b5563'}}>EF: {(card.ef||2.5).toFixed(1)}</div>
                    </div>
                    {/* Back */}
                    <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden',transform:'rotateY(180deg)',backgroundColor:'#1a1a2e',border:'2px solid #00c853',borderRadius:'20px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px'}}>
                        <div style={{fontSize:'11px',color:'#00c853',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>✅ Cevap</div>
                        <div style={{fontSize:'17px',color:'#fff',textAlign:'center',lineHeight:'1.5'}}>{card.back}</div>
                        <div style={{position:'absolute',bottom:'14px',right:'14px',fontSize:'11px',color:'#6b7280'}}>→ {SM2.nextLabel(card)}</div>
                    </div>
                </div>
            </div>
            
            {/* Rating buttons */}
            {flipped&&<div>
                <div style={{fontSize:'13px',color:'#9ca3af',textAlign:'center',marginBottom:'10px'}}>Bu kartı ne kadar iyi bildin?</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
                    {[
                        {q:1,label:'😰 Tekrar',sub:'<1g',c:'#ff5252'},
                        {q:2,label:'😟 Zor',   sub:`~${Math.max(1,Math.round((card.interval||1)*1.2))}g`,c:'#ff9800'},
                        {q:4,label:'😊 İyi',   sub:`~${Math.round((card.interval||0)<2?1:(card.interval||1)*(card.ef||2.5))}g`,c:'#6c63ff'},
                        {q:5,label:'😄 Kolay', sub:`~${Math.round(((card.interval||0)<2?6:(card.interval||1)*(card.ef||2.5))*1.1)}g`,c:'#00c853'},
                    ].map(({q,label,sub,c})=>(
                        <button key={q} onClick={()=>rateCard(q)}
                            style={{backgroundColor:c+'15',border:`1px solid ${c}44`,borderRadius:'14px',padding:'10px 6px',textAlign:'center',cursor:'pointer',color:c,transition:'all .15s'}}
                            onMouseOver={e=>{e.currentTarget.style.backgroundColor=c+'30'}}
                            onMouseOut={e=>{e.currentTarget.style.backgroundColor=c+'15'}}>
                            <div style={{fontSize:'13px',fontWeight:'700'}}>{label}</div>
                            <div style={{fontSize:'10px',opacity:.7,marginTop:'2px'}}>{sub}</div>
                        </button>
                    ))}
                </div>
                <p style={{fontSize:'11px',color:'#4b5563',textAlign:'center',marginTop:'8px'}}>Sonraki tekrar tarihi otomatik hesaplanır (SM-2)</p>
            </div>}
        </div>;
    }

    // RESULT MODE
    if(mode==='result')return<div style={{textAlign:'center'}} className="space-y-4">
        <div style={{fontSize:'48px'}}>🎉</div>
        <h3 style={{fontSize:'20px',fontWeight:'bold',color:'#fff'}}>Tur Tamamlandı!</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
            {[['😰 Tekrar','again','#ff5252'],['😟 Zor','hard','#ff9800'],['😊 İyi','good','#6c63ff'],['😄 Kolay','easy','#00c853']].map(([l,k,c])=>(
                <Card key={k} style={{textAlign:'center',padding:'12px 8px'}}>
                    <div style={{fontSize:'20px',fontWeight:'bold',color:c}}>{stats[k]||0}</div>
                    <div style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>{l}</div>
                </Card>
            ))}
        </div>
        <div style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'12px',fontSize:'13px',color:'#9ca3af'}}>
            Sonraki tekrar tarihleri SM-2 algoritması ile güncellendi ✓
        </div>
        <Btn onClick={()=>setMode('list')} style={{width:'100%',justifyContent:'center'}}>Listeye Dön</Btn>
    </div>;

    // LIST MODE
    return<div className="space-y-4">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px'}}>
            <div>
                <h2 style={{fontSize:'16px',fontWeight:'bold',color:'#fff',margin:0}}>🃏 Flashcard</h2>
                {flashcards.length>0&&<div style={{fontSize:'12px',color:'#6b7280',marginTop:'2px'}}>Hafıza: %{avgRet} | {dueCards.length} kart bugün</div>}
            </div>
            <div style={{display:'flex',gap:'8px'}}>
                <Btn onClick={()=>startStudy(true)} v={dueCards.length>0?'danger':'ghost'} s="sm" disabled={!dueCards.length}>
                    ⚠️ Bugün ({dueCards.length})
                </Btn>
                <Btn onClick={()=>startStudy(false)} v="success" s="sm">▶ Tümü ({displayCards.length})</Btn>
            </div>
        </div>

        {/* Add card form */}
        <Card title="➕ Yeni Kart">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'8px'}}>
                <Sel label="Ders" value={form.sub} onChange={v=>setForm(p=>({...p,sub:v}))} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
                <Inp label="Etiket" value={form.tag} onChange={v=>setForm(p=>({...p,tag:v}))} placeholder="Opsiyonel..."/>
            </div>
            <Inp label="Soru / Kavram" value={form.front} onChange={v=>setForm(p=>({...p,front:v}))} placeholder="sin(30°) = ?" className="mb-2"/>
            <Inp label="Cevap" value={form.back} onChange={v=>setForm(p=>({...p,back:v}))} placeholder="1/2" className="mb-2"/>
            <Btn onClick={addCard} style={{width:'100%',justifyContent:'center'}}>+ Ekle (+2 XP)</Btn>
        </Card>

        {/* Filters */}
        <div style={{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>
            <button onClick={()=>setShowDueOnly(!showDueOnly)} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:showDueOnly?'#ff5252':'#1a1a2e',color:showDueOnly?'#fff':'#9ca3af'}}>⚠️ Bugün</button>
            <button onClick={()=>setFilter('all')} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:filter==='all'?'#6c63ff':'#1a1a2e',color:filter==='all'?'#fff':'#9ca3af'}}>Tümü ({flashcards.length})</button>
            {SUBS.map(s=>{const c=flashcards.filter(x=>x.sub===s.id).length;if(!c)return null;return<button key={s.id} onClick={()=>setFilter(s.id)} style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:filter===s.id?s.color:'#1a1a2e',color:filter===s.id?'#fff':'#9ca3af'}}>{s.name}({c})</button>})}
        </div>

        {/* Card list */}
        <div className="space-y-2">
            {displayCards.length===0
                ?<Card><p style={{color:'#6b7280',textAlign:'center',padding:'20px 0'}}>Kart yok. Yukarıdan ekle!</p></Card>
                :displayCards.map(c=>{
                    const sub=SUBS.find(s=>s.id===c.sub);
                    const ret=SM2.getRetention(c);
                    const due=SM2.isDue(c);
                    return<Card key={c.id} style={{position:'relative'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                            <div style={{flex:1,paddingRight:'12px'}}>
                                <div style={{display:'flex',gap:'6px',marginBottom:'6px',flexWrap:'wrap',alignItems:'center'}}>
                                    <span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:sub?.color+'22',color:sub?.color,fontWeight:'600'}}>{sub?.icon} {sub?.name}</span>
                                    {due&&<span style={{fontSize:'11px',padding:'2px 6px',borderRadius:'999px',backgroundColor:'rgba(255,82,82,.2)',color:'#ff5252',fontWeight:'700'}}>Tekrar Zamanı!</span>}
                                    {!due&&<span style={{fontSize:'11px',color:'#6b7280'}}>{SM2.nextLabel(c)}</span>}
                                </div>
                                <div style={{fontSize:'14px',fontWeight:'600',color:'#fff',marginBottom:'2px'}}>{c.front}</div>
                                <div style={{fontSize:'12px',color:'#6b7280'}}>{c.back}</div>
                                <div style={{display:'flex',gap:'10px',marginTop:'6px',fontSize:'11px',color:'#4b5563'}}>
                                    <span>EF: {(c.ef||2.5).toFixed(2)}</span>
                                    <span>Aralık: {c.interval||0}g</span>
                                    <span>Tekrar: {c.totalReviews||0}×</span>
                                    <span style={{color:retC(ret)}}>%{ret}</span>
                                </div>
                            </div>
                            <SRRing pct={ret} size={50}/>
                        </div>
                        <button onClick={()=>setFlashcards(p=>p.filter(x=>x.id!==c.id))}
                            style={{position:'absolute',top:'10px',right:'10px',color:'#4b5563',background:'none',border:'none',cursor:'pointer',fontSize:'16px',lineHeight:1}}
                            onMouseOver={e=>e.target.style.color='#ff5252'} onMouseOut={e=>e.target.style.color='#4b5563'}>×</button>
                    </Card>;
                })
            }
        </div>
    </div>;
});

// ── BRAIN LAB ─────────────────────────────────────────────────
const BrainLab=memo(({flashcards,sessions,exams,mistakes,topics})=>{
    const [tab,setTab]=useState('tyt');
    const [reviewField,setReviewField]=useState('TYT');
    const [reviewSub,setReviewSub]=useState('all');
    const [reviewQueue,setReviewQueue]=useState([]);
    const [reviewIx,setReviewIx]=useState(0);
    const [reviewShow,setReviewShow]=useState(false);
    const tytRef=useRef(null),tytCI=useRef(null);
    const aytRef=useRef(null),aytCI=useRef(null);
    const srcRef=useRef(null),srcCI=useRef(null);

    const tytExams=useMemo(()=>[...exams].filter(e=>!e.examType||e.examType==='TYT').sort((a,b)=>new Date(a.date)-new Date(b.date)),[exams]);
    const aytSayExams=useMemo(()=>[...exams].filter(e=>e.examType==='AYT'&&(!e.field||e.field==='sayisal')).sort((a,b)=>new Date(a.date)-new Date(b.date)),[exams]);

    const buildReport=(list,max,sections)=>{
        if(!list.length)return null;
        const totals=list.map(e=>e.tot||0);
        const recent=avg(totals.slice(-3));
        const prevSlice=totals.slice(-6,-3);
        const prev=avg(prevSlice.length?prevSlice:totals.slice(0,-3));
        const latest=list[list.length-1]?.tot||0;
        const rows=sections.map(sec=>{
            const vals=list.map(e=>e[sec.net]||0);
            const wrongs=list.reduce((a,e)=>a+iVal(e[sec.wrong]),0);
            const recentAvg=avg(vals.slice(-3));
            const prevAvg=avg(vals.slice(-6,-3).length?vals.slice(-6,-3):vals.slice(0,-3));
            const latestVal=list[list.length-1]?.[sec.net]||0;
            return{
                ...sec,
                latest:latestVal,
                recent:recentAvg,
                prev:prevAvg,
                delta:Math.round((recentAvg-prevAvg)*10)/10,
                wrongs,
                pct:Math.round((latestVal/sec.max)*100)
            };
        }).sort((a,b)=>a.pct-b.pct);
        const weakest=rows[0]||null;
        const strongest=[...rows].sort((a,b)=>b.pct-a.pct)[0]||null;
        return{
            count:list.length,
            latest,
            avg:avg(totals),
            best:Math.max(...totals),
            recent,
            prev,
            delta:Math.round((recent-prev)*10)/10,
            pct:Math.round((latest/max)*100),
            weakest,
            strongest,
            rows,
            max
        };
    };

    const tytReport=useMemo(()=>buildReport(tytExams,120,[
        {label:'Türkçe',net:'tN',wrong:'turkY',max:40,color:'#29b6f6'},
        {label:'Matematik',net:'mN',wrong:'matY',max:40,color:'#6c63ff'},
        {label:'Fen',net:'fN',wrong:'fenY',max:20,color:'#00c853'},
        {label:'Sosyal',net:'sN',wrong:'sosY',max:20,color:'#ff9800'}
    ]),[tytExams]);

    const aytReport=useMemo(()=>buildReport(aytSayExams,80,[
        {label:'Matematik',net:'mN',wrong:'matY',max:40,color:'#6c63ff'},
        {label:'Fizik',net:'fN',wrong:'fizY',max:14,color:'#00c853'},
        {label:'Kimya',net:'kN',wrong:'kimY',max:13,color:'#ffd600'},
        {label:'Biyoloji',net:'bN',wrong:'bioY',max:13,color:'#ff5252'}
    ]),[aytSayExams]);

    const topicRows=useMemo(()=>MUF.map(track=>track.topics.map(topic=>{
        const st=(topics[track.id]||{})[topic]||'not_started';
        const relatedSessions=sessions.filter(s=>(s.examType||'TYT')===track.exam && s.subject===track.subject && topicMatch(s.topic,topic));
        const relatedMistakes=mistakes.filter(m=>m.subject===track.subject && topicMatch(m.topic,topic));
        const q=relatedSessions.reduce((a,s)=>a+qInt(s),0);
        const last=relatedSessions.length?[...relatedSessions].sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date:null;
        const gap=last?diffYmd(last,td()):999;
        const risk=(st==='not_started'?22:st==='learning'?14:st==='practicing'?8:0)+(relatedMistakes.filter(m=>!(m.resolved||m.closed)).length*12)+(gap>14?16:gap>7?10:gap>3?5:0)+(q===0?8:q<25?4:0);
        return{trackId:track.id,exam:track.exam,subject:track.subject,trackName:track.name,color:track.color,topic,status:st,questions:q,mistakeCount:relatedMistakes.length,openMistakes:relatedMistakes.filter(m=>!(m.resolved||m.closed)).length,lastStudy:last,gap,risk};
    })).flat().sort((a,b)=>b.risk-a.risk),[topics,sessions,mistakes]);

    const weakTYT=useMemo(()=>topicRows.filter(x=>x.exam==='TYT').slice(0,8),[topicRows]);
    const weakAYT=useMemo(()=>topicRows.filter(x=>x.exam==='AYT').slice(0,8),[topicRows]);

    const diagnosis=useMemo(()=>{
        const items=[];
        if(tytReport){
            items.push({
                title:'TYT Teşhisi',
                lines:[
                    `Son TYT netin ${tytReport.latest.toFixed(1)}/120 (${tytReport.pct}%).`,
                    `${tytReport.delta>=0?'+':''}${tytReport.delta.toFixed(1)} puanlık son dönem trendi ${tytReport.delta<0?'aşağı':'yukarı'} yönlü.`,
                    tytReport.weakest?`En kırılgan alan: ${tytReport.weakest.label} (${tytReport.weakest.latest.toFixed(1)}/${tytReport.weakest.max}).`:''
                ].filter(Boolean)
            });
        }
        if(aytReport){
            items.push({
                title:'AYT Sayısal Teşhisi',
                lines:[
                    `Son AYT netin ${aytReport.latest.toFixed(1)}/80 (${aytReport.pct}%).`,
                    `${aytReport.delta>=0?'+':''}${aytReport.delta.toFixed(1)} puanlık son dönem trendi ${aytReport.delta<0?'aşağı':'yukarı'} yönlü.`,
                    aytReport.weakest?`En kırılgan alan: ${aytReport.weakest.label} (${aytReport.weakest.latest.toFixed(1)}/${aytReport.weakest.max}).`:''
                ].filter(Boolean)
            });
        }
        if(weakTYT[0])items.push({title:'TYT Konu Riski',lines:[`${weakTYT[0].trackName} / ${weakTYT[0].topic} şu an en riskli TYT konusu.`,`${weakTYT[0].openMistakes} açık hata · ${weakTYT[0].questions} soru · ${weakTYT[0].lastStudy?fd(weakTYT[0].lastStudy):'henüz çalışma yok'}`]});
        if(weakAYT[0])items.push({title:'AYT Konu Riski',lines:[`${weakAYT[0].trackName} / ${weakAYT[0].topic} şu an en riskli AYT konusu.`,`${weakAYT[0].openMistakes} açık hata · ${weakAYT[0].questions} soru · ${weakAYT[0].lastStudy?fd(weakAYT[0].lastStudy):'henüz çalışma yok'}`]});
        return items;
    },[tytReport,aytReport,weakTYT,weakAYT]);

    const sourceAnalytics=useMemo(()=>{
        const map={};
        const ensure=name=>{const key=srcName(name);if(!map[key])map[key]={name:key,questions:0,minutes:0,examCount:0,normNetSum:0,mistakes:0,openMistakes:0};return map[key]};
        sessions.forEach(s=>{const row=ensure(s.source);row.questions+=qInt(s);row.minutes+=dInt(s);});
        exams.forEach(e=>{const row=ensure(e.source||e.title);row.examCount+=1;row.normNetSum+=((e.tot||0)/(e.examType==='AYT'?80:120))*100;});
        mistakes.forEach(m=>{const row=ensure(m.source);row.mistakes+=1;if(!(m.resolved||m.closed))row.openMistakes+=1;});
        return Object.values(map).map(r=>{const avgNorm=r.examCount?Math.round((r.normNetSum/r.examCount)*10)/10:null;return {...r,avgNorm,efficiency:Math.round(r.questions + r.minutes*0.25 + ((avgNorm||0)*4) - r.openMistakes*8)}}).sort((a,b)=>b.efficiency-a.efficiency);
    },[sessions,exams,mistakes]);

    const reviewItems=useMemo(()=>{
        const cards=flashcards.map(c=>({id:`fc-${c.id}`,kind:'flashcard',eligible:['TYT','AYT'],sub:c.sub,subLabel:SUBS.find(s=>s.id===c.sub)?.name||c.sub,question:c.front,answer:c.back,meta:`Kart · ${c.tag||'etiketsiz'}`,priority:SM2.isDue(c)?0:1}));
        const errs=mistakes.map(m=>({id:`ms-${m.id}`,kind:'mistake',eligible:['TYT','AYT'],sub:m.subject,subLabel:SUBS.find(s=>s.id===m.subject)?.name||m.subject,question:`${m.topic} konusunda neyi yanlış yaptığını anlat ve doğru yöntemi söyle.`,answer:`Hata: ${m.desc||m.description||'—'}${m.logic||m.correctLogic?`\nDoğru yaklaşım: ${m.logic||m.correctLogic}`:''}`,meta:`Kara Defter${m.source?` · ${m.source}`:''}`,priority:(m.resolved||m.closed)?2:0}));
        const topicsQ=topicRows.slice(0,20).map(t=>({id:`tp-${t.trackId}-${norm(t.topic)}`,kind:'topic',eligible:[t.exam],sub:t.subject,subLabel:t.trackName,question:`${t.topic} konusunu 1-2 dakikada sözlü özetle. Temel kuralı, kritik formülü veya ayırt edici noktayı söyle.`,answer:`Durum: ${TSTATUS[t.status]?.l||'Başlanmadı'} · Risk: ${t.risk} · Soru: ${t.questions} · Açık hata: ${t.openMistakes}.`,meta:`${t.exam} konu tekrarı`,priority:t.risk>=35?0:1}));
        return [...cards,...errs,...topicsQ];
    },[flashcards,mistakes,topicRows]);

    const reviewSubOptions=useMemo(()=>{
        const map={};
        reviewItems.forEach(i=>{if(i.eligible.includes(reviewField))map[i.sub]=i.subLabel;});
        return [{value:'all',label:'Tümü'},...Object.entries(map).map(([value,label])=>({value,label}))];
    },[reviewItems,reviewField]);
    useEffect(()=>{if(!reviewSubOptions.find(o=>o.value===reviewSub))setReviewSub('all')},[reviewSubOptions,reviewSub]);

    const buildReview=(mode='all')=>{
        let pool=reviewItems.filter(i=>i.eligible.includes(reviewField));
        if(reviewSub!=='all')pool=pool.filter(i=>i.sub===reviewSub);
        if(mode==='priority')pool=pool.filter(i=>i.priority===0);
        pool=pool.sort((a,b)=>a.priority-b.priority).slice(0,40);
        setReviewQueue(pool);
        setReviewIx(0);
        setReviewShow(false);
    };
    const currentReview=reviewQueue[reviewIx]||null;

    useEffect(()=>{
        if(tab!=='tyt' || !tytRef.current || !tytExams.length) return;
        if(tytCI.current){tytCI.current.destroy();tytCI.current=null}
        tytCI.current=new Chart(tytRef.current,{type:'line',data:{labels:tytExams.map(e=>fd(e.date)),datasets:[{label:'TYT Net',data:tytExams.map(e=>e.tot||0),borderColor:'#6c63ff',backgroundColor:'rgba(108,99,255,.14)',fill:true,tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af'}}},scales:{y:{beginAtZero:true,max:120,ticks:{color:'#6b7280'},grid:{color:'#1a1a2e'}},x:{ticks:{color:'#6b7280'},grid:{display:false}}}}});
        return()=>{if(tytCI.current){tytCI.current.destroy();tytCI.current=null}};
    },[tab,tytExams]);

    useEffect(()=>{
        if(tab!=='ayt' || !aytRef.current || !aytSayExams.length) return;
        if(aytCI.current){aytCI.current.destroy();aytCI.current=null}
        aytCI.current=new Chart(aytRef.current,{type:'line',data:{labels:aytSayExams.map(e=>fd(e.date)),datasets:[{label:'AYT Sayısal Net',data:aytSayExams.map(e=>e.tot||0),borderColor:'#ff9800',backgroundColor:'rgba(255,152,0,.14)',fill:true,tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af'}}},scales:{y:{beginAtZero:true,max:80,ticks:{color:'#6b7280'},grid:{color:'#1a1a2e'}},x:{ticks:{color:'#6b7280'},grid:{display:false}}}}});
        return()=>{if(aytCI.current){aytCI.current.destroy();aytCI.current=null}};
    },[tab,aytSayExams]);

    useEffect(()=>{
        if(tab!=='sources' || !srcRef.current || !sourceAnalytics.length) return;
        if(srcCI.current){srcCI.current.destroy();srcCI.current=null}
        const top=sourceAnalytics.slice(0,6);
        srcCI.current=new Chart(srcRef.current,{type:'bar',data:{labels:top.map(x=>x.name),datasets:[{label:'Soru',data:top.map(x=>x.questions),backgroundColor:'#6c63ff88',borderRadius:6},{label:'Ortalama % Net',data:top.map(x=>x.avgNorm||0),backgroundColor:'#00c85366',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af'}}},scales:{y:{beginAtZero:true,ticks:{color:'#6b7280'},grid:{color:'#1a1a2e'}},x:{ticks:{color:'#6b7280',font:{size:9}},grid:{display:false}}}}});
        return()=>{if(srcCI.current){srcCI.current.destroy();srcCI.current=null}};
    },[tab,sourceAnalytics]);

    const tabs=[
        {id:'tyt',l:'TYT Raporu'},
        {id:'ayt',l:'AYT Sayısal'},
        {id:'weak',l:'Zayıf Konular'},
        {id:'diagnosis',l:'Deneme Teşhisi'},
        {id:'sources',l:'Kaynak Verimi'},
        {id:'review',l:'Tekrar'}
    ];

    return<div className="space-y-4">
        <div style={{background:'radial-gradient(ellipse at 50% 0%, rgba(108,99,255,.18) 0%, transparent 70%)',borderRadius:'20px',padding:'20px',border:'1px solid rgba(108,99,255,.22)'}}>
            <h1 style={{fontSize:'22px',fontWeight:'bold',color:'#fff',margin:'0 0 4px'}}>🧠 Beyin Laboratuvarı</h1>
            <p style={{fontSize:'12px',color:'#9ca3af',margin:0}}>TYT ve AYT'yi ayrı ele alan, zayıf konuları ve deneme verisini yorumlayan analiz alanı</p>
        </div>

        <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
            {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'6px 12px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:tab===t.id?'#6c63ff':'#1a1a2e',color:tab===t.id?'#fff':'#9ca3af',whiteSpace:'nowrap'}}>{t.l}</button>)}
        </div>

        {tab==='tyt'&&<div className="space-y-4">
            {!tytReport?<Card><p style={{color:'#6b7280',textAlign:'center',padding:'20px'}}>Henüz TYT denemesi yok. Analiz için birkaç TYT denemesi ekle.</p></Card>:<>

// ── CHARTS ─────────────────────────────────────────────────────
const StudyCharts=memo(({sessions})=>{
    const r1=useRef(null),r2=useRef(null),i1=useRef(null),i2=useRef(null);
    useEffect(()=>{
        const days=l7();
        const mk=(ref,iref,data,color,lbl)=>{
            if(!ref.current)return;
            if(iref.current){iref.current.destroy();iref.current=null}
            iref.current=new Chart(ref.current,{type:'bar',data:{labels:days.map(d=>fd(d)),datasets:[{label:lbl,data,backgroundColor:color+'88',borderRadius:6,borderSkipped:false}]},
                options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
                    scales:{y:{beginAtZero:true,ticks:{color:'#6b7280',font:{size:9}},grid:{color:'#1a1a2e'}},x:{ticks:{color:'#6b7280',font:{size:9}},grid:{display:false}}}}});
        };
        mk(r1,i1,days.map(d=>sessions.filter(s=>s.date===d).reduce((a,s)=>a+dInt(s),0)),'#6c63ff','dk');
        mk(r2,i2,days.map(d=>sessions.filter(s=>s.date===d).reduce((a,s)=>a+qInt(s),0)),'#00c853','soru');
        return()=>{[i1,i2].forEach(i=>{if(i.current){i.current.destroy();i.current=null}})};
    },[sessions]);
    return<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
        <Card title="⏱ Süre (dk)"><div style={{height:'110px'}}><canvas ref={r1}/></div></Card>
        <Card title="📈 Soru"><div style={{height:'110px'}}><canvas ref={r2}/></div></Card>
    </div>;
});

const ExamChart=memo(({exams})=>{
    const r=useRef(null),ci=useRef(null);
    useEffect(()=>{
        if(!r.current||exams.length<2)return;
        if(ci.current){ci.current.destroy();ci.current=null}
        const tyt=[...exams].filter(e=>!e.examType||e.examType==='TYT').sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12);
        const ayt=[...exams].filter(e=>e.examType==='AYT').sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12);
        // Use TYT dates as x-axis (or all)
        const allDates=[...new Set([...tyt,...ayt].map(e=>e.date))].sort();
        if(!allDates.length)return;
        const getVal=(list,date)=>{const e=list.find(x=>x.date===date);return e?(e.tot||0):null};
        ci.current=new Chart(r.current,{type:'line',
            data:{labels:allDates.map(d=>fd(d)),datasets:[
                {label:'TYT (max 120)',data:allDates.map(d=>getVal(tyt,d)),borderColor:'#6c63ff',backgroundColor:'#6c63ff15',fill:true,tension:.3,pointRadius:4,spanGaps:true},
                {label:'AYT (max 80)', data:allDates.map(d=>getVal(ayt,d)),borderColor:'#ff9800',backgroundColor:'#ff980015',fill:true,tension:.3,pointRadius:4,spanGaps:true}
            ]},
            options:{responsive:true,maintainAspectRatio:false,
                plugins:{legend:{labels:{color:'#9ca3af',font:{size:10}}}},
                scales:{y:{beginAtZero:true,ticks:{color:'#6b7280'},grid:{color:'#1a1a2e'}},x:{ticks:{color:'#6b7280'},grid:{display:false}}}}});
        return()=>{if(ci.current){ci.current.destroy();ci.current=null}};
    },[exams]);
    if(exams.length<2)return null;
    return<Card title="📈 Puan Trendi" subtitle="TYT/AYT ayrı"><div style={{height:'200px'}}><canvas ref={r}/></div></Card>;
});

// ── FORMULA BOOK ───────────────────────────────────────────────
const FormulaBook=memo(()=>{
    const FORMULAS={
        fizik:[{name:'Newton 2. Yasa',formula:'F = m · a',unit:'N, kg, m/s²'},{name:'Kinetik Enerji',formula:'Ek = ½mv²',unit:'J'},{name:'Potansiyel Enerji',formula:'Ep = mgh',unit:'J'},{name:'Momentum',formula:'p = m · v',unit:'kg·m/s'},{name:'Hooke Yasası',formula:'F = k · x',unit:'N'},{name:'Ohm Yasası',formula:'V = I · R',unit:'V,A,Ω'},{name:'İvmeli Hareket',formula:'v = v₀ + at | x = v₀t + ½at²',unit:'m/s, m'}],
        kimya:[{name:'İdeal Gaz',formula:'PV = nRT',unit:'R=8.314 J/mol·K'},{name:'Molarite',formula:'M = n / V',unit:'mol/L'},{name:'pH',formula:'pH = -log[H⁺]',unit:''},{name:'Hess Yasası',formula:'ΔH = ΣΔHf(ürün) - ΣΔHf(tepken)',unit:'kJ/mol'},{name:'Tepkime Hızı',formula:'r = k[A]ⁿ[B]ᵐ',unit:'mol/L·s'}],
        matematik:[{name:'2. Derece Denklem',formula:'x = (-b ± √(b²-4ac)) / 2a',unit:''},{name:'Sinüs Teoremi',formula:'a/sinA = b/sinB = c/sinC',unit:''},{name:'Kosinüs Teoremi',formula:'c² = a² + b² - 2ab·cosC',unit:''},{name:'Çember',formula:'(x-a)²+(y-b)²=r²',unit:''},{name:'Kombinasyon',formula:'C(n,r) = n!/(r!(n-r)!)',unit:''},{name:'log(ab)',formula:'log(ab) = loga + logb',unit:''},{name:'Aritmetik Dizi',formula:'aₙ = a₁ + (n-1)d',unit:''}]
    };
    const[tab,setTab]=useState('fizik');const[search,setSearch]=useState('');
    const items=(FORMULAS[tab]||[]).filter(f=>!search||f.name.toLowerCase().includes(search.toLowerCase())||f.formula.toLowerCase().includes(search.toLowerCase()));
    return<div className="space-y-3">
        <Inp value={search} onChange={setSearch} placeholder="🔍 Formül ara..."/>
        <div style={{display:'flex',gap:'8px'}}>
            {['fizik','kimya','matematik'].map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:'6px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:tab===t?'#6c63ff':'#1a1a2e',color:tab===t?'#fff':'#9ca3af',textTransform:'capitalize'}}>{t}</button>)}
        </div>
        <div className="space-y-2">
            {items.map((f,i)=><Card key={i} style={{padding:'12px'}}>
                <div style={{fontSize:'13px',fontWeight:'600',color:'#e5e7eb',marginBottom:'6px'}}>{f.name}</div>
                <div style={{fontFamily:'monospace',fontSize:'15px',fontWeight:'bold',color:'#6c63ff',padding:'8px 10px',backgroundColor:'#0a0a0f',borderRadius:'8px'}}>{f.formula}</div>
                {f.unit&&<div style={{fontSize:'11px',color:'#6b7280',marginTop:'6px'}}>📏 {f.unit}</div>}
            </Card>)}
        </div>
    </div>;
});

const TopPg=memo(({topics,setTopics,addXp,notify,sessions,mistakes})=>{
    const[examTab,setExamTab]=useState('TYT');
    const[trackId,setTrackId]=useState('');
    const today=td();
    const tracks=useMemo(()=>MUF.filter(x=>x.exam===examTab),[examTab]);
    useEffect(()=>{if(!tracks.find(t=>t.id===trackId))setTrackId(tracks[0]?.id||'')},[examTab,tracks,trackId]);
    const upd=(track,topic,v)=>setTopics(p=>({...p,[track]:{...(p[track]||{}),[topic]:v}}));
    const markAll=(track,list)=>{setTopics(p=>{const u={...p,[track]:{...(p[track]||{})}};list.forEach(t=>{u[track][t]='mastered'});return u});addXp(20);notify('✅ +20 XP')};
    const topicRows=useMemo(()=>MUF.flatMap(track=>track.topics.map(topic=>{
        const st=(topics[track.id]||{})[topic]||'not_started';
        const topicSessions=sessions.filter(x=>(x.examType||'TYT')===track.exam && x.subject===track.subject && topicMatch(x.topic,topic));
        const topicMistakes=mistakes.filter(x=>x.subject===track.subject && topicMatch(x.topic,topic));
        const questions=topicSessions.reduce((a,x)=>a+qInt(x),0);
        const lastStudy=topicSessions.length?[...topicSessions].sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date:null;
        const gap=lastStudy?diffYmd(lastStudy,today):999;
        const risk=(st==='not_started'?20:st==='learning'?14:st==='practicing'?8:0)+topicMistakes.length*12+(gap>14?18:gap>7?12:gap>3?6:0)+(questions===0?8:questions<25?4:0);
        return{trackId:track.id,exam:track.exam,subject:track.subject,subjectName:track.name,color:track.color,topic,status:st,questions,mistakeCount:topicMistakes.length,lastStudy,gap,risk};
    })),[topics,sessions,mistakes,today]);
    const topRisks=useMemo(()=>[...topicRows].sort((a,b)=>b.risk-a.risk).slice(0,5),[topicRows]);
    const trackStats=useMemo(()=>tracks.map(track=>{const rows=topicRows.filter(r=>r.trackId===track.id);const mastered=rows.filter(r=>r.status==='mastered').length;return{...track,total:rows.length,mastered,risk:rows.length?Math.round(avg(rows.map(r=>r.risk))):0};}),[tracks,topicRows]);
    const currentTrack=tracks.find(t=>t.id===trackId);
    const currentRows=useMemo(()=>topicRows.filter(r=>r.trackId===trackId).sort((a,b)=>b.risk-a.risk),[topicRows,trackId]);
    const row=item=>{const info=TSTATUS[item.status];return(
        <div key={item.topic} style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'10px 12px',marginBottom:'8px',borderLeft:`3px solid ${item.risk>=40?'#ff5252':item.risk>=22?'#ff9800':'#2a2a3e'}`}}>
            <div style={{display:'flex',justifyContent:'space-between',gap:'8px',alignItems:'flex-start',flexWrap:'wrap'}}>
                <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px',flexWrap:'wrap'}}>
                        <div style={{width:'8px',height:'8px',borderRadius:'50%',backgroundColor:info.c,flexShrink:0}}/>
                        <span style={{fontSize:'13px',color:item.status==='mastered'?'#6b7280':'#e5e7eb',textDecoration:item.status==='mastered'?'line-through':'none',fontWeight:'600'}}>{item.topic}</span>
                        <span style={{fontSize:'10px',padding:'2px 8px',borderRadius:'999px',backgroundColor:item.risk>=40?'rgba(255,82,82,.12)':item.risk>=22?'rgba(255,152,0,.12)':'rgba(108,99,255,.12)',color:item.risk>=40?'#ff5252':item.risk>=22?'#ff9800':'#6c63ff'}}>Risk {item.risk}</span>
                    </div>
                    <div style={{display:'flex',gap:'10px',fontSize:'11px',color:'#9ca3af',flexWrap:'wrap'}}>
                        <span>📝 {item.questions} soru</span>
                        <span>❌ {item.mistakeCount} hata</span>
                        <span>{item.lastStudy?`📅 ${fd(item.lastStudy)}`:'📅 çalışma yok'}</span>
                    </div>
                </div>
                <select value={item.status} onChange={e=>upd(item.trackId,item.topic,e.target.value)} style={{fontSize:'11px',backgroundColor:'#0a0a0f',border:'1px solid #2a2a3e',borderRadius:'8px',padding:'4px 8px',color:info.c,cursor:'pointer'}}>
                    {Object.entries(TSTATUS).map(([k,v])=><option key={k} value={k} style={{backgroundColor:'#12121a',color:v.c}}>{v.l}</option>)}
                </select>
            </div>
        </div>
    )};
    return<div className="space-y-4">
        <Card title="🗺️ Konu Bazlı Eksik Haritası" subtitle="TYT ve AYT ayrı, tüm ana konularla birlikte risk görünümü">
            {topRisks.length===0?<div style={{fontSize:'12px',color:'#6b7280'}}>Konu, hata ve çalışma verisi geldikçe risk haritası dolacak.</div>:
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>{topRisks.map((r,i)=><div key={i} style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'10px',border:`1px solid ${r.risk>=40?'rgba(255,82,82,.28)':'rgba(255,152,0,.2)'}`}}><div style={{fontSize:'11px',fontWeight:'700',color:r.color}}>{r.exam} · {r.subjectName}</div><div style={{fontSize:'13px',fontWeight:'600',color:'#fff',marginTop:'2px'}}>{r.topic}</div><div style={{display:'flex',gap:'8px',fontSize:'11px',color:'#9ca3af',marginTop:'6px',flexWrap:'wrap'}}><span>❌ {r.mistakeCount}</span><span>📝 {r.questions}</span><span>{r.lastStudy?fd(r.lastStudy):'çalışılmadı'}</span></div></div>)}</div>}
        </Card>

        <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
            {['TYT','AYT'].map(x=><button key={x} onClick={()=>setExamTab(x)} style={{padding:'6px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:'700',border:'none',cursor:'pointer',backgroundColor:examTab===x?(x==='TYT'?'#6c63ff':'#ff9800'):'#1a1a2e',color:examTab===x?'#fff':'#9ca3af'}}>{x}</button>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'6px'}}>
            {trackStats.map(x=>{const p=x.total>0?Math.round((x.mastered/x.total)*100):0;return(
                <button key={x.id} onClick={()=>setTrackId(x.id)} style={{borderRadius:'14px',padding:'10px',border:`1px solid ${trackId===x.id?x.color:'#2a2a3e'}`,backgroundColor:trackId===x.id?x.color+'15':'#12121a',textAlign:'left',cursor:'pointer'}}>
                    <div style={{fontSize:'12px',fontWeight:'700',color:x.color}}>{x.name}</div>
                    <div style={{fontSize:'14px',fontWeight:'bold',color:'#fff',margin:'2px 0'}}>{x.mastered}/{x.total}</div>
                    <div style={{fontSize:'10px',color:'#9ca3af',marginBottom:'4px'}}>Ort. risk {x.risk}</div>
                    <div style={{backgroundColor:'#0a0a0f',borderRadius:'999px',height:'4px'}}><div style={{width:`${p}%`,height:'4px',borderRadius:'999px',backgroundColor:x.color,transition:'width .7s ease'}}/></div>
                </button>
            )})}
        </div>
        {currentTrack&&<Card title={`📘 ${currentTrack.exam} · ${currentTrack.name}`} subtitle="Durum, soru, hata ve son çalışma tarihi birlikte görünür" action={<Btn onClick={()=>markAll(currentTrack.id,currentTrack.topics)} v="success" s="sm">✓ Tümü</Btn>}>
            <div className="space-y-2">{currentRows.map(row)}</div>
        </Card>}
    </div>;
});

    const TYT_INIT=()=>({turkD:'',turkY:'',matD:'',matY:'',fenD:'',fenY:'',sosD:'',sosY:''});
    const AYT_INIT=()=>({field:'sayisal',matD:'',matY:'',fizD:'',fizY:'',kimD:'',kimY:'',bioD:'',bioY:'',edbD:'',edbY:'',tar1D:'',tar1Y:'',cog1D:'',cog1Y:'',tar2D:'',tar2Y:'',cog2D:'',cog2Y:'',felD:'',felY:'',dinD:'',dinY:''});

    const[tI,setTI]=useState({text:'',subject:'matematik',priority:'medium'});
    const[clock,setClock]=useState(Date.now());

    const todayObj=new Date(clock);
    const today=ymd(todayObj);

    // Persist
    useEffect(()=>{S.s('sessions',sessions)},[sessions]);
    useEffect(()=>{S.s('exams',exams)},[exams]);
    useEffect(()=>{S.s('mistakes',mistakes)},[mistakes]);

    useEffect(()=>{S.s('weeklyPlan',weeklyPlan)},[weeklyPlan]);

    useEffect(()=>{const id=setInterval(()=>setClock(Date.now()),60000);return()=>clearInterval(id)},[]);

    // Auto daily tasks
    useEffect(()=>{
        if(!tasks.some(x=>x.date===today)){
            setTasks(p=>[...p,
                {id:Date.now()+0,date:today,text:'TYT Türkçe – 20 soru',   subject:'turkce',   examType:'TYT',completed:false,xp:10,priority:'high'},

    const streak=useMemo(()=>{

        for(let i=0;i<365;i++){const d=new Date(now.getTime()-i*864e5);const ds=ymd(d);if(sessions.some(x=>x.date===ds))s++;else if(ds!==today)break;}
        return s;
    },[sessions,today]);

    // Badge check
    useEffect(()=>{
        BADGES.forEach(b=>{
            try{if(!earnedBadges.includes(b.id)&&b.chk(sessions,exams,mistakes,streak,xp,flashcards)){
                setEarnedBadges(p=>[...p,b.id]);
                setBanner({show:true,msg:`🏅 Rozet kazandın: ${b.i} ${b.n}!`,type:'success'});
                setTimeout(()=>setBanner(v=>({...v,show:false})),4000);
            }}catch(e){}
        });
    },[sessions,exams,mistakes,streak,xp,flashcards]);

    const notify=useCallback(m=>{setToast({show:true,msg:m});setTimeout(()=>setToast({show:false,msg:''}),2500)},[]);
    const addXp=useCallback(a=>setXp(p=>p+a),[]);
    const closeMd=useCallback(()=>setModal({open:false,type:null}),[]);
    const navTo=useCallback((page,sub)=>{setPg(page);if(sub)setToolTab(sub)},[]);
    const openEditMistake=useCallback(m=>{setMF({id:m.id,subject:m.subject||'matematik',topic:m.topic||'',desc:m.desc||m.description||'',logic:m.logic||m.correctLogic||'',type:m.type||'bilgi',source:m.source||'',image:m.image||'',resolved:!!(m.resolved||m.closed)});setModal({open:true,type:'mistake'})},[]);

    // Today stats - TYT and AYT separate
    const tSess=useMemo(()=>sessions.filter(s=>s.date===today),[sessions,today]);
    const tytQ=useMemo(()=>tSess.filter(s=>isTYT(s)).reduce((a,s)=>a+qInt(s),0),[tSess]);
    const aytQ=useMemo(()=>tSess.filter(s=>isAYT(s)).reduce((a,s)=>a+qInt(s),0),[tSess]);
    const tMins=useMemo(()=>tSess.reduce((a,s)=>a+dInt(s),0),[tSess]);
    const tytDayMap=useMemo(()=>({
        turkce:tSess.filter(s=>isTYT(s)&&s.subject==='turkce').reduce((a,s)=>a+qInt(s),0),
        matematik:tSess.filter(s=>isTYT(s)&&s.subject==='matematik').reduce((a,s)=>a+qInt(s),0),
        fen:tSess.filter(s=>isTYT(s)&&['fizik','kimya','biyoloji'].includes(s.subject)).reduce((a,s)=>a+qInt(s),0),
        sosyal:tSess.filter(s=>isTYT(s)&&['tarih','cografya','felsefe','din'].includes(s.subject)).reduce((a,s)=>a+qInt(s),0)
    }),[tSess]);
    const tTasks=useMemo(()=>tasks.filter(t=>t.date===today),[tasks,today]);
    const tDone=useMemo(()=>tTasks.filter(t=>t.completed).length,[tTasks]);
    const lvl=useMemo(()=>gl(xp),[xp]);
    const nLvl=useMemo(()=>nlvl(xp),[xp]);
    const lvlPct=useMemo(()=>nLvl.min>lvl.min?((xp-lvl.min)/(nLvl.min-lvl.min))*100:100,[xp,lvl,nLvl]);
    const dueFC=useMemo(()=>flashcards.filter(c=>SM2.isDue(c)).length,[flashcards]);
    const avgRet=useMemo(()=>{const a=flashcards.filter(c=>c.totalReviews>0);return a.length?Math.round(a.reduce((ac,c)=>ac+SM2.getRetention(c),0)/a.length):0},[flashcards]);

    const activeDays7=useMemo(()=>new Set(sessions.filter(s=>{const d=diffYmd(s.date,today);return d>=0&&d<7}).map(s=>s.date)).size,[sessions,today]);
    const recentExamActivity=useMemo(()=>exams.some(e=>{const d=diffYmd(e.date,today);return d>=0&&d<7}),[exams,today]);
    const examTrend=useMemo(()=>{
        const series=[...exams].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(e=>((e.tot||0)/(e.examType==='AYT'?80:120))*100);
        if(series.length<2)return{status:'insufficient',delta:0,recentAvg:avg(series),prevAvg:0,color:'#6b7280',label:'Veri az'};
        const recent=series.slice(-3),prev=series.slice(-6,-3);
        const recentAvg=avg(recent),prevAvg=avg(prev.length?prev:series.slice(0,-recent.length));
        const delta=Math.round((recentAvg-prevAvg)*10)/10;
        if(delta<=-4)return{status:'slump',delta,recentAvg,prevAvg,color:'#ff5252',label:'Düşüş'};

                tar1D:iVal(eAYT.tar1D),tar1Y:iVal(eAYT.tar1Y),t1N:aytNet.t1,

                tot:aytNet.tot
            };
        }

                            <div style={{fontSize:'12px',fontWeight:'bold',color:'#fff'}}>{x.v?.toFixed(1)}</div>
                            <div style={{fontSize:'10px',color:'#6b7280'}}>{x.l}</div>
                        </div>)}

                </Card>}
                {!lastTYT&&<Card><p style={{color:'#6b7280',textAlign:'center',padding:'12px 0',fontSize:'12px'}}>Henüz TYT denemesi yok</p></Card>}

    // ── EXAM PAGE ──────────────────────────────────────────────
    const ExamPg=()=>{
        const[viewType,setViewType]=useState('all');
        const[cmpA,setCmpA]=useState('');
        const[cmpB,setCmpB]=useState('');
        const tytExams=exams.filter(e=>!e.examType||e.examType==='TYT');
        const aytExams=exams.filter(e=>e.examType==='AYT');
        const viewExams=viewType==='TYT'?tytExams:viewType==='AYT'?aytExams:exams;
        const tytAvg=tytExams.length?(tytExams.reduce((a,e)=>a+(e.tot||0),0)/tytExams.length).toFixed(1):'—';
        const aytAvg=aytExams.length?(aytExams.reduce((a,e)=>a+(e.tot||0),0)/aytExams.length).toFixed(1):'—';
        const tytBest=tytExams.length?Math.max(...tytExams.map(e=>e.tot||0)).toFixed(1):'—';
        const aytBest=aytExams.length?Math.max(...aytExams.map(e=>e.tot||0)).toFixed(1):'—';
        const examOptions=[...exams].sort((a,b)=>new Date(b.date)-new Date(a.date));
        const examById=id=>examOptions.find(x=>String(x.id)===String(id));
        const examA=examById(cmpA)||examOptions[0]||null;
        const examB=examById(cmpB)||examOptions[1]||null;
        const compareRows=useMemo(()=>{
            if(!examA||!examB)return[];
            const sameTYT=((!examA.examType||examA.examType==='TYT')&&(!examB.examType||examB.examType==='TYT'));
            if(sameTYT)return[{l:'Türkçe',a:examA.tN||0,b:examB.tN||0,c:'#29b6f6'},{l:'Matematik',a:examA.mN||0,b:examB.mN||0,c:'#6c63ff'},{l:'Fen',a:examA.fN||0,b:examB.fN||0,c:'#00c853'},{l:'Sosyal',a:examA.sN||0,b:examB.sN||0,c:'#ff9800'}];
            if(examA.examType==='AYT'&&examB.examType==='AYT'&&examA.field===examB.field&&examA.field==='sayisal')return[{l:'Matematik',a:examA.mN||0,b:examB.mN||0,c:'#6c63ff'},{l:'Fizik',a:examA.fN||0,b:examB.fN||0,c:'#00c853'},{l:'Kimya',a:examA.kN||0,b:examB.kN||0,c:'#ffd600'},{l:'Biyoloji',a:examA.bN||0,b:examB.bN||0,c:'#ff5252'}];
            if(examA.examType==='AYT'&&examB.examType==='AYT'&&examA.field===examB.field&&examA.field==='ea')return[{l:'Edebiyat',a:examA.eN||0,b:examB.eN||0,c:'#29b6f6'},{l:'Matematik',a:examA.mN||0,b:examB.mN||0,c:'#6c63ff'},{l:'Tarih-1',a:examA.tN||0,b:examB.tN||0,c:'#ff9800'},{l:'Coğrafya-1',a:examA.cN||0,b:examB.cN||0,c:'#e91e63'}];
            if(examA.examType==='AYT'&&examB.examType==='AYT'&&examA.field===examB.field&&examA.field==='sozel')return[{l:'Edebiyat',a:examA.eN||0,b:examB.eN||0,c:'#29b6f6'},{l:'Tarih-1',a:examA.t1N||0,b:examB.t1N||0,c:'#ff9800'},{l:'Coğ-1',a:examA.c1N||0,b:examB.c1N||0,c:'#e91e63'},{l:'Tarih-2',a:examA.t2N||0,b:examB.t2N||0,c:'#ffb74d'},{l:'Coğ-2',a:examA.c2N||0,b:examB.c2N||0,c:'#ec407a'},{l:'Felsefe',a:examA.felN||0,b:examB.felN||0,c:'#9c27b0'},{l:'Din',a:examA.dinN||0,b:examB.dinN||0,c:'#795548'}];
            return[];
        },[cmpA,cmpB,exams]);
        return<div className="space-y-4">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <h1 style={{fontSize:'20px',fontWeight:'bold',color:'#fff',margin:0}}>📊 Denemeler</h1>
                <Btn onClick={()=>setModal({open:true,type:'exam'})}>+ Ekle</Btn>
            </div>
            {/* TYT / AYT summary boxes */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
                <Card style={{border:'1px solid rgba(108,99,255,.25)'}}>
                    <ExamBadge type="TYT" size="md"/>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginTop:'10px'}}>
                        {[{l:'Ort.',v:tytAvg,c:'#6c63ff'},{l:'En İyi',v:tytBest,c:'#00c853'},{l:'Deneme',v:tytExams.length,c:'#ffd600'},{l:'Max',v:'120',c:'#6b7280'}].map((x,i)=>(
                            <div key={i} style={{backgroundColor:'#1a1a2e',borderRadius:'10px',padding:'8px',textAlign:'center'}}>
                                <div style={{fontSize:'16px',fontWeight:'bold',color:x.c}}>{x.v}</div>
                                <div style={{fontSize:'11px',color:'#6b7280'}}>{x.l}</div>
                            </div>
                        ))}
                    </div>
                </Card>
                <Card style={{border:'1px solid rgba(255,152,0,.25)'}}>
                    <ExamBadge type="AYT" size="md"/>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginTop:'10px'}}>
                        {[{l:'Ort.',v:aytAvg,c:'#ff9800'},{l:'En İyi',v:aytBest,c:'#00c853'},{l:'Deneme',v:aytExams.length,c:'#ffd600'},{l:'Max',v:'80',c:'#6b7280'}].map((x,i)=>(
                            <div key={i} style={{backgroundColor:'#1a1a2e',borderRadius:'10px',padding:'8px',textAlign:'center'}}>
                                <div style={{fontSize:'16px',fontWeight:'bold',color:x.c}}>{x.v}</div>
                                <div style={{fontSize:'11px',color:'#6b7280'}}>{x.l}</div>
                            </div>
                        ))}
                    </div>
                </Card>
            </div>
            <Card title="⚖️ Deneme Karşılaştırma Modu" subtitle="İki denemeyi yan yana kıyasla">
                {examOptions.length<2?<p style={{color:'#6b7280',fontSize:'13px'}}>Karşılaştırma için en az 2 deneme gerekli.</p>:<>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'12px'}}>
                    <Sel label="1. deneme" value={cmpA||String(examOptions[0]?.id||'')} onChange={setCmpA} options={examOptions.map(e=>({value:String(e.id),label:`${e.examType||'TYT'} · ${e.title||e.source||fdf(e.date)}`}))}/>
                    <Sel label="2. deneme" value={cmpB||String(examOptions[1]?.id||examOptions[0]?.id||'')} onChange={setCmpB} options={examOptions.map(e=>({value:String(e.id),label:`${e.examType||'TYT'} · ${e.title||e.source||fdf(e.date)}`}))}/>
                </div>
                {examA&&examB&&<>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'12px'}}>
                        {[examA,examB].map((e,i)=><div key={i} style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'10px'}}><div style={{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap',marginBottom:'4px'}}><ExamBadge type={e.examType||'TYT'}/>{e.field&&<span style={{fontSize:'11px',color:'#9ca3af'}}>{AYT_FIELDS[e.field]?.name}</span>}{e.source&&<span style={{fontSize:'11px',color:'#9ca3af'}}>📚 {e.source}</span>}</div><div style={{fontSize:'12px',color:'#fff',fontWeight:'600'}}>{e.title||'Deneme'}</div><div style={{fontSize:'11px',color:'#6b7280'}}>{fdf(e.date)}</div><div style={{fontSize:'24px',fontWeight:'700',color:(e.examType==='AYT'?'#ff9800':'#6c63ff'),marginTop:'8px'}}>{(e.tot||0).toFixed(1)}</div></div>)}
                    </div>
                    <div style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'12px',marginBottom:'10px'}}>

                <div>
                    <label style={{display:'block',fontSize:'12px',color:'#6b7280',marginBottom:'4px'}}>Fotoğraf / ekran görüntüsü</label>
                    <input type="file" accept="image/*" style={{width:'100%',fontSize:'12px',color:'#9ca3af'}} onChange={e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>1200000){notify('⚠️ Görsel çok büyük. 1.2MB altı seç.');e.target.value='';return}const r=new FileReader();r.onload=ev=>setMF(p=>({...p,image:ev.target.result}));r.readAsDataURL(f);}}/>
                    {mF.image&&<div style={{marginTop:'8px'}}><img src={mF.image} alt="Önizleme" style={{width:'100%',maxHeight:'180px',objectFit:'contain',borderRadius:'12px',border:'1px solid #2a2a3e',backgroundColor:'#0a0a0f'}}/><button onClick={()=>setMF(p=>({...p,image:''}))} style={{marginTop:'6px',background:'none',border:'none',color:'#ff5252',cursor:'pointer',fontSize:'12px'}}>Görseli kaldır</button></div>}
                </div>
                <label style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'12px',color:'#9ca3af'}}><input type='checkbox' checked={!!mF.resolved} onChange={e=>setMF(p=>({...p,resolved:e.target.checked}))} style={{accentColor:'#6c63ff'}}/>Bu hata kapandı olarak işaretlensin</label><Btn onClick={addMistake} style={{width:'100%',justifyContent:'center'}}>{mF.id?'💾 Güncelle':'💾 Kaydet (+5 XP)'}</Btn>
            </div>
        </Modal>

        {/* MODAL: Task */}
        <Modal isOpen={modal.open&&modal.type==='task'} onClose={closeMd} title="✅ Görev Ekle">
            <div className="space-y-3">
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                    {['TYT','AYT'].map(t=><button key={t} onClick={()=>setTI(p=>({...p,examType:t}))}
                        style={{padding:'8px',borderRadius:'10px',border:`2px solid ${(tI.examType||'TYT')===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#2a2a3e'}`,cursor:'pointer',fontWeight:'700',fontSize:'13px',
                            backgroundColor:(tI.examType||'TYT')===t?(t==='TYT'?'rgba(108,99,255,.2)':'rgba(255,152,0,.2)'):'#1a1a2e',
                            color:(tI.examType||'TYT')===t?(t==='TYT'?'#6c63ff':'#ff9800'):'#6b7280'}}>
                        {t}
                    </button>)}
                </div>
                <Inp label="Görev Adı" value={tI.text} onChange={v=>setTI(p=>({...p,text:v}))} placeholder="Matematik – 20 soru"/>
                <Sel label="Ders" value={tI.subject} onChange={v=>setTI(p=>({...p,subject:v}))} options={[{value:'genel',label:'Genel'},...SUBS.map(s=>({value:s.id,label:s.name}))]}/>
                <Sel label="Öncelik" value={tI.priority||'medium'} onChange={v=>setTI(p=>({...p,priority:v}))} options={[{value:'high',label:'🔴 Yüksek'},{value:'medium',label:'🟡 Orta'},{value:'low',label:'🟢 Düşük'}]}/>
                <Btn onClick={()=>{
                    if(!tI.text.trim()){notify('⚠️ Görev adı!');return}
                    setTasks(p=>[...p,{id:Date.now(),date:today,text:tI.text,subject:tI.subject,examType:tI.examType||'TYT',completed:false,xp:10,priority:tI.priority||'medium'}]);
                    setTI({text:'',subject:'matematik',priority:'medium',examType:'TYT'});
                    closeMd();notify('✅ Görev eklendi!');
                }} style={{width:'100%',justifyContent:'center'}}>➕ Ekle</Btn>
            </div>
        </Modal>

        <Toast msg={toast.msg} show={toast.show}/>
    </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
        navigator.serviceWorker.getRegistrations()
            .then(regs=>Promise.all(regs.map(r=>r.unregister())))
            .then(()=>('caches' in window?caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))):null))
            .catch(()=>{});
    });
}
</script>
</body>
</html>
