// ── SM-2 SPACED REPETITION ENGINE ──────────────────────
const SM2={
    DEFAULT_EF:2.5,
    
    init:()=>({ef:2.5,interval:0,reps:0,nextReview:null,lastReview:null,totalReviews:0,history:[]}),
    
    review:(card,quality)=>{
        // quality: 1=Tekrar, 2=Zor, 3=Orta, 4=Kolay, 5=Mükemmel
        const q=Math.max(1,Math.min(5,quality));
        const ef=Math.max(1.3,(card.ef||2.5)+(0.1-(5-q)*(0.08+(5-q)*0.02)));
        let interval,reps;
        if(q<3){interval=1;reps=0}
        else{
            reps=(card.reps||0)+1;
            if(reps===1)interval=1;
            else if(reps===2)interval=6;
            else interval=Math.round((card.interval||1)*ef);
        }
        const nd=new Date();nd.setDate(nd.getDate()+interval);
        const today=new Date().toISOString().split('T')[0];
        return{ef,interval,reps,nextReview:nd.toISOString().split('T')[0],lastReview:today,totalReviews:(card.totalReviews||0)+1,history:[...(card.history||[]).slice(-19),{date:today,quality:q,interval}]};
    },
    
    // Ebbinghaus: R = e^(-t/S), S=stability=interval
    retention:(daysSince,stability)=>Math.round(100*Math.exp(-daysSince/Math.max(1,stability))),
    
    getRetention:(card)=>{
        if(!card||!card.lastReview)return 0;
        const days=Math.max(0,Math.floor((Date.now()-new Date(card.lastReview+'T00:00:00').getTime())/86400000));
        return SM2.retention(days,card.interval||1);
    },
    
    isDue:(card)=>{
        if(!card||!card.nextReview)return true;
        return card.nextReview<=new Date().toISOString().split('T')[0];
    },
    
    curvePoints:(stability,days=30)=>Array.from({length:days+1},(_,i)=>({day:i,r:SM2.retention(i,stability)})),
    
    stabilityLabel:(ef)=>ef>=2.2?'Güçlü':ef>=1.7?'Orta':'Zayıf',
    
    nextLabel:(card)=>{
        if(!card.nextReview)return 'Bugün';
        const days=Math.floor((new Date(card.nextReview+'T00:00:00').getTime()-Date.now())/86400000);
        if(days<=0)return 'Bugün';
        if(days===1)return 'Yarın';
        return `${days}g sonra`;
    }
};

// Linear regression for score prediction
const linReg=(vals)=>{
    const n=vals.length;if(n<2)return null;
    const xm=(n-1)/2;const ym=vals.reduce((a,b)=>a+b,0)/n;
    const slope=vals.reduce((s,y,x)=>s+(x-xm)*(y-ym),0)/vals.reduce((s,_,x)=>s+(x-xm)**2,0||1);
    const intc=ym-slope*xm;
    return{slope,intercept:intc,predict:(x)=>Math.max(0,intc+slope*x)};
};

// Retention Ring Component
const RetentionRing=memo(({pct,size=80,label,color})=>{
    const r=size/2-8;const circ=2*Math.PI*r;const off=circ-(pct/100)*circ;const c=color||retColor(pct);
    return<div style={{textAlign:'center'}}>
        <svg width={size} height={size}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1a1a2e" strokeWidth="7"/>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={c} strokeWidth="7"
                strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
                className="retention-ring" transform={`rotate(-90 ${size/2} ${size/2})`}
                style={{filter:`drop-shadow(0 0 5px ${c}88)`}}/>
            <text x={size/2} y={size/2+5} textAnchor="middle" fill="#fff" fontSize="14" fontWeight="bold">{pct}%</text>
        </svg>
        {label&&<div style={{fontSize:'11px',color:'#6b7280',marginTop:'4px'}}>{label}</div>}
    </div>;
});

        const days=Array.from({length:31},(_,i)=>i);
        ci.current=new Chart(ref.current,{
            type:'line',
            data:{
                labels:days,
                datasets:stabilities.map(({s,l,c})=>({
                    label:l,
                    data:days.map(d=>SM2.retention(d,s)),
                    borderColor:c,backgroundColor:c+'11',fill:false,tension:.4,
                    borderWidth:2,pointRadius:0,

            options:{
                responsive:true,maintainAspectRatio:false,

                scales:{
                    y:{beginAtZero:true,max:100,ticks:{color:'#6b7280',font:{size:9},callback:v=>`%${v}`},grid:{color:'#1a1a2e'},title:{display:true,text:'Hafıza Tutma %',color:'#6b7280',font:{size:10}}},
                    x:{ticks:{color:'#6b7280',font:{size:9}},grid:{color:'#1a1a2e11'},title:{display:true,text:'Gün',color:'#6b7280',font:{size:10}}}

// ── HEATMAP ────────────────────────────────────────────
const Heatmap=memo(({sessions})=>{
    const cells=[];const now=new Date();
    for(let i=90;i>=0;i--){
        const d=new Date(now);d.setDate(d.getDate()-i);
        const ds=d.toISOString().split('T')[0];
        const mins=sessions.filter(s=>s.date===ds).reduce((a,s)=>a+dInt(s),0);
        const l=mins>=180?4:mins>=120?3:mins>=60?2:mins>0?1:0;
        const colors=['#1a1a2e','#1e3a2e','#2d5c40','#3d8050','#4dab62'];
        cells.push(<div key={ds} style={{width:'10px',height:'10px',backgroundColor:colors[l],borderRadius:'2px',cursor:'help',transition:'all .2s'}} title={`${fdf(ds)}: ${mins}dk`}/>);
    }
    return<div style={{display:'flex',flexWrap:'wrap',gap:'2px'}}>{cells}</div>;
});

// ── POMODORO ───────────────────────────────────────────
const Pomodoro=memo(({onComplete})=>{
    const[mode,setMode]=useState('focus');
    const[tl,setTl]=useState(25*60);
    const[run,setRun]=useState(false);
    const[done,setDone]=useState(0);
    const ref=useRef(null);
    useEffect(()=>{
        if(run&&tl>0){ref.current=setInterval(()=>setTl(t=>t-1),1000)}
        else if(tl===0){clearInterval(ref.current);if(mode==='focus'){setDone(d=>d+1);onComplete&&onComplete(25);setMode('break');setTl(5*60)}else{setMode('focus');setTl(25*60)}setRun(false)}
        return()=>clearInterval(ref.current);
    },[run,tl,mode]);
    const totals={focus:25*60,break:5*60,long:15*60};
    const tot=totals[mode]||25*60;
    const pct=((tot-tl)/tot)*100;
    const r=55;const circ=2*Math.PI*r;const off=circ-(pct/100)*circ;
    const fmt=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    return<div style={{textAlign:'center'}}>
        <div style={{display:'flex',justifyContent:'center',gap:'6px',marginBottom:'12px'}}>
            {[['focus','🎯 Odak',25*60],['break','☕ Kısa',5*60],['long','🛋️ Uzun',15*60]].map(([m,l,t])=>(
                <button key={m} onClick={()=>{setMode(m);setTl(t);setRun(false)}}
                    style={{padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',cursor:'pointer',border:'none',backgroundColor:mode===m?'#6c63ff':'#1a1a2e',color:mode===m?'#fff':'#9ca3af'}}>
                    {l}</button>
            ))}
        </div>
        <div style={{position:'relative',display:'inline-block',marginBottom:'12px'}}>
            <svg width="130" height="130">
                <circle cx="65" cy="65" r={r} fill="none" stroke="#1a1a2e" strokeWidth="8"/>
                <circle cx="65" cy="65" r={r} fill="none" stroke={mode==='focus'?'#6c63ff':'#00c853'} strokeWidth="8"
                    strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round" transform="rotate(-90 65 65)"
                    style={{transition:'stroke-dashoffset .3s',filter:`drop-shadow(0 0 8px ${mode==='focus'?'#6c63ff':'#00c853'}88)`}}/>
                <text x="65" y="60" textAnchor="middle" fill="#fff" fontSize="24" fontWeight="bold">{fmt(tl)}</text>
                <text x="65" y="80" textAnchor="middle" fill="#6b7280" fontSize="11">{done}🍅</text>
            </svg>
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px'}}>
            <Btn onClick={()=>setRun(!run)} v={run?'danger':'primary'}>{run?'⏸ Dur':'▶ Başlat'}</Btn>
            <Btn onClick={()=>{setTl(tot);setRun(false)}} v="ghost">↺</Btn>
        </div>
    </div>;
});

// ── LIVE TIMER ─────────────────────────────────────────
const LiveTimer=memo(({onSave,notify})=>{
    const[run,setRun]=useState(false);const[elapsed,setElapsed]=useState(0);
    const[sub,setSub]=useState('matematik');const[topic,setTopic]=useState('');
    const startRef=useRef(null);const intRef=useRef(null);
    const start=()=>{startRef.current=Date.now()-elapsed*1000;intRef.current=setInterval(()=>setElapsed(Math.floor((Date.now()-startRef.current)/1000)),1000);setRun(true)};
    const stop=()=>{clearInterval(intRef.current);setRun(false)};
    const reset=()=>{stop();setElapsed(0)};
    const save=()=>{
        const mins=Math.floor(elapsed/60);
        if(mins<1){notify('⚠️ En az 1 dakika!');return}
        if(!topic.trim()){notify('⚠️ Konu gir!');return}
        onSave({subject:sub,topic,dur:mins.toString(),qc:'0'});reset();setTopic('');
    };
    useEffect(()=>()=>clearInterval(intRef.current),[]);
    const h=Math.floor(elapsed/3600),m=Math.floor((elapsed%3600)/60),sec=elapsed%60;
    const fmt=h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return<div>
        <div style={{textAlign:'center',margin:'12px 0'}}><div style={{fontFamily:'monospace',fontSize:'44px',fontWeight:'bold',color:run?'#6c63ff':'#e5e7eb'}}>{fmt}</div></div>
        <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'12px'}}>
            <Btn onClick={run?stop:start} v={run?'danger':'primary'}>{run?'⏸ Dur':'▶ Başlat'}</Btn>
            {!run&&elapsed>0&&<Btn onClick={save} v="success">💾 Kaydet ({Math.floor(elapsed/60)}dk)</Btn>}
            {elapsed>0&&<Btn onClick={reset} v="ghost">↺</Btn>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            <Sel label="Ders" value={sub} onChange={setSub} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
            <Inp label="Konu" value={topic} onChange={setTopic} placeholder="Konu adı..."/>
        </div>
    </div>;
});

// ── QUIZ ───────────────────────────────────────────────
const QuizMode=memo(({notify,addXp})=>{
    const[mode,setMode]=useState('menu');const[qs,setQs]=useState([]);const[cur,setCur]=useState(0);
    const[sel,setSel]=useState(null);const[score,setScore]=useState(0);const[answers,setAnswers]=useState([]);
    const[subFilter,setSubFilter]=useState('all');const[timeLeft,setTimeLeft]=useState(30);
    const timerRef=useRef(null);const scoreRef=useRef(0);
    const start=()=>{
        const src=subFilter==='all'?QUIZ_QUESTIONS:QUIZ_QUESTIONS.filter(q=>q.sub===subFilter);
        const shuffled=[...src].sort(()=>Math.random()-.5).slice(0,10);
        setQs(shuffled);setCur(0);setSel(null);setScore(0);scoreRef.current=0;setAnswers([]);setTimeLeft(30);setMode('quiz');
    };
    const handleAnswer=useCallback((idx)=>{
        clearInterval(timerRef.current);if(sel!==null)return;
        setSel(idx);const correct=idx===qs[cur].ans;
        if(correct){setScore(s=>{scoreRef.current=s+1;return s+1})}
        setAnswers(p=>[...p,{q:qs[cur],sel:idx,correct}]);
        setTimeout(()=>{
            if(cur<qs.length-1){setCur(c=>c+1);setSel(null);setTimeLeft(30)}
            else{addXp(scoreRef.current*3);notify(`🧠 Quiz bitti! +${scoreRef.current*3} XP`);setMode('result')}
        },1000);
    },[sel,qs,cur,addXp,notify]);
    useEffect(()=>{
        if(mode!=='quiz')return;
        clearInterval(timerRef.current);
        timerRef.current=setInterval(()=>{setTimeLeft(t=>{if(t<=1){handleAnswer(-1);return 30}return t-1})},1000);
        return()=>clearInterval(timerRef.current);
    },[mode,cur]);
    useEffect(()=>()=>clearInterval(timerRef.current),[]);
    if(mode==='menu')return<div className="space-y-4">
        <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'12px'}}>
            {[{id:'all',name:'Tümü'},...SUBS.slice(0,5)].map(s=><button key={s.id} onClick={()=>setSubFilter(s.id)} style={{padding:'6px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:subFilter===s.id?(s.color||'#6c63ff'):'#1a1a2e',color:subFilter===s.id?'#fff':'#9ca3af'}}>{s.name||s.id}</button>)}
        </div>
        <Btn onClick={start} className="w-full" s="lg" style={{justifyContent:'center'}}>🚀 Başla (10 Soru)</Btn>
    </div>;
    if(mode==='quiz'&&qs[cur])return<div className="space-y-3">
        <div style={{display:'flex',justifyContent:'space-between'}}>
            <span style={{fontWeight:'bold',color:'#fff'}}>{cur+1}/{qs.length}</span>
            <div style={{fontSize:'18px',fontWeight:'bold',color:timeLeft<=10?'#ff5252':'#6c63ff'}}>⏱{timeLeft}s</div>
            <span style={{color:'#00c853'}}>✅{score}</span>
        </div>
        <PBar value={timeLeft} max={30} color={timeLeft<=10?'#ff5252':'#6c63ff'} label={false} size="sm"/>
        <Card>
            <p style={{fontSize:'16px',fontWeight:'600',color:'#fff',marginBottom:'16px'}}>{qs[cur].q}</p>
            <div className="space-y-2">{qs[cur].opts.map((opt,i)=>{
                let bg='#1a1a2e',border='#2a2a3e';
                if(sel!==null){if(i===qs[cur].ans){bg='rgba(0,200,83,.15)';border='#00c853'}else if(i===sel){bg='rgba(255,82,82,.15)';border='#ff5252'}}
                return<button key={i} onClick={()=>handleAnswer(i)} disabled={sel!==null} style={{width:'100%',backgroundColor:bg,border:`1px solid ${border}`,borderRadius:'12px',padding:'12px 16px',textAlign:'left',fontSize:'14px',color:'#e5e7eb',cursor:sel===null?'pointer':'default',transition:'all .2s',display:'block'}}>
                    <span style={{color:'#6c63ff',fontWeight:'bold',marginRight:'8px'}}>{String.fromCharCode(65+i)})</span>{opt}</button>;
            })}</div>
        </Card>
    </div>;
    if(mode==='result'){
        const pct=Math.round((score/answers.length)*100);
        return<div style={{textAlign:'center'}} className="space-y-4">
            <div style={{fontSize:'48px'}}>{pct>=80?'🏆':pct>=60?'👍':'📚'}</div>
            <div style={{fontSize:'36px',fontWeight:'bold',color:pct>=80?'#00c853':pct>=60?'#ffd600':'#ff5252'}}>%{pct}</div>
            <div className="space-y-2" style={{maxHeight:'200px',overflowY:'auto'}}>
                {answers.map((a,i)=><div key={i} style={{borderRadius:'12px',padding:'10px',textAlign:'left',backgroundColor:a.correct?'rgba(0,200,83,.1)':'rgba(255,82,82,.1)',border:`1px solid ${a.correct?'#00c853':'#ff5252'}`}}>
                    <div style={{fontWeight:'600',color:'#fff',fontSize:'13px'}}>{a.q.q}</div>
                    {!a.correct&&<div style={{color:'#00c853',fontSize:'12px'}}>✅ {a.q.opts[a.q.ans]}</div>}
                </div>)}
            </div>
            <Btn onClick={()=>setMode('menu')} className="w-full" style={{justifyContent:'center'}}>Tekrar</Btn>
        </div>;
    }
    return null;
});

// ── SM-2 FLASHCARDS (upgraded) ─────────────────────────
const Flashcards=memo(({notify,addXp})=>{
    const[cards,setCards]=useState(()=>{
        const saved=S.g('flashcards',[]);
        // Migrate: add SM-2 fields to existing cards
        return saved.map(c=>({...SM2.init(),...c}));
    });
    const[mode,setMode]=useState('list');// 'list','study','result'
    const[reviewMode,setReviewMode]=useState('all');// 'all','due'
    const[cur,setCur]=useState(0);const[flipped,setFlipped]=useState(false);
    const[stats,setStats]=useState({again:0,hard:0,good:0,easy:0});
    const[form,setForm]=useState({sub:'matematik',front:'',back:'',tag:''});
    const[filter,setFilter]=useState('all');
    useEffect(()=>S.s('flashcards',cards),[cards]);

    const dueCards=useMemo(()=>cards.filter(c=>SM2.isDue(c)),[cards]);
    const filtered=useMemo(()=>{
        const byFilter=filter==='all'?cards:cards.filter(c=>c.sub===filter);
        return reviewMode==='due'?byFilter.filter(c=>SM2.isDue(c)):byFilter;
    },[cards,filter,reviewMode]);

    const avgRetention=useMemo(()=>{
        const active=cards.filter(c=>c.totalReviews>0);
        if(!active.length)return 0;
        return Math.round(active.reduce((a,c)=>a+SM2.getRetention(c),0)/active.length);
    },[cards]);

    const addCard=()=>{
        if(!form.front.trim()||!form.back.trim()){notify('⚠️ Ön ve arka yüz gerekli!');return}
        setCards(p=>[...p,{id:Date.now(),sub:form.sub,front:form.front,back:form.back,tag:form.tag,...SM2.init()}]);
        setForm(p=>({...p,front:'',back:'',tag:''}));addXp(2);notify('🃏 Kart eklendi! +2 XP');
    };

    const startStudy=()=>{
        if(!filtered.length){notify('⚠️ Kart yok!');return}
        // Sort: due first, then by retention ascending
        const sorted=[...filtered].sort((a,b)=>{
            const aDue=SM2.isDue(a)?0:1,bDue=SM2.isDue(b)?0:1;
            if(aDue!==bDue)return aDue-bDue;
            return SM2.getRetention(a)-SM2.getRetention(b);
        });
        setCur(0);setFlipped(false);setStats({again:0,hard:0,good:0,easy:0});setMode('study');
    };

    const rateCard=useCallback((quality)=>{
        // quality map: 'again'=1, 'hard'=2, 'good'=4, 'easy'=5
        const qMap={again:1,hard:2,good:4,easy:5};
        const q=qMap[quality]||3;
        const updated=SM2.review(filtered[cur],q);
        setCards(p=>p.map(c=>c.id===filtered[cur].id?{...c,...updated}:c));
        const newStats={...stats,[quality]:stats[quality]+1};setStats(newStats);
        if(cur<filtered.length-1){setCur(c=>c+1);setFlipped(false)}
        else{
            const xpG=newStats.good*3+newStats.easy*5+newStats.hard*1;
            addXp(xpG);notify(`✅ Tur bitti! +${xpG} XP`);setMode('result');
        }
    },[filtered,cur,stats,addXp,notify]);

    if(mode==='study'&&filtered[cur]){
        const card=filtered[cur];const ret=SM2.getRetention(card);const isDue=SM2.isDue(card);
        return<div className="space-y-4">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'13px',color:'#9ca3af'}}>{cur+1}/{filtered.length}</span>
                <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                    {isDue&&<span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:'rgba(255,82,82,.2)',color:'#ff5252'}}>⚠️ Vadesi Geçti</span>}
                    <RetentionRing pct={ret} size={48}/>
                </div>
                <Btn onClick={()=>setMode('list')} v="ghost" s="sm">× Çık</Btn>
            </div>
            <PBar value={cur+1} max={filtered.length} color="#6c63ff" label={false}/>
            <div style={{height:'220px',cursor:'pointer',position:'relative'}} onClick={()=>setFlipped(!flipped)}>
                <div style={{position:'relative',height:'100%',transformStyle:'preserve-3d',transition:'transform .6s',transform:flipped?'rotateY(180deg)':'rotateY(0deg)'}}>
                    <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden',backgroundColor:'#1a1a2e',border:'2px solid #6c63ff',borderRadius:'16px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px'}}>
                        <div style={{fontSize:'11px',color:'#6c63ff',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>Soru</div>
                        <div style={{fontSize:'18px',fontWeight:'bold',color:'#fff',textAlign:'center'}}>{card.front}</div>
                        <div style={{fontSize:'11px',color:'#6b7280',marginTop:'12px'}}>Görmek için dokun 👆</div>
                        <div style={{position:'absolute',bottom:'12px',right:'12px',fontSize:'11px',color:'#4b5563'}}>EF: {(card.ef||2.5).toFixed(1)} | {SM2.nextLabel(card)}</div>
                    </div>
                    <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden',transform:'rotateY(180deg)',backgroundColor:'#1a1a2e',border:'2px solid #00c853',borderRadius:'16px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px'}}>

        const avgEF=active.length?(active.reduce((a,c)=>a+(c.ef||2.5),0)/active.length).toFixed(2):2.5;
        const avgInt=active.length?Math.round(active.reduce((a,c)=>a+(c.interval||0),0)/active.length):0;
        const totalReps=flashcards.reduce((a,c)=>a+(c.totalReviews||0),0);
        const critical=flashcards.filter(c=>SM2.getRetention(c)<40&&c.totalReviews>0);
        return{active:active.length,due:due.length,avgRet,avgEF,avgInt,totalReps,critical:critical.length,total:flashcards.length};
    },[flashcards]);

    // Retention by subject
    const subRetention=useMemo(()=>SUBS.map(s=>{
        const sc=flashcards.filter(c=>c.sub===s.id&&c.totalReviews>0);
        const ret=sc.length?Math.round(sc.reduce((a,c)=>a+SM2.getRetention(c),0)/sc.length):null;

        const tots=sorted.map(e=>e.tot||0);
        const reg=linReg(tots);if(!reg)return null;
        const daysLeft=yksGun();const weeksLeft=daysLeft/7;
        const currentAvg=tots.slice(-3).reduce((a,b)=>a+b,0)/3;
        // Extrapolate: approximate weeks of exam taking
        const examWeeks=sorted.length;
        const predicted=reg.predict(examWeeks+Math.min(weeksLeft/4,8));// assume 4 exams/month max
        const trendPct=((predicted-currentAvg)/currentAvg*100);
        return{current:currentAvg.toFixed(1),predicted:predicted.toFixed(1),trend:trendPct.toFixed(1),positive:trendPct>0,exams:tots.length,slope:reg.slope.toFixed(2)};

const PerfAnalysis=memo(({sessions,exams,mistakes})=>{
    const chartRef=useRef(null);const chartInst=useRef(null);
    const subStats=useMemo(()=>SUBS.map(s=>({...s,
        totalQ:sessions.filter(x=>x.subject===s.id).reduce((a,x)=>a+qInt(x),0),
        totalMins:sessions.filter(x=>x.subject===s.id).reduce((a,x)=>a+dInt(x),0),
        mistakes:mistakes.filter(x=>x.subject===s.id).length,
        sessions:sessions.filter(x=>x.subject===s.id).length
    })),[sessions,mistakes]);
    const totalQ=useMemo(()=>sessions.reduce((a,s)=>a+qInt(s),0),[sessions]);
    const totalMins=useMemo(()=>sessions.reduce((a,s)=>a+dInt(s),0),[sessions]);
    const studyDays=useMemo(()=>new Set(sessions.map(s=>s.date)).size,[sessions]);
    useEffect(()=>{
        if(!chartRef.current)return;
        if(chartInst.current){chartInst.current.destroy();chartInst.current=null}
        const active=subStats.filter(s=>s.totalQ>0);if(!active.length)return;
        chartInst.current=new Chart(chartRef.current,{type:'doughnut',
            data:{labels:active.map(s=>s.name),datasets:[{data:active.map(s=>s.totalQ),backgroundColor:active.map(s=>s.color+'cc'),borderColor:active.map(s=>s.color),borderWidth:2}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#9ca3af',font:{size:10},boxWidth:10}}}}
        });
        return()=>{if(chartInst.current){chartInst.current.destroy();chartInst.current=null}};
    },[subStats]);
    return<div className="space-y-4">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
            {[{v:totalQ.toLocaleString(),l:'Toplam Soru',c:'#6c63ff',i:'📝'},{v:`${Math.round(totalMins/60)}s`,l:'Toplam Süre',c:'#00c853',i:'⏱️'},
                {v:studyDays>0?Math.round(totalQ/studyDays):0,l:'Günlük Ort.',c:'#ffd600',i:'📊'},{v:studyDays,l:'Çalışma Günü',c:'#ff9800',i:'📅'}
            ].map((x,i)=><Card key={i}><div style={{fontSize:'20px',marginBottom:'4px'}}>{x.i}</div><div style={{fontSize:'20px',fontWeight:'bold',color:x.c}}>{x.v}</div><div style={{fontSize:'11px',color:'#6b7280'}}>{x.l}</div></Card>)}
        </div>
        {subStats.some(s=>s.totalQ>0)&&<Card title="🥧 Dağılım"><div style={{height:'180px'}}><canvas ref={chartRef}/></div></Card>}
        <Card title="📋 Ders İstatistikleri">
            <div className="space-y-2">
                {subStats.filter(s=>s.sessions>0).sort((a,b)=>b.totalQ-a.totalQ).map(s=>(
                    <div key={s.id} style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'10px'}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'6px'}}>
                            <span style={{fontSize:'13px',fontWeight:'600',color:s.color}}>{s.icon} {s.name}</span>
                            <div style={{display:'flex',gap:'10px'}}>
                                <span style={{fontSize:'11px',color:'#9ca3af'}}>📝{s.totalQ}</span>
                                <span style={{fontSize:'11px',color:'#9ca3af'}}>⏱{Math.round(s.totalMins/60)}s</span>
                                <span style={{fontSize:'11px',color:'#ff5252'}}>❌{s.mistakes}</span>

});

    const[xp,setXp]=useState(S.g('xp',0));
    const[earnedBadges,setEarnedBadges]=useState(S.g('earnedBadges',[]));
    const[flashcards,setFlashcards]=useState(()=>{const saved=S.g('flashcards',[]);return saved.map(c=>({...SM2.init(),...c}))});

    const[sF,setSF]=useState({subject:'matematik',topic:'',qc:'',dur:'',correct:'',wrong:''});
    const[eF,setEF]=useState({type:'TYT',tD:'',tY:'',mD:'',mY:'',fD:'',fY:'',sD:'',sY:''});
    const[mF,setMF]=useState({subject:'matematik',topic:'',desc:'',logic:'',type:'bilgi'});
    const[tI,setTI]=useState({text:'',subject:'matematik',priority:'medium'});
    const[gEdit,setGEdit]=useState({...S.g('goals',{turkce:35,matematik:36,fizik:13,kimya:12,biyoloji:11,tarih:8,cografya:4,felsefe:4,din:4})});

    const today=useMemo(()=>td(),[]);

    useEffect(()=>{S.s('sessions',sessions)},[sessions]);
    useEffect(()=>{S.s('exams',exams)},[exams]);
    useEffect(()=>{S.s('mistakes',mistakes)},[mistakes]);
    useEffect(()=>{S.s('topics',topics)},[topics]);
    useEffect(()=>{S.s('dailyLogs',dailyLogs)},[dailyLogs]);
    useEffect(()=>{S.s('goals',goals)},[goals]);
    useEffect(()=>{S.s('tasks',tasks)},[tasks]);
    useEffect(()=>{S.s('xp',xp)},[xp]);
    useEffect(()=>{S.s('earnedBadges',earnedBadges)},[earnedBadges]);
    useEffect(()=>{S.s('flashcards',flashcards)},[flashcards]);

    // Auto tasks
    useEffect(()=>{
        if(!tasks.some(x=>x.date===today)){
            const base=[
                {id:Date.now()+0,date:today,text:'Matematik – 20 soru',subject:'matematik',completed:false,xp:10,priority:'high'},
                {id:Date.now()+1,date:today,text:'Türkçe – 10 paragraf',subject:'turkce',completed:false,xp:10,priority:'high'},
                {id:Date.now()+2,date:today,text:'Fizik – 15 soru',subject:'fizik',completed:false,xp:10,priority:'medium'},
                {id:Date.now()+3,date:today,text:'Kara Defter tekrarı',subject:'genel',completed:false,xp:15,priority:'low'}
            ];
            setTasks(p=>[...p,...base]);
        }
    },[]);// eslint-disable-line

    const streak=useMemo(()=>{
        let s=0;const now=new Date();
        for(let i=0;i<365;i++){const d=new Date(now.getTime()-i*864e5);const ds=d.toISOString().split('T')[0];if(sessions.some(x=>x.date===ds))s++;else if(ds!==today)break;}
        return s;
    },[sessions,today]);

    // Badge check
    useEffect(()=>{
        BADGES.forEach(b=>{

                        <p style={{fontSize:'14px',color:'#00c853'}}>✅ {cur.logic||cur.correctLogic||'—'}</p>
                    </div>}
                    <div style={{display:'flex',justifyContent:'center',gap:'8px'}}>
                        {!sa&&<Btn onClick={()=>setSa(true)}>💡 Cevap</Btn>}
                        <Btn onClick={startRev} v="ghost">→ Sonraki</Btn>
                        <Btn onClick={()=>setRv(false)} v="danger" s="sm">× Kapat</Btn>
                    </div>
                </>)})()}
            </div>}
            <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                <button onClick={()=>setFil('all')} style={{padding:'4px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:fil==='all'?'#6c63ff':'#1a1a2e',color:fil==='all'?'#fff':'#9ca3af'}}>Tümü({mistakes.length})</button>
                {SUBS.map(s=>{const c=mistakes.filter(m=>m.subject===s.id).length;if(!c)return null;return<button key={s.id} onClick={()=>setFil(s.id)} style={{padding:'4px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:fil===s.id?s.color:'#1a1a2e',color:fil===s.id?'#fff':'#9ca3af'}}>{s.name}({c})</button>})}
            </div>
            <div className="space-y-2">
                {filtered.length===0?<Card><p style={{color:'#6b7280',textAlign:'center',padding:'20px 0'}}>Hata yok!</p></Card>:
                [...filtered].sort((a,b)=>b.id-a.id).map(m=>{const sub=SUBS.find(s=>s.id===m.subject);const mt=MTYPES.find(t=>t.id===m.type);return(
                    <Card key={m.id}>
                        <div style={{display:'flex',justifyContent:'space-between'}}>
                            <div style={{flex:1}}>
                                <div style={{display:'flex',gap:'6px',marginBottom:'6px',flexWrap:'wrap'}}>
                                    <span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:sub?.color+'22',color:sub?.color}}>{sub?.name}</span>
                                    <span style={{fontSize:'13px',fontWeight:'600',color:'#fff'}}>{m.topic}</span>
                                    {mt&&<span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:mt.color+'22',color:mt.color}}>{mt.name}</span>}
                                </div>
                                <p style={{fontSize:'12px',color:'#ff5252'}}>❌ {m.desc||m.description}</p>
                                {(m.logic||m.correctLogic)&&<p style={{fontSize:'12px',color:'#00c853',marginTop:'4px'}}>✅ {m.logic||m.correctLogic}</p>}
                            </div>
                            <button onClick={()=>setMistakes(p=>p.filter(x=>x.id!==m.id))} style={{color:'#4b5563',background:'none',border:'none',cursor:'pointer',fontSize:'18px',marginLeft:'8px'}} onMouseOver={e=>e.target.style.color='#ff5252'} onMouseOut={e=>e.target.style.color='#4b5563'}>×</button>
                        </div>
                    </Card>
                )})}
            </div>
        </div>;
    };

    // ── TOOLS PAGE ───────────────────────────────────────
    const ToolsPg=()=>{
        const tools=[{id:'flashcard',l:'🃏 Flashcard'},{id:'quiz',l:'🧠 Quiz'},{id:'formula',l:'📐 Formüller'},{id:'planner',l:'📅 Planlama'},{id:'analysis',l:'📊 Analiz'},{id:'badges',l:'🏅 Rozetler'}];
        return<div className="space-y-4">
            <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                {tools.map(t=><button key={t.id} onClick={()=>setToolTab(t.id)} style={{padding:'6px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:toolTab===t.id?'#6c63ff':'#1a1a2e',color:toolTab===t.id?'#fff':'#9ca3af'}}>{t.l}</button>)}
            </div>
            {toolTab==='flashcard'&&<Flashcards notify={notify} addXp={addXp}/>}
            {toolTab==='quiz'&&<QuizMode notify={notify} addXp={addXp}/>}
            {toolTab==='formula'&&<FormulaBook/>}
            {toolTab==='planner'&&<WeeklyPlanner notify={notify}/>}
            {toolTab==='analysis'&&<PerfAnalysis sessions={sessions} exams={exams} mistakes={mistakes}/>}
            {toolTab==='badges'&&<BadgesPage sessions={sessions} exams={exams} mistakes={mistakes} streak={streak} xp={xp} flashcards={flashcards}/>}
        </div>;
    };

    // ── REFLECTION PAGE ──────────────────────────────────
    const RefPg=()=>{
        const[dF,setDF]=useState({learned:'',hard:'',tomorrow:''});
        const saveDay=()=>{if(!dF.learned.trim()){notify('⚠️ "Ne öğrendim" gerekli!');return}setDailyLogs(p=>[...p,{...dF,id:Date.now(),date:today}]);setDF({learned:'',hard:'',tomorrow:''});addXp(10);notify('🌙 +10 XP')};
        return<div className="space-y-4">
            <h1 style={{fontSize:'20px',fontWeight:'bold',color:'#fff'}}>💭 Günlük</h1>
            <Card title="🌙 Günlük Değerlendirme">
                <div className="space-y-3">
                    <Txt label="Bugün ne öğrendim?" value={dF.learned} onChange={v=>setDF(p=>({...p,learned:v}))} placeholder="Öğrendiklerim..." rows={2}/>
                    <Inp label="En zorlandığım" value={dF.hard} onChange={v=>setDF(p=>({...p,hard:v}))} placeholder="Konu..."/>
                    <Txt label="Yarın planım" value={dF.tomorrow} onChange={v=>setDF(p=>({...p,tomorrow:v}))} placeholder="Plan..." rows={2}/>
                    <Btn onClick={saveDay} className="w-full" style={{justifyContent:'center'}}>💾 Kaydet (+10 XP)</Btn>
                </div>
            </Card>
            {dailyLogs.length>0&&<Card title="📋 Son Günlükler">
                <div style={{maxHeight:'280px',overflowY:'auto'}} className="space-y-2">
                    {[...dailyLogs].sort((a,b)=>b.id-a.id).slice(0,10).map(l=><div key={l.id} style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'12px'}}>
                        <div style={{fontSize:'11px',color:'#6b7280',marginBottom:'6px'}}>📅 {fdf(l.date)}</div>
                        <p style={{fontSize:'13px',color:'#fff'}}>✅ {l.learned}</p>
                        {l.hard&&<p style={{fontSize:'13px',color:'#ff5252',marginTop:'4px'}}>⚠️ {l.hard}</p>}
                        {l.tomorrow&&<p style={{fontSize:'13px',color:'#6c63ff',marginTop:'4px'}}>→ {l.tomorrow}</p>}
                    </div>)}
                </div>
            </Card>}
        </div>;
    };

    // ── GOALS PAGE ───────────────────────────────────────
    const GoalPg=()=>(
        <div className="space-y-4">
            <h1 style={{fontSize:'20px',fontWeight:'bold',color:'#fff'}}>🎯 Hedefler</h1>
            <Card title="⏰ YKS Geri Sayım">
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px',textAlign:'center'}}>
                    {[{v:yksGun(),l:'Gün',c:'#6c63ff'},{v:Math.ceil(yksGun()/7),l:'Hafta',c:'#ffd600'},{v:Math.round(yksGun()/30),l:'Ay',c:'#00c853'}].map((x,i)=>(
                        <div key={i} style={{backgroundColor:'#1a1a2e',borderRadius:'12px',padding:'14px'}}><div style={{fontSize:'26px',fontWeight:'bold',color:x.c}}>{x.v}</div><div style={{fontSize:'12px',color:'#6b7280'}}>{x.l}</div></div>
                    ))}
                </div>
            </Card>
            <Card title="📊 Net Hedefleri">
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'12px'}}>
                    {SUBS.map(s=><Inp key={s.id} label={s.name} type="number" value={gEdit[s.id]||''} onChange={v=>setGEdit(p=>({...p,[s.id]:parseInt(v)||0}))} min="0" max={s.max}/>)}
                </div>
                <Btn onClick={()=>{setGoals(gEdit);notify('✅ Kaydedildi!')}} className="w-full" style={{justifyContent:'center'}}>💾 Kaydet</Btn>
            </Card>
            <Card title={`${lvl.i} ${lvl.n}`}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'#6b7280',marginBottom:'6px'}}><span>{xp} XP</span><span>{nLvl.min} XP</span></div>
                <PBar value={xp-lvl.min} max={Math.max(nLvl.min-lvl.min,1)} color="#6c63ff" label={false} size="xl"/>
                <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px',marginTop:'14px'}}>
                    {LEVELS.map((l,i)=><div key={i} style={{borderRadius:'10px',padding:'8px',textAlign:'center',border:`1px solid ${xp>=l.min?'#6c63ff':'#2a2a3e'}`,backgroundColor:xp>=l.min?'rgba(108,99,255,.1)':'transparent',opacity:xp>=l.min?1:.35}}>
                        <div style={{fontSize:'14px'}}>{l.i}</div>
                        <div style={{fontSize:'9px',color:'#9ca3af',marginTop:'2px'}}>{l.n}</div>
                    </div>)}
                </div>
            </Card>
            <Card title="💾 Yedekleme">
                <div style={{display:'flex',gap:'8px'}}>
                    <Btn onClick={()=>{
                        const d={version:'3.0',date:new Date().toISOString(),sessions,exams,mistakes,topics,xp,tasks,goals,dailyLogs,flashcards};
                        const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
                        const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`yks-backup-${td()}.json`;a.click();URL.revokeObjectURL(u);
                        notify('✅ Yedek indirildi!');
                    }} v="success" s="sm">⬇️ Export</Btn>
                    <label><Btn v="ghost" s="sm" onClick={()=>document.getElementById('imp-f').click()}>⬆️ Import</Btn>
                        <input id="imp-f" type="file" accept=".json" style={{display:'none'}} onChange={e=>{
                            const f=e.target.files[0];if(!f)return;const r=new FileReader();
                            r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.version)throw new Error();
                                if(d.sessions)setSessions(d.sessions);if(d.exams)setExams(d.exams);if(d.mistakes)setMistakes(d.mistakes);
                                if(d.topics)setTopics(d.topics);if(d.xp)setXp(d.xp);if(d.flashcards)setFlashcards(d.flashcards.map(c=>({...SM2.init(),...c})));
                                notify('✅ Veri yüklendi!');
                            }catch{notify('❌ Geçersiz dosya!')}};r.readAsText(f);e.target.value='';
                        }}/>
                    </label>
                </div>
            </Card>
        </div>
    );

    // ── NAV ──────────────────────────────────────────────
    const nav=[
        {id:'dashboard',i:'📊',l:'Panel'},
        {id:'brainlab', i:'🧠',l:'Beyin Lab'},
        {id:'study',    i:'📚',l:'Çalış'},
        {id:'exams',    i:'📝',l:'Deneme'},
        {id:'mistakes', i:'📕',l:'Defter'},
        {id:'topics',   i:'✅',l:'Konu'},
        {id:'tools',    i:'🛠️',l:'Araçlar'},
        {id:'reflection',i:'💭',l:'Günlük'},
        {id:'goals',    i:'🎯',l:'Hedef'}
    ];

    const pages={
        dashboard:DashPg,
        brainlab:()=><BrainLab flashcards={flashcards} sessions={sessions} exams={exams} mistakes={mistakes} notify={notify} addXp={addXp}/>,
        study:StudyPg,exams:ExamPg,mistakes:MistPg,
        topics:()=><TopPg topics={topics} setTopics={setTopics} addXp={addXp} notify={notify}/>,
        tools:ToolsPg,reflection:RefPg,goals:GoalPg
    };
    const Pg=pages[pg]||DashPg;

    return<div style={{minHeight:'100vh',backgroundColor:'#0a0a0f',color:'#e5e7eb'}}>
        <Banner msg={banner.msg} show={banner.show} onClose={()=>setBanner(b=>({...b,show:false}))} type={banner.type}/>

        {/* Desktop Sidebar */}
        <div className="hidden md:flex" style={{position:'fixed',left:0,top:0,bottom:0,width:'192px',backgroundColor:'#12121a',borderRight:'1px solid #2a2a3e',flexDirection:'column',zIndex:40}}>
            <div style={{padding:'16px',borderBottom:'1px solid #2a2a3e'}}>
                <div style={{fontSize:'18px',fontWeight:'bold',color:'#6c63ff'}}>⚡ YKS Pro</div>
                <div style={{fontSize:'11px',color:'#4b5563',marginTop:'2px'}}>Mehmet Zeki</div>
            </div>
            <div style={{flex:1,paddingTop:'8px',overflowY:'auto'}}>
                {nav.map(n=>{const isDue=n.id==='brainlab'&&dueFC>0;return(
                    <button key={n.id} onClick={()=>navTo(n.id)}
                        style={{width:'100%',display:'flex',alignItems:'center',gap:'12px',padding:'10px 16px',textAlign:'left',border:'none',cursor:'pointer',backgroundColor:pg===n.id?'rgba(108,99,255,.15)':'transparent',color:pg===n.id?'#6c63ff':'#9ca3af',borderRight:pg===n.id?'2px solid #6c63ff':'2px solid transparent',fontWeight:pg===n.id?'600':'400',fontSize:'14px',position:'relative'}}
                        onMouseOver={e=>{if(pg!==n.id){e.currentTarget.style.backgroundColor='rgba(255,255,255,.04)';e.currentTarget.style.color='#e5e7eb'}}}
                        onMouseOut={e=>{if(pg!==n.id){e.currentTarget.style.backgroundColor='transparent';e.currentTarget.style.color='#9ca3af'}}}>
                        <span style={{fontSize:'16px'}}>{n.i}</span>
                        <span>{n.l}</span>
                        {isDue&&<span style={{marginLeft:'auto',width:'8px',height:'8px',borderRadius:'50%',backgroundColor:'#ffd600',display:'block'}}/>}
                    </button>
                )})}
            </div>
            <div style={{padding:'16px',borderTop:'1px solid #2a2a3e'}}>
                <div style={{fontSize:'11px',color:'#6b7280'}}>{lvl.i} {lvl.n}</div>
                <div style={{fontSize:'14px',fontWeight:'bold',color:'#6c63ff'}}>{xp.toLocaleString()} XP</div>
                <div style={{width:'100%',backgroundColor:'#0a0a0f',borderRadius:'999px',height:'3px',marginTop:'4px'}}>
                    <div style={{width:`${lvlPct}%`,height:'3px',borderRadius:'999px',backgroundColor:'#6c63ff',transition:'width 1s ease'}}/>
                </div>
                <div style={{fontSize:'12px',color:'#ffd600',marginTop:'6px'}}>🔥{streak} | 🧠%{avgRetention}</div>
            </div>
        </div>

        {/* Mobile Bottom Nav */}
        <div className="md:hidden" style={{position:'fixed',bottom:0,left:0,right:0,backgroundColor:'#12121a',borderTop:'1px solid #2a2a3e',display:'flex',zIndex:50}}>
            {nav.map(n=>{const isDue=n.id==='brainlab'&&dueFC>0;return(
                <button key={n.id} onClick={()=>navTo(n.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'8px 0',border:'none',cursor:'pointer',backgroundColor:'transparent',color:pg===n.id?'#6c63ff':'#4b5563',position:'relative'}}>
                    <span style={{fontSize:'14px'}}>{n.i}</span>
                    <span style={{fontSize:'8px',marginTop:'2px',fontWeight:'500'}}>{n.l}</span>
                    {isDue&&<span style={{position:'absolute',top:'4px',right:'calc(50% - 10px)',width:'6px',height:'6px',borderRadius:'50%',backgroundColor:'#ffd600'}}/>}
                </button>
            )})}
        </div>

        <main className="md:ml-48" style={{padding:'16px',paddingBottom:'80px',backgroundColor:'#0a0a0f',minHeight:'100vh'}}>
            <div style={{maxWidth:'800px'}}><Pg/></div>
        </main>

        {/* MODALS */}
        <Modal isOpen={modal.open&&modal.type==='session'} onClose={closeMd} title="📚 Oturum Ekle">
            <div className="space-y-3">
                <Sel label="Ders" value={sF.subject} onChange={v=>setSF(p=>({...p,subject:v}))} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
                <Inp label="Konu" value={sF.topic} onChange={v=>setSF(p=>({...p,topic:v}))} placeholder="Konu..."/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                    <Inp label="Süre (dk)" type="number" value={sF.dur} onChange={v=>setSF(p=>({...p,dur:v}))} min="1"/>
                    <Inp label="Soru Sayısı" type="number" value={sF.qc} onChange={v=>setSF(p=>({...p,qc:v}))} min="0"/>
                </div>
                <Btn onClick={addSession} className="w-full" style={{justifyContent:'center'}}>💾 Kaydet</Btn>
            </div>
        </Modal>

        <Modal isOpen={modal.open&&modal.type==='exam'} onClose={closeMd} title="📝 Deneme Ekle">
            <div className="space-y-3">
                <Sel label="Tür" value={eF.type} onChange={v=>setEF(p=>({...p,type:v}))} options={[{value:'TYT',label:'TYT'},{value:'AYT',label:'AYT'},{value:'Deneme',label:'Genel'}]}/>
                {[{l:'Türkçe',d:'tD',y:'tY'},{l:'Matematik',d:'mD',y:'mY'},{l:'Fen',d:'fD',y:'fY'},{l:'Sosyal',d:'sD',y:'sY'}].map(x=>(
                    <div key={x.l} style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center'}}>
                        <span style={{fontSize:'13px',color:'#e5e7eb',minWidth:'56px'}}>{x.l}</span>
                        <Inp type="number" value={eF[x.d]} onChange={v=>setEF(p=>({...p,[x.d]:v}))} placeholder="D"/>
                        <Inp type="number" value={eF[x.y]} onChange={v=>setEF(p=>({...p,[x.y]:v}))} placeholder="Y"/>
                    </div>
                ))}
                <div style={{backgroundColor:'#1a1a2e',borderRadius:'10px',padding:'10px',textAlign:'center',fontWeight:'bold',color:'#6c63ff',fontSize:'18px'}}>
                    Toplam: {netPrev.tot.toFixed(1)}
                </div>
                <Btn onClick={addExam} className="w-full" style={{justifyContent:'center'}}>💾 Kaydet (+25 XP)</Btn>
            </div>
        </Modal>

        <Modal isOpen={modal.open&&modal.type==='mistake'} onClose={closeMd} title="📕 Hata Ekle">
            <div className="space-y-3">
                <Sel label="Ders" value={mF.subject} onChange={v=>setMF(p=>({...p,subject:v}))} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
                <Inp label="Konu" value={mF.topic} onChange={v=>setMF(p=>({...p,topic:v}))} placeholder="Konu..."/>
                <Sel label="Hata Türü" value={mF.type} onChange={v=>setMF(p=>({...p,type:v}))} options={MTYPES.map(t=>({value:t.id,label:t.name}))}/>
                <Txt label="Hata" value={mF.desc} onChange={v=>setMF(p=>({...p,desc:v}))} placeholder="Ne hata yaptım?"/>
                <Txt label="Doğrusu" value={mF.logic} onChange={v=>setMF(p=>({...p,logic:v}))} placeholder="Doğru yöntem..." rows={2}/>
                <Btn onClick={addMistake} className="w-full" style={{justifyContent:'center'}}>💾 Kaydet (+5 XP)</Btn>
            </div>
        </Modal>

        <Modal isOpen={modal.open&&modal.type==='task'} onClose={closeMd} title="✅ Görev Ekle">
            <div className="space-y-3">
                <Inp label="Görev" value={tI.text} onChange={v=>setTI(p=>({...p,text:v}))} placeholder="Matematik – 20 soru"/>
                <Sel label="Ders" value={tI.subject} onChange={v=>setTI(p=>({...p,subject:v}))} options={[{value:'genel',label:'Genel'},...SUBS.map(s=>({value:s.id,label:s.name}))]}/>
                <Sel label="Öncelik" value={tI.priority} onChange={v=>setTI(p=>({...p,priority:v}))} options={[{value:'high',label:'🔴 Yüksek'},{value:'medium',label:'🟡 Orta'},{value:'low',label:'🟢 Düşük'}]}/>
                <Btn onClick={()=>{if(!tI.text.trim()){notify('⚠️ Görev adı!');return}setTasks(p=>[...p,{id:Date.now(),date:today,text:tI.text,subject:tI.subject,completed:false,xp:10,priority:tI.priority}]);setTI({text:'',subject:'matematik',priority:'medium'});closeMd();notify('✅ Eklendi!')}} className="w-full" style={{justifyContent:'center'}}>➕ Ekle</Btn>
            </div>
        </Modal>

        <Toast msg={toast.msg} show={toast.show}/>
    </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
