        tailwind.config={
            darkMode:'class',
            theme:{
                extend:{
                    colors:{
                        dark:{900:'#0a0a0f',800:'#12121a',700:'#1a1a2e',600:'#2a2a3e'},
                        accent:{DEFAULT:'#6c63ff',dim:'#4a42d4'},
                        success:'#00c853',
                        warning:'#ffd600',
                        danger:'#ff5252'
                    }
                }
            }
        }

        function generateIcons(){
            [192,512].forEach(size=>{
                const c=document.createElement('canvas');
                c.width=size;c.height=size;
                const ctx=c.getContext('2d');
                ctx.fillStyle='#6c63ff';
                const r=size*0.18;
                ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(size-r,0);
                ctx.quadraticCurveTo(size,0,size,r);ctx.lineTo(size,size-r);
                ctx.quadraticCurveTo(size,size,size-r,size);ctx.lineTo(r,size);
                ctx.quadraticCurveTo(0,size,0,size-r);ctx.lineTo(0,r);
                ctx.quadraticCurveTo(0,0,r,0);ctx.fill();
                ctx.fillStyle='#fff';
                ctx.font=`bold ${size*0.45}px Arial`;
                ctx.textAlign='center';ctx.textBaseline='middle';
                ctx.fillText('⚡',size/2,size*0.38);
                ctx.font=`bold ${size*0.18}px Arial`;
                ctx.fillText('YKS',size/2,size*0.72);
                window['icon'+size]=c.toDataURL('image/png');
                if(size===192){
                    let l=document.querySelector('link[rel="icon"]');
                    if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}
                    l.href=window.icon192;
                    let a=document.querySelector('link[rel="apple-touch-icon"]');
                    if(!a){a=document.createElement('link');a.rel='apple-touch-icon';document.head.appendChild(a)}
                    a.href=window.icon192;
                }
            });
            const manifest={
                name:"YKS Merkezi Pro",short_name:"YKS Pro",
                start_url:".",display:"standalone",
                background_color:"#0a0a0f",theme_color:"#6c63ff",
                orientation:"portrait",
                icons:[
                    {src:window.icon192,sizes:"192x192",type:"image/png",purpose:"any maskable"},
                    {src:window.icon512,sizes:"512x512",type:"image/png",purpose:"any maskable"}
                ]
            };
            const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
            const ml=document.createElement('link');ml.rel='manifest';
            ml.href=URL.createObjectURL(blob);document.head.appendChild(ml);
        }
        window.addEventListener('load',generateIcons);

        function registerInlineSW(){
            if(!('serviceWorker' in navigator))return;
            const swCode=`
const CACHE='yks-pro-v2';
self.addEventListener('install',e=>{self.skipWaiting()});
self.addEventListener('activate',e=>{
    e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
    self.clients.claim();
});
self.addEventListener('fetch',e=>{
    e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
});
self.addEventListener('notificationclick',e=>{
    e.notification.close();
    e.waitUntil(clients.matchAll({type:'window'}).then(cs=>{
        if(cs.length)return cs[0].focus();
        return clients.openWindow('/');
    }));
});`;
            const blob=new Blob([swCode],{type:'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob))
                .then(r=>{window._swReg=r;})
                .catch(()=>{});
        }
        window.addEventListener('load',registerInlineSW);
    </script>

        *{color-scheme:dark}

        .fade-in{animation:fadeIn .3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        .streak-flame{animation:flm 1.5s ease-in-out infinite}

        .heatmap-cell{transition:all .2s}

        .glow{box-shadow:0 0 20px rgba(108,99,255,.3)}
        .glow-green{box-shadow:0 0 20px rgba(0,200,83,.2)}

        .progress-ring{transition:stroke-dashoffset .8s ease}

        .warning-pulse{animation:wp 2s ease-in-out infinite}
        @keyframes wp{0%,100%{opacity:1}50%{opacity:.6}}

        .slide-up{animation:su .35s ease}
        @keyframes su{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

        .slide-down{animation:sd .35s ease}
        @keyframes sd{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

        .spin{animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .badge-shine{animation:shine 2s ease infinite}
        @keyframes shine{0%,100%{opacity:1}50%{opacity:.7}}

        .card-hover{transition:all .2s}
        .card-hover:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(0,0,0,.4)}

        .flip-card{perspective:1000px}
        .flip-inner{transition:transform .6s;transform-style:preserve-3d}
        .flip-card.flipped .flip-inner{transform:rotateY(180deg)}
        .flip-front,.flip-back{
            backface-visibility:hidden;
            -webkit-backface-visibility:hidden;
            position:absolute;inset:0;
        }
        .flip-back{transform:rotateY(180deg)}

        /* Override any white backgrounds */
        input,select,textarea,button{
            background-color:#0a0a0f;
            color:#e5e7eb;
        }
        input::placeholder,textarea::placeholder{color:#4b5563}

        /* Chart.js canvas bg */
        canvas{background:transparent!important}

        input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
        input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

async function reqNotif(){
    if(!('Notification' in window))return false;
    if(Notification.permission==='granted')return true;
    if(Notification.permission==='denied')return false;
    return(await Notification.requestPermission())==='granted';
}
function sendNotif(title,body){
    if(Notification.permission!=='granted')return;
    const opts={body,icon:window.icon192||'',vibrate:[200,100,200],tag:'yks-'+Date.now(),renotify:true};
    if(window._swReg){
        window._swReg.showNotification(title,opts).catch(()=>{try{new Notification(title,opts)}catch(e){}});
    }else{try{new Notification(title,opts)}catch(e){}}
}
function checkNotifs(sessions){
    const now=new Date(),h=now.getHours(),m=now.getMinutes();
    const today=td();
    const tQ=sessions.filter(s=>s.date===today).reduce((a,s)=>a+qInt(s),0);
    const key=`${today}-${h}`;
    if(localStorage.getItem('ykspro_nk')===key)return;
    if(h===8 &&m<10){sendNotif('☀️ Günaydın!',`YKS'ye ${yksGun()} gün! 120 soru çöz 💪`);localStorage.setItem('ykspro_nk',key)}
    else if(h===12&&m<10){sendNotif('🕐 Öğle',tQ<30?`Henüz ${tQ} soru. Hızlan!`:`${tQ} soru, devam!`);localStorage.setItem('ykspro_nk',key)}
    else if(h===16&&m<20){sendNotif('📚 Çalışma Zamanı',`${tQ}/120 soru`);localStorage.setItem('ykspro_nk',key)}
    else if(h===19&&m<10){sendNotif(tQ<80?'⚠️ Geride!':'🔥 İyi!',`${tQ} soru`);localStorage.setItem('ykspro_nk',key)}
    else if(h===23&&m<10){sendNotif('🌙 İyi Geceler',tQ>0?`${tQ} soru çözdün!`:'Streak tehlikede!');localStorage.setItem('ykspro_nk',key)}
}

const PBar=memo(({value,max,color='#6c63ff',label=true,size='md',showPct=false})=>{
    const p=max>0?Math.min((value/max)*100,100):0;
    const h={sm:'4px',md:'6px',lg:'10px',xl:'14px'}[size];
    return(
        <div>
            {label&&(
                <div className="flex justify-between text-xs mb-1" style={{color:'#6b7280'}}>
                    <span>{value}</span>
                    <span>{showPct?`${Math.round(p)}%`:max}</span>
                </div>
            )}
            <div style={{backgroundColor:'#0a0a0f',borderRadius:'999px',height:h,overflow:'hidden'}}>
                <div style={{width:`${p}%`,height:'100%',backgroundColor:color,borderRadius:'999px',transition:'width .7s ease'}}/>
            </div>
        </div>
    );
});

const CircleProgress=memo(({value,max,color,size=120,label,sublabel})=>{
    const pct=max>0?Math.min((value/max)*100,100):0;
    const r=(size-12)/2;
    const circ=2*Math.PI*r;
    const off=circ-(pct/100)*circ;
    const ctr=size/2;
    return(
        <div style={{textAlign:'center'}}>
            <svg width={size} height={size} style={{display:'block',margin:'0 auto'}}>
                <circle cx={ctr} cy={ctr} r={r} fill="none" stroke="#1a1a2e" strokeWidth="8"/>
                <circle
                    cx={ctr} cy={ctr} r={r} fill="none"
                    stroke={color} strokeWidth="8"
                    strokeDasharray={circ} strokeDashoffset={off}
                    strokeLinecap="round"
                    className="progress-ring"
                    transform={`rotate(-90 ${ctr} ${ctr})`}
                    style={{filter:`drop-shadow(0 0 6px ${color}88)`}}
                />
                <text x={ctr} y={ctr-5} textAnchor="middle" fill="#fff" fontSize={size>100?16:13} fontWeight="bold">{value}</text>
                <text x={ctr} y={ctr+13} textAnchor="middle" fill="#6b7280" fontSize="10">/{max}</text>
            </svg>
            {label&&<div className="text-sm font-semibold mt-1" style={{color:'#fff'}}>{label}</div>}
            {sublabel&&<div className="text-xs mt-0.5" style={{color:'#6b7280'}}>{sublabel}</div>}
        </div>
    );
});

const Heatmap=memo(({sessions})=>{
    const cells=[];

    for(let i=90;i>=0;i--){
        const d=new Date(now);d.setDate(d.getDate()-i);
        const ds=d.toISOString().split('T')[0];
        const mins=sessions.filter(s=>s.date===ds).reduce((a,s)=>a+dInt(s),0);
        const l=mins>=180?4:mins>=120?3:mins>=60?2:mins>0?1:0;
        const colors=['#1a1a2e','#1e3a2e','#2d5c40','#3d8050','#4dab62'];
        cells.push(
            <div
                key={ds}
                className="heatmap-cell rounded-sm"
                style={{width:'10px',height:'10px',backgroundColor:colors[l],cursor:'help'}}

    return <div style={{display:'flex',flexWrap:'wrap',gap:'2px'}}>{cells}</div>;

const OfflineBar=()=>{
    const[online,setOnline]=useState(navigator.onLine);
    useEffect(()=>{
        const on=()=>setOnline(true);const off=()=>setOnline(false);
        window.addEventListener('online',on);window.addEventListener('offline',off);
        return()=>{window.removeEventListener('online',on);window.removeEventListener('offline',off)};
    },[]);
    if(online)return null;
    return(
        <div className="fixed top-0 left-0 right-0 z-[80] text-center text-xs py-1.5 font-bold" style={{backgroundColor:'#ffd600',color:'#12121a'}}>
            📵 Çevrimdışı – Veriler yerel kaydediliyor
        </div>
    );
};

const Pomodoro=memo(({onComplete})=>{
    const[mode,setMode]=useState('focus');
    const[tl,setTl]=useState(25*60);
    const[run,setRun]=useState(false);
    const[done,setDone]=useState(0);
    const ref=useRef(null);

    useEffect(()=>{
        if(run&&tl>0){ref.current=setInterval(()=>setTl(t=>t-1),1000)}
        else if(tl===0){
            clearInterval(ref.current);
            if(mode==='focus'){
                setDone(d=>d+1);onComplete&&onComplete(25);
                setMode('break');setTl(5*60);
                sendNotif('☕ Mola!','25dk tamamlandı!');
            }else{
                setMode('focus');setTl(25*60);
                sendNotif('🎯 Odaklan!','Mola bitti!');
            }
            setRun(false);
        }
        return()=>clearInterval(ref.current);
    },[run,tl,mode]);

    const totals={focus:25*60,break:5*60,long:15*60};
    const tot=totals[mode]||25*60;
    const fmt=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

    return(
        <div style={{textAlign:'center'}}>
            <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'12px'}}>
                {[['focus','🎯 Odak',25*60],['break','☕ Kısa',5*60],['long','🛋️ Uzun',15*60]].map(([m,l,t])=>(
                    <button key={m}
                        onClick={()=>{setMode(m);setTl(t);setRun(false)}}
                        style={{
                            padding:'4px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:'600',cursor:'pointer',border:'none',
                            backgroundColor:mode===m?'#6c63ff':'#1a1a2e',color:mode===m?'#fff':'#9ca3af',transition:'all .2s'
                        }}
                    >{l}</button>
                ))}
            </div>
            <CircleProgress
                value={Math.ceil(tl/60)} max={Math.ceil(tot/60)}
                color={mode==='focus'?'#6c63ff':'#00c853'} size={140}
                label={fmt(tl)} sublabel={`${done} 🍅 tamamlandı`}
            />
            <div style={{display:'flex',justifyContent:'center',gap:'8px',marginTop:'16px'}}>
                <Btn onClick={()=>setRun(!run)} v={run?'danger':'primary'} s="lg">{run?'⏸ Durdur':'▶ Başlat'}</Btn>
                <Btn onClick={()=>{setTl(tot);setRun(false)}} v="ghost">🔄</Btn>
            </div>
        </div>
    );
});

const LiveTimer=memo(({onSave,notify})=>{
    const[run,setRun]=useState(false);
    const[elapsed,setElapsed]=useState(0);
    const[sub,setSub]=useState('matematik');
    const[topic,setTopic]=useState('');
    const startRef=useRef(null);
    const intRef=useRef(null);

    const start=()=>{
        startRef.current=Date.now()-elapsed*1000;
        intRef.current=setInterval(()=>setElapsed(Math.floor((Date.now()-startRef.current)/1000)),1000);
        setRun(true);
    };
    const stop=()=>{clearInterval(intRef.current);setRun(false)};
    const reset=()=>{stop();setElapsed(0)};
    const save=()=>{
        const mins=Math.floor(elapsed/60);
        if(mins<1){notify('⚠️ En az 1 dakika!');return}
        if(!topic.trim()){notify('⚠️ Konu adı gir!');return}
        onSave({subject:sub,topic,dur:mins.toString(),qc:'0'});
        reset();setTopic('');
    };
    useEffect(()=>()=>clearInterval(intRef.current),[]);

    const h=Math.floor(elapsed/3600);
    const m=Math.floor((elapsed%3600)/60);
    const sec=elapsed%60;
    const fmt=h>0
        ?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
        :`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

    return(
        <div>
            <div style={{textAlign:'center',margin:'16px 0'}}>
                <div style={{fontFamily:'monospace',fontSize:'48px',fontWeight:'bold',color:run?'#6c63ff':'#e5e7eb',transition:'color .3s'}}>{fmt}</div>
            </div>
            <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'16px'}}>
                <Btn onClick={run?stop:start} v={run?'danger':'primary'}>{run?'⏸ Dur':'▶ Başlat'}</Btn>
                {!run&&elapsed>0&&<Btn onClick={save} v="success">💾 Kaydet ({Math.floor(elapsed/60)}dk)</Btn>}
                {elapsed>0&&<Btn onClick={reset} v="ghost">🔄</Btn>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                <Sel label="Ders" value={sub} onChange={setSub} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
                <Inp label="Konu" value={topic} onChange={setTopic} placeholder="Konu adı..."/>
            </div>
        </div>
    );
});

const Flashcards=memo(({notify,addXp})=>{
    const[cards,setCards]=useState(S.g('flashcards',[]));
    const[mode,setMode]=useState('list');
    const[cur,setCur]=useState(0);
    const[flipped,setFlipped]=useState(false);
    const[stats,setStats]=useState({easy:0,hard:0});
    const[form,setForm]=useState({sub:'matematik',front:'',back:'',tag:''});
    const[filter,setFilter]=useState('all');

    useEffect(()=>S.s('flashcards',cards),[cards]);

    const addCard=()=>{
        if(!form.front.trim()||!form.back.trim()){notify('⚠️ Ön ve arka yüz gerekli!');return}
        setCards(p=>[...p,{id:Date.now(),sub:form.sub,front:form.front,back:form.back,tag:form.tag,level:0,lastReview:null}]);
        setForm(p=>({...p,front:'',back:'',tag:''}));
        addXp(2);notify('🃏 Kart eklendi! +2 XP');
    };

    const filtered=useMemo(()=>filter==='all'?cards:cards.filter(c=>c.sub===filter),[cards,filter]);

    const startStudy=()=>{
        if(!filtered.length){notify('⚠️ Kart yok!');return}
        setCur(0);setFlipped(false);setStats({easy:0,hard:0});setMode('study');
    };

    const next=useCallback((easy)=>{
        setCards(p=>p.map(c=>c.id===filtered[cur].id?{...c,level:easy?Math.min(c.level+1,5):0,lastReview:td()}:c));
        const newStats={easy:stats.easy+(easy?1:0),hard:stats.hard+(easy?0:1)};
        setStats(newStats);
        if(cur<filtered.length-1){setCur(c=>c+1);setFlipped(false)}
        else{setMode('result');addXp(newStats.easy+5);notify(`✅ Tur bitti! +${newStats.easy+5} XP`)}
    },[cur,filtered,stats,addXp,notify]);

    if(mode==='study'&&filtered[cur]){
        const card=filtered[cur];
        return(
            <div className="space-y-4">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontSize:'13px',color:'#9ca3af'}}>{cur+1}/{filtered.length}</span>
                    <Btn onClick={()=>setMode('list')} v="ghost" s="sm">× Çık</Btn>
                </div>
                <PBar value={cur+1} max={filtered.length} color="#6c63ff" label={false}/>
                <div
                    style={{height:'220px',cursor:'pointer',position:'relative',perspective:'1000px'}}
                    onClick={()=>setFlipped(!flipped)}
                >

const QuizMode=memo(({notify,addXp})=>{
    const[mode,setMode]=useState('menu');
    const[qs,setQs]=useState([]);
    const[cur,setCur]=useState(0);
    const[sel,setSel]=useState(null);
    const[score,setScore]=useState(0);
    const[answers,setAnswers]=useState([]);
    const[subFilter,setSubFilter]=useState('all');
    const[timeLeft,setTimeLeft]=useState(30);
    const timerRef=useRef(null);
    const scoreRef=useRef(0);

    const start=()=>{
        const src=subFilter==='all'?QUIZ_QUESTIONS:QUIZ_QUESTIONS.filter(q=>q.sub===subFilter);
        const shuffled=[...src].sort(()=>Math.random()-.5).slice(0,10);
        setQs(shuffled);setCur(0);setSel(null);setScore(0);scoreRef.current=0;setAnswers([]);setTimeLeft(30);setMode('quiz');
    };

    const handleAnswer=useCallback((idx)=>{
        clearInterval(timerRef.current);
        if(sel!==null)return;
        setSel(idx);
        const correct=idx===qs[cur].ans;
        if(correct){setScore(s=>{scoreRef.current=s+1;return s+1})}
        setAnswers(p=>[...p,{q:qs[cur],sel:idx,correct}]);
        setTimeout(()=>{
            if(cur<qs.length-1){setCur(c=>c+1);setSel(null);setTimeLeft(30)}
            else{
                const xpG=scoreRef.current*3;
                addXp(xpG);
                notify(`🧠 Quiz bitti! +${xpG} XP`);
                setMode('result');
            }
        },1000);
    },[sel,qs,cur,addXp,notify]);

    useEffect(()=>{
        if(mode!=='quiz')return;
        clearInterval(timerRef.current);
        timerRef.current=setInterval(()=>{
            setTimeLeft(t=>{
                if(t<=1){handleAnswer(-1);return 30}
                return t-1;
            });
        },1000);
        return()=>clearInterval(timerRef.current);
    },[mode,cur]);

    useEffect(()=>()=>clearInterval(timerRef.current),[]);

    if(mode==='menu'){
        return(
            <div className="space-y-4">
                <h2 style={{fontSize:'18px',fontWeight:'bold',color:'#fff'}}>🧠 Quiz Modu</h2>
                <Card title="Ders Filtresi">
                    <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'16px'}}>
                        {[{id:'all',name:'Tümü'},...SUBS.slice(0,5)].map(s=>(
                            <button key={s.id} onClick={()=>setSubFilter(s.id)}
                                style={{padding:'6px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:subFilter===s.id?(s.color||'#6c63ff'):'#1a1a2e',color:subFilter===s.id?'#fff':'#9ca3af',transition:'all .2s'}}
                            >{s.name||s.id}</button>
                        ))}
                    </div>
                    <Btn onClick={start} className="w-full" s="lg" style={{justifyContent:'center'}}>🚀 Başla (10 Soru)</Btn>
                </Card>
            </div>
        );
    }

    if(mode==='quiz'&&qs[cur]){
        const q=qs[cur];
        const sub=SUBS.find(s=>s.id===q.sub);
        return(
            <div className="space-y-4">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontSize:'13px',fontWeight:'bold',color:'#fff'}}>{cur+1}/{qs.length}</span>
                    <div style={{fontSize:'18px',fontWeight:'bold',color:timeLeft<=10?'#ff5252':'#6c63ff'}}>⏱ {timeLeft}s</div>
                    <span style={{fontSize:'13px',color:'#00c853'}}>✅ {score}</span>
                </div>
                <PBar value={timeLeft} max={30} color={timeLeft<=10?'#ff5252':'#6c63ff'} label={false} size="sm"/>
                <Card>
                    <div style={{marginBottom:'12px'}}>
                        <span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'999px',backgroundColor:sub?.color+'22',color:sub?.color}}>{sub?.name}</span>
                    </div>
                    <p style={{fontSize:'16px',fontWeight:'600',color:'#fff',marginBottom:'16px'}}>{q.q}</p>
                    <div className="space-y-2">
                        {q.opts.map((opt,i)=>{
                            let bg='#1a1a2e';let border='#2a2a3e';let textColor='#e5e7eb';
                            if(sel!==null){
                                if(i===q.ans){bg='rgba(0,200,83,0.15)';border='#00c853'}
                                else if(i===sel&&sel!==q.ans){bg='rgba(255,82,82,0.15)';border='#ff5252'}
                            }
                            return(
                                <button key={i}
                                    onClick={()=>handleAnswer(i)}
                                    disabled={sel!==null}
                                    style={{width:'100%',backgroundColor:bg,border:`1px solid ${border}`,borderRadius:'12px',padding:'12px 16px',textAlign:'left',fontSize:'14px',color:textColor,cursor:sel===null?'pointer':'default',transition:'all .2s',display:'block'}}
                                    onMouseOver={e=>{if(sel===null)e.currentTarget.style.borderColor='#6c63ff'}}
                                    onMouseOut={e=>{if(sel===null)e.currentTarget.style.borderColor='#2a2a3e'}}
                                >
                                    <span style={{color:'#6c63ff',fontWeight:'bold',marginRight:'8px'}}>{String.fromCharCode(65+i)})</span>{opt}
                                </button>
                            );
                        })}
                    </div>
                </Card>
            </div>
        );
    }

    if(mode==='result'){
        const total=answers.length;
        const pct=total>0?Math.round((score/total)*100):0;
        return(
            <div style={{textAlign:'center'}} className="space-y-4">
                <div style={{fontSize:'48px'}}>{pct>=80?'🏆':pct>=60?'👍':'📚'}</div>
                <h3 style={{fontSize:'20px',fontWeight:'bold',color:'#fff'}}>{score}/{total} Doğru</h3>
                <div style={{fontSize:'36px',fontWeight:'bold',color:pct>=80?'#00c853':pct>=60?'#ffd600':'#ff5252'}}>%{pct}</div>
                <div className="space-y-2" style={{maxHeight:'240px',overflowY:'auto'}}>
                    {answers.map((a,i)=>(
                        <div key={i} style={{borderRadius:'12px',padding:'12px',textAlign:'left',backgroundColor:a.correct?'rgba(0,200,83,.1)':'rgba(255,82,82,.1)',border:`1px solid ${a.correct?'#00c853':'#ff5252'}`}}>
                            <div style={{fontWeight:'600',color:'#fff',fontSize:'13px'}}>{a.q.q}</div>
                            {!a.correct&&<div style={{color:'#00c853',fontSize:'12px',marginTop:'4px'}}>✅ {a.q.opts[a.q.ans]}</div>}
                            {a.sel!==-1&&!a.correct&&<div style={{color:'#ff5252',fontSize:'12px'}}>❌ {a.q.opts[a.sel]||'Süre doldu'}</div>}
                        </div>
                    ))}
                </div>
                <Btn onClick={()=>setMode('menu')} className="w-full" style={{justifyContent:'center'}}>Tekrar Oyna</Btn>
            </div>
        );
    }
    return null;
});

// PERFORMANCE ANALYSIS
// ══════════════════════════════════════════════
const PerfAnalysis=memo(({sessions,exams,mistakes})=>{
    const chartRef=useRef(null);
    const chartInst=useRef(null);

    const subStats=useMemo(()=>SUBS.map(s=>({
        ...s,
        totalQ:   sessions.filter(x=>x.subject===s.id).reduce((a,x)=>a+qInt(x),0),
        totalMins:sessions.filter(x=>x.subject===s.id).reduce((a,x)=>a+dInt(x),0),
        mistakes: mistakes.filter(x=>x.subject===s.id).length,
        sessions: sessions.filter(x=>x.subject===s.id).length
    })),[sessions,mistakes]);

    const totalQ=useMemo(()=>sessions.reduce((a,s)=>a+qInt(s),0),[sessions]);
    const totalMins=useMemo(()=>sessions.reduce((a,s)=>a+dInt(s),0),[sessions]);
    const studyDays=useMemo(()=>new Set(sessions.map(s=>s.date)).size,[sessions]);
    const avgDaily=studyDays>0?Math.round(totalQ/studyDays):0;

    useEffect(()=>{
        if(!chartRef.current)return;
        if(chartInst.current){chartInst.current.destroy();chartInst.current=null}
        const active=subStats.filter(s=>s.totalQ>0);
        if(!active.length)return;
        chartInst.current=new Chart(chartRef.current,{
            type:'doughnut',
            data:{
                labels:active.map(s=>s.name),

const StudyCharts=memo(({sessions})=>{
    const r1=useRef(null),r2=useRef(null),i1=useRef(null),i2=useRef(null);
    useEffect(()=>{
        const days=l7();
        const mk=(ref,iref,data,color,lbl)=>{
            if(!ref.current)return;
            if(iref.current){iref.current.destroy();iref.current=null}
            iref.current=new Chart(ref.current,{
                type:'bar',
                data:{
                    labels:days.map(d=>fd(d)),
                    datasets:[{label:lbl,data,backgroundColor:color+'88',borderRadius:6,borderSkipped:false}]
                },
                options:{
                    responsive:true,maintainAspectRatio:false,
                    plugins:{legend:{display:false}},
                    scales:{
                        y:{beginAtZero:true,ticks:{color:'#6b7280',font:{size:9}},grid:{color:'#1a1a2e'}},
                        x:{ticks:{color:'#6b7280',font:{size:9}},grid:{display:false}}
                    }
                }
            });
        };
        mk(r1,i1,days.map(d=>sessions.filter(s=>s.date===d).reduce((a,s)=>a+dInt(s),0)),'#6c63ff','dk');
        mk(r2,i2,days.map(d=>sessions.filter(s=>s.date===d).reduce((a,s)=>a+qInt(s),0)),'#00c853','soru');
        return()=>{
            if(i1.current){i1.current.destroy();i1.current=null}
            if(i2.current){i2.current.destroy();i2.current=null}
        };
    },[sessions]);
    return(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>

            <Card title="📈 Soru"><div style={{height:'130px'}}><canvas ref={r2}/></div></Card>
        </div>
    );
});

const ExamChart=memo(({exams})=>{
    const r=useRef(null),ci=useRef(null);
    useEffect(()=>{
        if(!r.current||exams.length<2)return;
        if(ci.current){ci.current.destroy();ci.current=null}
        const sorted=[...exams].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-15);
        ci.current=new Chart(r.current,{
            type:'line',
            data:{
                labels:sorted.map(e=>fd(e.date)),
                datasets:[
                    {label:'Toplam',data:sorted.map(e=>e.tot||0),borderColor:'#6c63ff',backgroundColor:'#6c63ff22',fill:true,tension:.3,pointRadius:4,pointBackgroundColor:'#6c63ff'},
                    {label:'Türkçe',data:sorted.map(e=>e.tN||0),borderColor:'#29b6f6',tension:.3,pointRadius:3},
                    {label:'Matematik',data:sorted.map(e=>e.mN||0),borderColor:'#ffd600',tension:.3,pointRadius:3}
                ]
            },
            options:{
                responsive:true,maintainAspectRatio:false,
                plugins:{legend:{labels:{color:'#9ca3af',font:{size:10}}}},
                scales:{
                    y:{beginAtZero:true,ticks:{color:'#6b7280'},grid:{color:'#1a1a2e'}},
                    x:{ticks:{color:'#6b7280'},grid:{display:false}}
                }
            }
        });
        return()=>{if(ci.current){ci.current.destroy();ci.current=null}};
    },[exams]);
    if(exams.length<2)return null;
    return<Card title="📈 Puan Trendi"><div style={{height:'200px'}}><canvas ref={r}/></div></Card>;
});

const App=()=>{

    const[mF,setMF]=useState({subject:'matematik',topic:'',desc:'',logic:'',type:'bilgi'});
    const[tI,setTI]=useState({text:'',subject:'matematik',priority:'medium'});
    const[gEdit,setGEdit]=useState({...S.g('goals',{turkce:35,matematik:36,fizik:13,kimya:12,biyoloji:11,tarih:8,cografya:4,felsefe:4,din:4})});

    const today=useMemo(()=>td(),[]);

    // Persist
    useEffect(()=>{S.s('sessions',sessions)},[sessions]);
    useEffect(()=>{S.s('exams',exams)},[exams]);
    useEffect(()=>{S.s('mistakes',mistakes)},[mistakes]);
    useEffect(()=>{S.s('topics',topics)},[topics]);
    useEffect(()=>{S.s('dailyLogs',dailyLogs)},[dailyLogs]);
    useEffect(()=>{S.s('goals',goals)},[goals]);
    useEffect(()=>{S.s('tasks',tasks)},[tasks]);
    useEffect(()=>{S.s('xp',xp)},[xp]);
    useEffect(()=>{S.s('notifOn',notifOn)},[notifOn]);
    useEffect(()=>{S.s('earnedBadges',earnedBadges)},[earnedBadges]);

    // Auto tasks
    useEffect(()=>{
        if(!tasks.some(x=>x.date===today)){
            setTasks(p=>[...p,...genTasks(today)]);
        }
    },[]);// eslint-disable-line

    // Notif interval
    useEffect(()=>{
        if(!notifOn)return;
        const t=setInterval(()=>checkNotifs(sessions),60000);
        return()=>clearInterval(t);
    },[notifOn,sessions]);

    // Badge check
    const streak=useMemo(()=>{
        let s=0;const now=new Date();
        for(let i=0;i<365;i++){
            const d=new Date(now.getTime()-i*864e5);
            const ds=d.toISOString().split('T')[0];
            if(sessions.some(x=>x.date===ds))s++;
            else if(ds!==today)break;
        }
        return s;
    },[sessions,today]);

    useEffect(()=>{
        BADGES.forEach(b=>{
            try{
                if(!earnedBadges.includes(b.id)&&b.check(sessions,exams,mistakes,streak,xp)){
                    setEarnedBadges(p=>[...p,b.id]);
                    setBanner({show:true,msg:`🏅 Yeni rozet: ${b.i} ${b.n}!`,type:'success'});
                    setTimeout(()=>setBanner(v=>({...v,show:false})),4000);
                }
            }catch(e){}
        });
    },[sessions,exams,mistakes,streak,xp]);

    // Welcome banner
    useEffect(()=>{
        setTimeout(()=>{
            const h=new Date().getHours();
            const tQ=sessions.filter(s=>s.date===today).reduce((a,s)=>a+qInt(s),0);
            const msg=h<12?`☀️ Günaydın! YKS'ye ${yksGun()} gün.`:h<18?`📚 Bugün ${tQ}/120 soru.`:`🌆 ${tQ} soru. ${tQ>=120?'🏆 Hedefe ulaştın!':'Devam!'}`;
            setBanner({show:true,msg,type:'info'});
            setTimeout(()=>setBanner(b=>({...b,show:false})),5000);
        },800);
    },[]);// eslint-disable-line

    const notify=useCallback(m=>{
        setToast({show:true,msg:m});
        setTimeout(()=>setToast({show:false,msg:''}),2500);
    },[]);
    const addXp=useCallback(a=>setXp(p=>p+a),[]);
    const closeMd=useCallback(()=>setModal({open:false,type:null}),[]);
    const navTo=useCallback((page,sub)=>{setPg(page);if(sub)setToolTab(sub)},[]);

    // Computed
    const tSess=useMemo(()=>sessions.filter(s=>s.date===today),[sessions,today]);
    const tMins=useMemo(()=>tSess.reduce((a,s)=>a+dInt(s),0),[tSess]);
    const tQ=useMemo(()=>tSess.reduce((a,s)=>a+qInt(s),0),[tSess]);
    const tTasks=useMemo(()=>tasks.filter(t=>t.date===today),[tasks,today]);
    const tDone=useMemo(()=>tTasks.filter(t=>t.completed).length,[tTasks]);
    const lvl=useMemo(()=>gl(xp),[xp]);
    const nLvl=useMemo(()=>nl(xp),[xp]);
    const lvlPct=useMemo(()=>nLvl.min>lvl.min?((xp-lvl.min)/(nLvl.min-lvl.min))*100:100,[xp,lvl,nLvl]);
    const goalSt=useMemo(()=>tQ>=120?'ideal':tQ>=80?'ok':'low',[tQ]);
    const mufSt=useCallback((id)=>{
        const m=MUF.find(x=>x.id===id);if(!m)return{t:0,m:0};
        const all=[...m.d1,...m.d2];const sp=topics[id]||{};
        return{t:all.length,m:all.filter(t=>sp[t]==='mastered').length};
    },[topics]);
    const totalMufPct=useMemo(()=>{let t=0,m=0;MUF.forEach(x=>{const s=mufSt(x.id);t+=s.t;m+=s.m});return t>0?Math.round((m/t)*100):0},[mufSt]);
    const weekReport=useMemo(()=>{
        const days=l7();const ws=sessions.filter(s=>days.includes(s.date));
        const mins=ws.reduce((a,s)=>a+dInt(s),0);

        const sorted=Object.entries(st).sort((a,b)=>b[1]-a[1]);
        return{
            mins,q,
            strong:sorted[0]?SUBS.find(s=>s.id===sorted[0][0])?.name||'—':'—',
            weak:sorted.length>1?SUBS.find(s=>s.id===sorted[sorted.length-1][0])?.name||'—':'—',
            tip:mins<600?'⚠️ Az çalışıyorsun!':mins<1200?'📈 İyi gidiyorsun!':'🔥 Muhteşem hafta!'
        };

    const netPrev=useMemo(()=>{
        const t=cn(parseInt(eF.tD)||0,parseInt(eF.tY)||0);

        return{t,m,f,s,tot:t+m+f+s};

    const weakTopics=useMemo(()=>{
        const tm={};
        mistakes.forEach(m=>{const k=m.subject+'|||'+m.topic;tm[k]=(tm[k]||0)+1});
        return Object.entries(tm).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,c])=>{

        setExams(p=>[...p,{id:Date.now(),date:today,type:eF.type,tD,tY,tN,mD,mY,mN,fD,fY,fN,sD,sY,sN,tot,weak}]);
        setEF({type:'TYT',tD:'',tY:'',mD:'',mY:'',fD:'',fY:'',sD:'',sY:''});
        addXp(25);notify('📝 Deneme kaydedildi! +25 XP');closeMd();
    },[eF,today,addXp,notify,closeMd]);

    const addMistake=useCallback(()=>{
        if(!mF.topic.trim()||!mF.desc.trim()){notify('⚠️ Konu ve hata açıklaması!');return}
        setMistakes(p=>[...p,{...mF,id:Date.now(),date:today,description:mF.desc,correctLogic:mF.logic}]);
        setMF({subject:'matematik',topic:'',desc:'',logic:'',type:'bilgi'});
        addXp(5);notify('📕 +5 XP');closeMd();

    const toggleTask=useCallback(id=>setTasks(p=>p.map(t=>{
        if(t.id===id&&!t.completed){addXp(t.xp);notify(`✅ +${t.xp} XP`);return{...t,completed:true}}
        return t;

        const earnedCount=BADGES.filter(b=>{try{return b.check(sessions,exams,mistakes,streak,xp)}catch{return false}}).length;
        const motivation=useMemo(()=>getRand(),[]);

        return(
            <div className="space-y-4">
                {/* Notif CTA */}
                {!notifOn&&(
                    <div style={{backgroundColor:'rgba(108,99,255,0.1)',border:'1px solid rgba(108,99,255,0.3)',borderRadius:'16px',padding:'16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px',flexWrap:'wrap'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                            <span style={{fontSize:'28px'}}>🔔</span>
                            <div>
                                <div style={{fontSize:'14px',fontWeight:'bold',color:'#fff'}}>Bildirimleri Aç!</div>
                                <div style={{fontSize:'12px',color:'#9ca3af'}}>Günde 6 hatırlatma al</div>
                            </div>

    const MistPg=()=>{
        const[rv,setRv]=useState(false);
        const[cur,setCur]=useState(null);
        const[sa,setSa]=useState(false);
        const[fil,setFil]=useState('all');
        const filtered=useMemo(()=>fil==='all'?mistakes:mistakes.filter(m=>m.subject===fil),[fil,mistakes]);
        const startRev=()=>{
            if(!filtered.length){notify('⚠️ Filtrede hata yok!');return}
            setCur(filtered[Math.floor(Math.random()*filtered.length)]);
            setSa(false);setRv(true);

                        <Btn onClick={startRev} v="success" s="sm">🔄 Tekrar</Btn>
                        <Btn onClick={()=>setModal({open:true,type:'mistake'})} s="sm">+ Ekle</Btn>
                    </div>

                {rv&&cur&&(
                    <div style={{backgroundColor:'#12121a',border:'1px solid rgba(108,99,255,.4)',borderRadius:'16px',padding:'20px',textAlign:'center'}} className="glow">
                        {(()=>{const sub=SUBS.find(s=>s.id===cur.subject);const mt=MTYPES.find(t=>t.id===cur.type);return(<>
                            <div style={{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}}>
                                <span style={{fontSize:'12px',padding:'4px 12px',borderRadius:'999px',backgroundColor:sub?.color+'22',color:sub?.color}}>{sub?.name}</span>
                                {mt&&<span style={{fontSize:'12px',padding:'4px 12px',borderRadius:'999px',backgroundColor:mt.color+'22',color:mt.color}}>{mt.name}</span>}
                            </div>
                            <h3 style={{fontSize:'18px',fontWeight:'bold',color:'#fff',marginBottom:'12px'}}>{cur.topic}</h3>
                            <div style={{backgroundColor:'rgba(255,82,82,.1)',border:'1px solid rgba(255,82,82,.2)',borderRadius:'12px',padding:'12px',marginBottom:'12px'}}>
                                <p style={{fontSize:'14px',color:'#ff5252'}}>❌ {cur.desc||cur.description}</p>
                            </div>
                            {sa&&<div style={{backgroundColor:'rgba(0,200,83,.1)',border:'1px solid rgba(0,200,83,.2)',borderRadius:'12px',padding:'12px',marginBottom:'12px'}}>
                                <p style={{fontSize:'14px',color:'#00c853'}}>✅ {cur.logic||cur.correctLogic||'—'}</p>
                            </div>}

                                <Btn onClick={startRev} v="ghost">→ Sonraki</Btn>
                                <Btn onClick={()=>setRv(false)} v="danger" s="sm">× Kapat</Btn>
                            </div>

                    </div>

                    <button onClick={()=>setFil('all')} style={{padding:'4px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:'600',border:'none',cursor:'pointer',backgroundColor:fil==='all'?'#6c63ff':'#1a1a2e',color:fil==='all'?'#fff':'#9ca3af'}}>Tümü({mistakes.length})</button>

                    )})}
                </div>
                <div className="space-y-2">
                    {filtered.length===0
                        ?<Card><p style={{color:'#6b7280',textAlign:'center',padding:'24px 0',fontSize:'13px'}}>Bu filtrede hata yok!</p></Card>

            <Modal isOpen={modal.open&&modal.type==='exam'} onClose={closeMd} title="📝 Deneme Ekle">
                <div className="space-y-3">
                    <Sel label="Tür" value={eF.type} onChange={v=>setEF(p=>({...p,type:v}))} options={[{value:'TYT',label:'TYT'},{value:'AYT',label:'AYT'},{value:'Deneme',label:'Genel Deneme'}]}/>
                    <div style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center'}}>
                        <span style={{fontSize:'11px',color:'#6b7280'}}>Bölüm</span>
                        <span style={{fontSize:'11px',color:'#6b7280',textAlign:'center'}}>Doğru</span>
                        <span style={{fontSize:'11px',color:'#6b7280',textAlign:'center'}}>Yanlış</span>
                    </div>
                    {[{l:'Türkçe',d:'tD',y:'tY'},{l:'Matematik',d:'mD',y:'mY'},{l:'Fen',d:'fD',y:'fY'},{l:'Sosyal',d:'sD',y:'sY'}].map(x=>(
                        <div key={x.l} style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr',gap:'8px',alignItems:'center'}}>
                            <span style={{fontSize:'13px',color:'#e5e7eb',minWidth:'60px'}}>{x.l}</span>
                            <Inp type="number" value={eF[x.d]} onChange={v=>setEF(p=>({...p,[x.d]:v}))} placeholder="0" min="0"/>
                            <Inp type="number" value={eF[x.y]} onChange={v=>setEF(p=>({...p,[x.y]:v}))} placeholder="0" min="0"/>
                        </div>
                    ))}
                    <div style={{backgroundColor:'#1a1a2e',borderRadius:'10px',padding:'10px',display:'grid',gridTemplateColumns:'repeat(5,1fr)',textAlign:'center',gap:'4px'}}>
                        {[{l:'T',v:netPrev.t},{l:'M',v:netPrev.m},{l:'F',v:netPrev.f},{l:'S',v:netPrev.s}].map(x=>(
                            <div key={x.l}>
                                <div style={{fontSize:'11px',color:'#6b7280'}}>{x.l}</div>
                                <div style={{fontSize:'13px',fontWeight:'bold',color:'#fff'}}>{x.v.toFixed(1)}</div>
                            </div>
                        ))}
                        <div>
                            <div style={{fontSize:'11px',color:'#6b7280'}}>Σ</div>
                            <div style={{fontSize:'14px',fontWeight:'bold',color:'#6c63ff'}}>{netPrev.tot.toFixed(1)}</div>
                        </div>
                    </div>
                    <Btn onClick={addExam} className="w-full" style={{justifyContent:'center'}}>💾 Kaydet (+25 XP)</Btn>
                </div>
            </Modal>

            <Modal isOpen={modal.open&&modal.type==='mistake'} onClose={closeMd} title="📕 Hata Ekle">
                <div className="space-y-3">
                    <Sel label="Ders" value={mF.subject} onChange={v=>setMF(p=>({...p,subject:v}))} options={SUBS.map(s=>({value:s.id,label:s.name}))}/>
                    <Inp label="Konu" value={mF.topic} onChange={v=>setMF(p=>({...p,topic:v}))} placeholder="Konu adı..."/>
                    <Sel label="Hata Türü" value={mF.type} onChange={v=>setMF(p=>({...p,type:v}))} options={MTYPES.map(t=>({value:t.id,label:t.name}))}/>
                    <Txt label="Hata Açıklaması" value={mF.desc} onChange={v=>setMF(p=>({...p,desc:v}))} placeholder="Ne hata yaptım?"/>
                    <Txt label="Doğru Çözüm" value={mF.logic} onChange={v=>setMF(p=>({...p,logic:v}))} placeholder="Doğru yöntem..." rows={2}/>
                    <Btn onClick={addMistake} className="w-full" style={{justifyContent:'center'}}>💾 Kaydet (+5 XP)</Btn>
                </div>
            </Modal>

            <Modal isOpen={modal.open&&modal.type==='task'} onClose={closeMd} title="✅ Görev Ekle">
                <div className="space-y-3">
                    <Inp label="Görev Adı" value={tI.text} onChange={v=>setTI(p=>({...p,text:v}))} placeholder="Matematik – 20 soru"/>
                    <Sel label="Ders" value={tI.subject} onChange={v=>setTI(p=>({...p,subject:v}))} options={[{value:'genel',label:'Genel'},...SUBS.map(s=>({value:s.id,label:s.name}))]}/>
                    <Sel label="Öncelik" value={tI.priority} onChange={v=>setTI(p=>({...p,priority:v}))} options={[{value:'high',label:'🔴 Yüksek'},{value:'medium',label:'🟡 Orta'},{value:'low',label:'🟢 Düşük'}]}/>
                    <Btn onClick={()=>{
                        if(!tI.text.trim()){notify('⚠️ Görev adı gerekli!');return}
                        setTasks(p=>[...p,{id:Date.now(),date:today,text:tI.text,subject:tI.subject,completed:false,xp:10,priority:tI.priority}]);
                        setTI({text:'',subject:'matematik',priority:'medium'});
                        closeMd();notify('✅ Görev eklendi!');
                    }} className="w-full" style={{justifyContent:'center'}}>➕ Ekle</Btn>
                </div>
            </Modal>

            <Toast msg={toast.msg} show={toast.show}/>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
